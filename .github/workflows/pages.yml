name: Publish research website

on:
  push:
    branches: [main]
    paths:
      - 'projects/0001-animation-skills-atlas/**'
      - 'projects/0002-valley-garden/**'
      - 'projects/0003-ai-wide-area-modeling/**'
      - 'projects/0005-wind-return-garden/**'
      - 'projects/0008-pelican-layout-study/**'
      - 'projects/0009-ai-source-field-guide/**'
      - 'projects/0011-everyday-wonders/**'
      - 'projects/0019-shanhe-co-creation/**'
      - 'projects/0021-avatar-video-workflow/**'
      - 'projects/0020-human-nature-film-study/**'
      - 'projects/0016-abyssal-world-notes/**'
      - 'projects/0017-design-reference-atlas/**'
      - 'projects/0018-bot-role-research/**'
      - 'projects/0028-creator-skill-mechanisms/**'
      - 'projects/0031-creative-tools-hub/**'
      - 'projects/0034-openstreetmap-shekou/**'
      - 'projects.json'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/0001-animation-skills-atlas/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Install locked frontend dependencies
        working-directory: projects/0001-animation-skills-atlas/web
        run: npm ci --no-audit --no-fund
      - name: Install locked valley frontend dependency
        working-directory: projects/0002-valley-garden/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate registry and build complete site
        run: |
          python -m unittest discover -s tests -v
          python scripts/projects.py check
          node --test projects/0005-wind-return-garden/tests/*.test.mjs
          python scripts/build_site.py
          python projects/0003-ai-wide-area-modeling/scripts/check_publication.py --site _site/demos/0003-ai-wide-area-modeling
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
