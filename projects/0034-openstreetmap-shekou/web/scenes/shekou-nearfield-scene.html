<script>
(() => {
  const root=document.getElementById('shekou-nearfield-scene');
  const canvas=root.querySelector('.graybox-world'), stage=root.querySelector('.graybox-stage');
  const rainCanvas=root.querySelector('.rain-sample-fx');
  const fallback=root.querySelector('.graybox-fallback');
  const hud=root.querySelector('.graybox-hud'), notice=root.querySelector('.graybox-notice');
  const statusMode=root.querySelector('[data-indicator="mode"]'), statusMotion=root.querySelector('[data-indicator="motion"]');
  const board=root.querySelector('[data-board]'), brake=root.querySelector('[data-hold="brake"]');
  const observe=root.querySelector('[data-observe]'), bikeStatus=root.querySelector('[data-bike]');
  const routes=root.querySelector('[data-routes]');
  const textured=root.querySelector('[data-textured]');
  const weather=root.querySelector('[data-weather]'), sound=root.querySelector('[data-sound]'), exposure=root.querySelector('[data-exposure]');
  const viewButtons=[...root.querySelectorAll('[data-view]')];
  const startButtons=[...root.querySelectorAll('[data-start]')];
  const annotations=[...root.querySelectorAll('[data-world-label]')];
  const data=JSON.parse(document.getElementById('shekou-nearfield-scene-layout').textContent);

function buildSite(data) {
  const vertices=[], overlays=[], spec=data.spec;
  const points={...data.points};
  const routes={
    driveIn:spec.driveIn.coordinates, driveOut:spec.driveOut.coordinates,
    walkNew:spec.walkNew.coordinates, walkMapped:spec.walkMapped.coordinates
  };
  const palette={
    ground:[.57,.63,.59], grid:[.53,.60,.56], lane:[.27,.31,.35],
    bay:[.30,.37,.42], other:[.39,.44,.46], stall:[.87,.88,.80],
    landing:[.61,.56,.45], bike:[.32,.53,.49], walk:[.76,.75,.65],
    ramp:[.76,.70,.55], entry:[.68,.71,.61], curb:[.55,.55,.48],
    building:[.70,.73,.69], wall:[.59,.63,.60], water:[.32,.48,.55],
    driveLine:[.64,.85,.99], footLine:[1,.69,.36], separator:[.88,.88,.77],
    stake:[.74,.53,.32], gate:[.28,.48,.43], grade:[.45,.38,.26]
  };
  const worldBounds={minX:-96,maxX:235,minZ:-235,maxZ:36};
  const bounds={minX:81,maxX:169,minZ:-118,maxZ:-37};
  const zero=0, high=.15;
  const crossStart=spec.bikeCross.coordinates[0];
  const crossEnd=spec.bikeCross.coordinates[1];
  const rampStart=routes.walkNew[3];

  function direction(a,b) {
    const dx=b[0]-a[0],dz=b[1]-a[1],length=Math.hypot(dx,dz)||1;
    return [dx/length,dz/length];
  }
  const uphill=direction(rampStart,routes.walkNew[4]);
  const rampEnd=[rampStart[0]+uphill[0]*3,rampStart[1]+uphill[1]*3];
  const ramp={start:rampStart,end:rampEnd,unit:uphill,length:3,rise:high,slope:high/3};
  points.rampStart=rampStart;
  points.rampEnd=rampEnd;
  points.footSpawn=routes.walkNew[0];
  const rampStation=p=>(p[0]-rampStart[0])*uphill[0]+(p[1]-rampStart[1])*uphill[1];
  const sat=(n)=>Math.max(0,Math.min(1,n));
  const heightAtWalk=p=>{
    const s=rampStation(p);
    return s<-.48?high*sat((-.48-s)/3):high*sat(s/3);
  };

  function ring(g) {
    return g.coordinates[0].slice(0,-1);
  }
  const lane=ring(spec.lane), bay=ring(spec.bay), stall=ring(spec.stall);
  const landing=ring(spec.landing), bike=ring(spec.cycleStrip), walk=ring(spec.walk);
  const pointToSegment=(p,a,b)=>{
    const x=b[0]-a[0],z=b[1]-a[1],u=p[0]-a[0],v=p[1]-a[1];
    const t=sat((u*x+v*z)/(x*x+z*z||1));
    return Math.hypot(u-x*t,v-z*t);
  };
  function makeRegion(vertices) {
    return {vertices,x0:Math.min(...vertices.map(p=>p[0])),x1:Math.max(...vertices.map(p=>p[0])),
      z0:Math.min(...vertices.map(p=>p[1])),z1:Math.max(...vertices.map(p=>p[1]))};
  }
  function contains(region,p,tolerance=0) {
    const {vertices:r,x0,x1,z0,z1}=region;
    if(p[0]<x0-tolerance||p[0]>x1+tolerance||p[1]<z0-tolerance||p[1]>z1+tolerance)return false;
    let inside=false;
    for(let i=0,j=r.length-1;i<r.length;j=i++){
      const [ax,az]=r[j],[bx,bz]=r[i];
      if((az>p[1])!==(bz>p[1])&&p[0]<(bx-ax)*(p[1]-az)/(bz-az)+ax)inside=!inside;
    }
    if(inside||!tolerance)return inside;
    return r.some((b,i)=>pointToSegment(p,r[(i+r.length-1)%r.length],b)<=tolerance);
  }
  const regions={lane:makeRegion(lane),bay:makeRegion(bay),landing:makeRegion(landing),
    cycle:makeRegion(bike),walk:makeRegion(walk)};
  function stripEnds(a,b,half) {
    const [ux,uz]=direction(a,b), nx=-uz*half,nz=ux*half;
    return [[a[0]+nx,a[1]+nz],[b[0]+nx,b[1]+nz],[b[0]-nx,b[1]-nz],[a[0]-nx,a[1]-nz]];
  }
  const crossing=makeRegion(stripEnds(crossStart,crossEnd,.86));
  const walkJoinA=routes.walkNew.at(-2),walkJoinB=routes.walkNew.at(-1);
  const entryDirection=direction(routes.walkMapped[0],points.entry);
  const beyond=[points.entry[0]+entryDirection[0]*2,points.entry[1]+entryDirection[1]*2];
  const entryApproach=makeRegion(stripEnds(walkJoinA,walkJoinB,1.14));
  const entryRegion=makeRegion(stripEnds(walkJoinB,beyond,1.15));
  // The two plan segments meet at an angle. Fill the part between their butt ends.
  const entryJoin=makeRegion(Array.from({length:16},(_,i)=>{
    const th=i*Math.PI/8;
    return [walkJoinB[0]+Math.cos(th)*1.15,walkJoinB[1]+Math.sin(th)*1.15];
  }));
  const insideBounds=(x,z)=>x>=bounds.minX&&x<=bounds.maxX&&z>=bounds.minZ&&z<=bounds.maxZ;

  function surfaceAt(x,z) {
    const p=[x,z], playable=insideBounds(x,z);
    if(contains(regions.walk,p,.01)){
      const s=rampStation(p);
      return {h:heightAtWalk(p),kind:s>=0&&s<3?'ramp':'walk',walk:playable,drive:false};
    }
    if(contains(entryRegion,p,.02)||contains(entryJoin,p,.02)||contains(entryApproach,p,.02))
      return {h:high,kind:'entry',walk:playable,drive:false};
    if(contains(regions.landing,p,.025))
      return {h:zero,kind:'landing',walk:playable,drive:false};
    if(contains(regions.cycle,p,.025))
      return {h:zero,kind:'cycle',walk:playable,drive:false};
    if(contains(crossing,p,.04))
      return {h:zero,kind:'landing',walk:playable,drive:false};
    if(contains(regions.bay,p,.025))
      return {h:zero,kind:'bay',walk:playable,drive:playable};
    if(contains(regions.lane,p,.025))
      return {h:zero,kind:'lane',walk:playable,drive:playable};
    return {h:-.06,kind:'outside',walk:false,drive:false};
  }

  function clearFoot(x,z,radius=.26) {
    if(!surfaceAt(x,z).walk)return false;
    for(let i=0;i<8;i++){
      const inc=i*Math.PI/4;
      if(!surfaceAt(x+Math.sin(inc)*radius,z+Math.cos(inc)*radius).walk)return false;
    }
    return true;
  }

  function clearVehicle(x,z,yaw,{halfLength=2.35,halfWidth=.93}={}) {
    const s=Math.sin(yaw),c=Math.cos(yaw);
    for(const u of [-halfLength,-halfLength*.5,0,halfLength*.5,halfLength]){
      for(const v of [-halfWidth,0,halfWidth]){
        const px=x+s*u+c*v,pz=z+c*u-s*v;
        if(!insideBounds(px,pz)||(!contains(regions.lane,[px,pz],.025)&&
          !contains(regions.bay,[px,pz],.025)))return false;
      }
    }
    return true;
  }

  function push(mesh,p,h,col) {
    mesh.push(p[0],h,p[1],col[0],col[1],col[2]);
  }
  function tri(mesh,a,b,c,ha,hb,hc,col) {
    push(mesh,a,ha,col);push(mesh,b,hb,col);push(mesh,c,hc,col);
  }
  function quad(mesh,a,b,c,d,ha,hb,hc,hd,col) {
    tri(mesh,a,b,c,ha,hb,hc,col);tri(mesh,a,c,d,ha,hc,hd,col);
  }
  function cross(a,b,c) {
    return (b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
  }
  function clip(poly,dist) {
    if(poly.length<3)return [];
    const out=[];
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const a=poly[j],b=poly[i],da=dist(a),db=dist(b);
      if((da>=-.000001)!==(db>=-.000001)){
        const t=da/(da-db);
        out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);
      }
      if(db>=-.000001)out.push(b);
    }
    return out;
  }
  function tidy(poly) {
    const out=poly.filter((p,i)=>{
      const q=poly[(i+poly.length-1)%poly.length];
      return Math.hypot(p[0]-q[0],p[1]-q[1])>.0001;
    });
    return out.filter((p,i)=>{
      const a=out[(i+out.length-1)%out.length],b=out[(i+1)%out.length];
      return Math.abs(cross(a,p,b))>.0000004;
    });
  }
  function floor(mesh,polygon,height,col) {
    const points=tidy(polygon);
    if(points.length<3)return;
    const area=points.reduce((a,p,i)=>{
      const q=points[(i+1)%points.length];
      return a+p[0]*q[1]-q[0]*p[1];
    },0);
    if(area<0)points.reverse();
    const indices=points.map((_,i)=>i);
    const emit=(a,b,c)=>tri(mesh,a,c,b,height(a),height(c),height(b),col);
    while(indices.length>3){
      let ear=-1;
      for(let i=0;i<indices.length;i++){
        const pa=indices[(i+indices.length-1)%indices.length],pb=indices[i],pc=indices[(i+1)%indices.length];
        const a=points[pa],b=points[pb],c=points[pc];
        if(cross(a,b,c)<.0000002)continue;

    if(!graph||graph.ctx.state==='closed')return Promise.resolve(false);
    if(graph.ctx.state==='running')return Promise.resolve(true);
    if(!waking)waking=graph.ctx.resume().then(()=>true,()=>false).finally(()=>{waking=null;});
    return waking;
  }
  function activate() {
    try {
      if(!graph) {
        const Context=globalThis.AudioContext||globalThis.webkitAudioContext;
        if(!Context)return Promise.resolve(false);
        const ctx=new Context();
        try {graph=makeGraph(ctx);}
        catch(error) {ctx.close().catch(()=>{});return Promise.resolve(false);}
      }
      clearTimeout(asleepTimer);
      listening=true;
      return wake();
    } catch(error) {
      return Promise.resolve(false);
    }
  }
  function silence() {
    if(!graph||!listening)return;
    listening=false;
    lastStep=NaN;lastDoor=0;lastMode='walk';
    try {target(graph.master.gain,0,.0001,.034);} catch(error) {return;}
    clearTimeout(asleepTimer);
    asleepTimer=setTimeout(()=>{
      if(listening||!graph||graph.ctx.state!=='running')return;
      graph.ctx.suspend().then(()=>{if(listening)wake();},()=>{});
    },200);
  }
  function oneShot(buffer,volume,rate) {
    const {ctx,master}=graph,voice=ctx.createBufferSource(),gain=ctx.createGain();
    voice.buffer=buffer;
    voice.playbackRate.value=rate;
    gain.gain.value=volume;
    voice.connect(gain);gain.connect(master);
    voice.onended=()=>{voice.disconnect();gain.disconnect();};
    voice.start();
  }
  function update(state,{rain=true,muted=true,active=true}={}) {
    if(!graph||!state)return;
    if(muted||!active||(typeof document!=='undefined'&&document.hidden)){silence();return;}
    try {
      if(!listening) {
        listening=true;
        clearTimeout(asleepTimer);
        wake();
      }
      target(graph.master.gain,.65);
      target(graph.rainGain.gain,rain?.23:0,.001,.16);
      const driving=state.mode==='drive', speed=clamp(Math.abs(state.car?.speed||0),0,10);
      const motorSpeed=39+speed*6.8;
      target(graph.motor.frequency,motorSpeed,.43,.075);
      target(graph.harmonic.frequency,2.05*motorSpeed,.7,.069);
      target(graph.motorFilter.frequency,165+speed*22,2.5,.073);
      target(graph.motorGain.gain,driving?(.023+speed*.0044):0,.001,.11);
      const t=graph.ctx.currentTime, step=Math.floor((state.person?.step||0)/Math.PI);
      if(graph.ctx.state==='running'&&state.visiblePerson&&state.person?.pace>.18&&
        step>lastStep&&step-lastStep<4&&t-lastFoot>.115) {
        oneShot(graph.foot,rain?.11:.075,step%2?.91:1.045);
        lastFoot=t;
      }
      lastStep=step;
      const angle=state.car?.doorAngle||0;
      const wasAtDoor=lastMode==='enter'||lastMode==='exit';
      const opening=(state.mode==='enter'||state.mode==='exit')&&lastDoor<.10&&angle>=.10;
      const closing=wasAtDoor&&lastDoor>=.08&&angle<.08;
      if(graph.ctx.state==='running'&&(opening||closing)&&t-lastLatch>.19) {
        oneShot(graph.latch,closing?.145:.095,closing?.87:1.19);
        lastLatch=t;
      }
      lastDoor=angle;
      lastMode=state.mode;
    } catch(error) {silence();}
  }
  return {activate,update,silence};
}

  function showPoster() {
    root.removeAttribute('data-ready');
    root.dataset.static='true';
    fallback.hidden=false;
    hud.hidden=notice.hidden=true;
    for(const item of annotations)item.hidden=true;
  }
  function initialize(maps) {
    const scans=JSON.parse(document.getElementById('shekou-placed-scans').textContent);
    const world=installNearFieldFrontage(installScannedProps(dressAuthoredSite(buildSite(data),data),data,scans),data);
    const sedan=JSON.parse(document.getElementById('shekou-nearfield-sedan').textContent);
    world.vehicle=readNearFieldVehicle(sedan);
    world.textureAtlas=maps;
    const rider=createCyclist(world,data);
    const motion=createMotion(world,data,{canWalkTo:rider.canWalkTo});
    const renderer=createRenderer(canvas,world,data), state=motion.state;
    state.cyclist=rider.state;
    const rainLayer=createRainLayer(rainCanvas,renderer,world,state);
    const audio=createStreetAudio();
    const pressed=new Set(), heldPointers=new Map();
    const keyFor={
      KeyW:'forward',ArrowUp:'forward',KeyS:'back',ArrowDown:'back',KeyA:'left',ArrowLeft:'left',
      KeyD:'right',ArrowRight:'right',Space:'brake',ShiftLeft:'sprint',ShiftRight:'sprint'
    };
    const surfaces={lane:'车行幅',bay:'停靠湾',landing:'落脚带',cycle:'骑行道',walk:'步道',ramp:'过渡坡',entry:'广场入口',outside:'边缘'};
    const modes={walk:'步行',drive:'驾驶',enter:'正在上车',exit:'正在下车'};
    const step=1/60;
    let frame=0,lastTime=0,spill=0,view='curb',preset='walk',yawOffset=0,pitch=0,settle=0;
    let drag=null,started=false,restored=false,lastMode=state.mode;
    let scenario=null, riderRunning=false, seenYield=false, observed=false;
    const route=[...world.routes.walkNew,...world.routes.walkMapped.slice(1)];
    let walkBase=state.person.yaw;
    let measuredHeight=state.person.y;
    const repaintWindow=15;

    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const write=(node,value)=>{
      if(node.textContent!==value)node.textContent=value;
    };
    function requestDraw() {
      if(!frame&&!document.hidden&&!root.dataset.static) {
        frame=requestAnimationFrame(time=>{
          try {draw(time);}
          catch(error) {console.error('Shekou rain sample',error);rainLayer.freeze();audio.silence();showPoster();}
        });
      }
    }
    function redraw() {
      settle=repaintWindow;
      requestDraw();
    }
    function activeViewButton() {
      return viewButtons.find(button=>button.dataset.view===view);
    }
    function setView(next) {
      if(!['follow','overview','curb','entry','door'].includes(next))return;
      view=next;
      for(const button of viewButtons) {
        const selected=button.dataset.view===next;
        button.setAttribute('aria-pressed',String(selected));
        button.classList.toggle('btn-primary',selected);
      }
      redraw();
    }
    function save() {
      started=true;
      window.openai?.setWidgetState?.({
        modelContent:{version:4,view,preset,showRoutes:routes.checked,rain:weather.checked,sound:sound.checked,exposure:Number(exposure.value),textured:textured.checked},
        privateContent:{yawOffset,pitch}
      })?.catch(()=>{});
    }
    function restore(saved) {
      if(started||restored||saved?.modelContent?.version!==4)return;
      restored=true;
      const model=saved.modelContent, local=saved.privateContent||{};
      if(model.preset==='drive')startScenario('drive',false);
      if(typeof model.showRoutes==='boolean')routes.checked=model.showRoutes;
      if(typeof model.rain==='boolean')weather.checked=model.rain;
      if(typeof model.sound==='boolean')sound.checked=model.sound;
      if(typeof model.textured==='boolean')textured.checked=model.textured;
      if(Number.isFinite(model.exposure))exposure.value=clamp(model.exposure,85,139);
      if(Number.isFinite(local.yawOffset))yawOffset=clamp(local.yawOffset,-Math.PI,Math.PI);
      if(Number.isFinite(local.pitch))pitch=clamp(local.pitch,-.36,.50);
      if(['follow','overview','curb','entry','door'].includes(model.view))setView(model.view);
      rainLayer.refresh(weather.checked);
      redraw();
    }
    function startScenario(next,remember=true) {
      pressed.clear();heldPointers.clear();
      scenario=null;seenYield=observed=false;
      rider.reset();
      riderRunning=true;
      if(next==='drive')motion.startDrive();else motion.startWalk();
      preset=next;
      lastMode=state.mode;
      yawOffset=pitch=0;
      walkBase=state.person.yaw;
      setView('follow');
      if(remember) {
        activeViewButton()?.focus({preventScroll:true});
        save();
      }
    }
    function toggleVehicle() {
      started=true;
      scenario=null;
      motion.toggleVehicle();
      activeViewButton()?.focus({preventScroll:true});
      redraw();
    }
    function gatherInput() {
      const input={walkYaw:walkBase+yawOffset};
      for(const key of pressed)input[keyFor[key]]=true;
      for(const action of heldPointers.values())input[action]=true;
      return input;
    }
    function watchCrossing() {
      pressed.clear();heldPointers.clear();
      motion.startWalk();
      lastMode='walk';
      preset='walk';
      walkBase=state.person.yaw;
      yawOffset=pitch=0;
      rider.reset({distance:14});
      riderRunning=true;
      seenYield=observed=false;
      scenario={i:1,time:0,hold:0,held:false};
      setView('curb');
      save();
    }
    function updateSound() {
      audio.update(state,{rain:weather.checked,muted:!sound.checked,active:!document.hidden&&!root.dataset.static});
    }
    function unlockSound() {
      if(sound.checked)audio.activate();
    }
    function demoInput(dt) {
      scenario.time+=dt;
      const actor=state.person;
      if(scenario.time>25||scenario.i>=route.length) {
        observed=scenario.i>=route.length;
        scenario=null;
        if(observed&&view==='curb')setView('entry');
        return {};
      }
      const sample=world.surfaceAt(actor.x,actor.z);
      const cross=world.points.cycleCross;
      if(!scenario.held&&sample.kind==='cycle'&&Math.hypot(actor.x-cross[0],actor.z-cross[1])<.52) {
        scenario.held=true;
        scenario.hold=.95;
      }
      if(scenario.hold>0) {
        scenario.hold-=dt;
        return {};
      }
      while(scenario.i<route.length&&Math.hypot(route[scenario.i][0]-actor.x,route[scenario.i][1]-actor.z)<.075)
        scenario.i++;
      if(scenario.i>=route.length)return {};
      const goal=route[scenario.i];
      walkBase=Math.atan2(goal[0]-actor.x,goal[1]-actor.z);
      return {forward:true,walkYaw:walkBase};
    }
    function crossingStatus() {
      if(riderRunning) {
        if(rider.state.yielding)return '骑行者看到 B 点有人，正在减速让行。';
        if(seenYield)return '行人离开交会区，骑行者恢复通行。';
        if(rider.state.phase==='passing')return '骑行者正在通过 B 点。';
        if(rider.state.phase==='cleared')return '骑行者已经通过 B 点。';
        return '骑行者接近 B 点。';
      }
      if(observed&&seenYield)return '观察完成。行人经坡道抵达 E，骑行者已恢复通行。';
      if(seenYield)return '试验中骑行者已让行并离开。';
      if(scenario)return '行人正沿坡道走向 E。';
      return '点「观察一次让行」可看全过程。方向键可随时接管。';
    }
    function updateHud() {
      const mode=state.mode, isDriving=mode==='drive', transitioning=mode==='enter'||mode==='exit';
      if(root.dataset.mode!==mode)root.dataset.mode=mode;
      write(statusMode,modes[mode]||'步行');
      const actor=isDriving||mode==='exit'?state.car:state.person;
      const sample=world.surfaceAt(actor.x,actor.z);
      measuredHeight=Number.isFinite(actor.y)?actor.y:sample.h;
      const relativeHeight=(measuredHeight>=.005?'+':'')+measuredHeight.toFixed(2)+' m';
      write(statusMotion,isDriving?Math.round(Math.abs(actor.speed)*3.6)+' km/h':
        ((surfaces[sample.kind]||'场地')+'  '+relativeHeight));
      brake.hidden=!isDriving;
      board.disabled=transitioning;
      write(board,transitioning?(mode==='enter'?'正在上车':'正在下车'):isDriving?'下车':'上车');
      const message=typeof state.notice==='string'?state.notice:'';
      notice.hidden=!message;
      if(message)write(notice,message);
      write(bikeStatus,crossingStatus());
      root.dataset.cycle=rider.state.yielding?'yield':riderRunning?'passing':'idle';
      root.dataset.demo=scenario?'running':'idle';
    }
    function labelWorld(width,height) {
      const occupied=[];
      for(const item of annotations) {
        const name=item.dataset.worldLabel, point=data.points[name];
        const sample=world.surfaceAt(point[0],point[1]);
        const labelHeight=name==='park'?.75:name==='cycleCross'&&view==='curb'?1.85:.39;
        const y=(Number.isFinite(sample.h)?sample.h:0)+labelHeight;
        const pos=renderer.project?.(point[0],y,point[1]);
        const limited=view==='follow'&&((width<512&&name==='cycleCross')||(name==='park'&&state.mode!=='walk'));
        if(!routes.checked||limited||!pos?.visible||pos.x<34||pos.x>width-34||pos.y<46||pos.y>height-60) {
          item.hidden=true;continue;
        }
        const initial=pos.y-9;
        const offset=view==='overview'?[0,35,-35,65]:[0,27,-27];
        const line=offset.map(value=>initial+value).find(y=>
          y>49&&y<height-55&&!occupied.some(p=>Math.abs(p.x-pos.x)<79&&Math.abs(p.y-y)<26));
        if(line===undefined) {
          item.hidden=true;continue;
        }
        occupied.push({x:pos.x,y:line});
        item.hidden=false;
        item.style.transform='translate('+Math.round(pos.x)+'px,'+Math.round(line)+'px) translate(-50%,-100%)';
      }
    }
    function draw(time) {
      frame=0;
      if(root.dataset.static||document.hidden)return;
      const elapsed=lastTime?Math.min(.095,(time-lastTime)/1000):step;
      lastTime=time;
      spill+=elapsed;
      const input=gatherInput();
      while(spill>=step) {
        if(riderRunning) {
          rider.tick(step,state.visiblePerson?state.person:null);
          seenYield ||= Boolean(rider.state.yielding);
          riderRunning=!rider.state.finished;
        }
        motion.tick(step,scenario?demoInput(step):input);
        spill-=step;
      }
      if(state.mode!==lastMode) {
        if(state.mode==='walk') {
          walkBase=state.person.yaw;
          yawOffset=pitch=0;
        } else if(state.mode==='drive') {
          yawOffset=pitch=0;
        }
        lastMode=state.mode;
        settle=repaintWindow;
      }
      const width=stage.clientWidth,height=stage.clientHeight;
      if(width&&height) {
        renderer.draw(state,view,width,height,{yaw:yawOffset,pitch,walkYaw:walkBase+yawOffset,
          showRoutes:routes.checked,rain:weather.checked,exposure:Number(exposure.value)/100,time:time/1000,
          textured:textured.checked});
        if(!root.dataset.ready)root.dataset.ready='true';
        hud.hidden=false;
        updateHud();
        labelWorld(width,height);
        updateSound();
      }
      const active=scenario||riderRunning||pressed.size||heldPointers.size||drag||state.notice||Math.abs(state.car.speed)>.01||
        state.mode==='enter'||state.mode==='exit'||state.person.pace>.012||settle>0;
      if(settle>0)settle--;
      if(active)requestDraw();
      else {lastTime=0;spill=0;}
    }

    for(const button of viewButtons)button.addEventListener('click',()=>{unlockSound();setView(button.dataset.view);save();});
    for(const button of startButtons)button.addEventListener('click',()=>{unlockSound();startScenario(button.dataset.start);});
    observe.addEventListener('click',()=>{unlockSound();watchCrossing();});
    board.addEventListener('click',()=>{unlockSound();toggleVehicle();});
    routes.addEventListener('change',()=>{redraw();save();});
    textured.addEventListener('change',()=>{redraw();save();});
    weather.addEventListener('change',()=>{rainLayer.refresh(weather.checked);unlockSound();redraw();save();});
    sound.addEventListener('change',()=>{unlockSound();updateSound();save();});
    exposure.addEventListener('input',redraw);
    exposure.addEventListener('change',save);
    window.addEventListener('keydown',event=>{
      if(event.ctrlKey||event.metaKey||event.altKey||event.target instanceof HTMLInputElement)return;
      if(event.code==='KeyE') {
        event.preventDefault();
        if(!event.repeat){unlockSound();toggleVehicle();}
        return;
      }
      if(!Object.hasOwn(keyFor,event.code))return;
      if(event.code==='Space'&&(state.mode!=='drive'||(event.target instanceof HTMLButtonElement&&event.target!==activeViewButton())))return;
      event.preventDefault();
      started=true;
      scenario=null;
      if(!event.repeat)unlockSound();
      if(view==='entry'||view==='curb')setView('follow');
      pressed.add(event.code);
      requestDraw();
    });
    window.addEventListener('keyup',event=>{if(pressed.delete(event.code))redraw();});
    canvas.addEventListener('pointerdown',event=>{
      if(event.button!==0)return;
      unlockSound();
      drag={id:event.pointerId,x:event.clientX,y:event.clientY};
      canvas.setPointerCapture(event.pointerId);
      activeViewButton()?.focus({preventScroll:true});
      started=true;
    });
    canvas.addEventListener('pointermove',event=>{
      if(!drag||drag.id!==event.pointerId)return;
      yawOffset=clamp(yawOffset-(event.clientX-drag.x)*.007,-Math.PI,Math.PI);
      pitch=clamp(pitch+(event.clientY-drag.y)*.004,-.36,.50);
      drag={id:event.pointerId,x:event.clientX,y:event.clientY};
      redraw();
    });
    for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>{
      if(!drag)return;
      drag=null;save();redraw();
    });
    for(const button of root.querySelectorAll('[data-hold]')) {
      button.addEventListener('pointerdown',event=>{
        if(event.button!==0)return;
        event.preventDefault();
        scenario=null;
        unlockSound();
        if(view==='entry'||view==='curb')setView('follow');
        button.setPointerCapture(event.pointerId);
        started=true;
        heldPointers.set(event.pointerId,button.dataset.hold);
        requestDraw();
      });
      for(const name of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(name,event=>{
        if(heldPointers.delete(event.pointerId))redraw();
      });
    }
    function clearInput() {
      pressed.clear();heldPointers.clear();drag=null;
    }
    window.addEventListener('blur',()=>{clearInput();redraw();});
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden) {
        rainLayer.freeze();
        audio.silence();
        clearInput();
        if(frame)cancelAnimationFrame(frame);
        frame=lastTime=spill=0;
      } else {rainLayer.refresh(weather.checked);redraw();}
    });
    window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
    canvas.addEventListener('webglcontextlost',()=>{rainLayer.freeze();audio.silence();showPoster();},{once:true});
    new ResizeObserver(()=>{rainLayer.refresh(weather.checked);redraw();}).observe(stage);
    restore(window.openai?.widgetState);
    rainLayer.refresh(weather.checked);
    redraw();
  }
  function decodeMap(src){
    const picture=new Image();
    picture.src=src;
    return picture.decode().then(()=>picture);
  }
  async function start(){
    const data=JSON.parse(document.getElementById('shekou-asset-maps').textContent);
    const [albedo,normal]=await Promise.all([decodeMap(data.albedo),decodeMap(data.normal)]);
    initialize({albedo,normal});
  }
  start().catch(error=>{console.error('Shekou assets',error);showPoster();});
})();
</script>
