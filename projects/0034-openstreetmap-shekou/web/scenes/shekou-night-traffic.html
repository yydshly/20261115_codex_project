<script>
requestAnimationFrame(() => {
  const root = document.getElementById('shekou-night-traffic');
  const stage = root.querySelector('.shekou-stage');
  const canvas = root.querySelector('.shekou-world');
  const rain = root.querySelector('.shekou-rain');
  const weather = root.querySelector('input[type="checkbox"]');
  const exposureControl = root.querySelector('[data-exposure]');
  const error = root.querySelector('.shekou-error');
  function usePoster() { delete root.dataset.ready; root.dataset.static='true'; error.hidden=false; }
  const gl = canvas.getContext('webgl', { alpha:false, antialias:true });
  if (!gl) { usePoster(); return; }
  canvas.addEventListener('webglcontextlost',usePoster);
  try {
    const map = JSON.parse(document.getElementById('shekou-live-geometry').textContent);
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    weather.checked = !reduceMotion.matches;
    const geometry = [];
    const paved = [];
    const glow = [];
    const pools = [];
    let seed = 773895;
    function random() {
      seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const unit = v => { const n = Math.hypot(...v); return v.map(x => x / n); };
    const cross = (a,b) => [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
    const sub = (a,b) => a.map((v,i) => v-b[i]);
    const tint = (c, scale) => c.map(v => v*scale);
    const up = [0,1,0];

    function vertex(list, p, n, c, uv, mat) {
      list.push(...p,...n,...c,...uv,mat);
    }
    function quad(list, a,b,c,d,n, color, mat, w=1, h=1) {
      for (const [p,uv] of [[a,[0,0]],[b,[w,0]],[c,[w,h]],[a,[0,0]],[c,[w,h]],[d,[0,h]]]) {
        vertex(list,p,n,color,uv,mat);
      }
    }
    function flat(list, coords, y, color, mat) {
      for (let i=0;i<coords.length;i+=2) {
        const x=coords[i], z=coords[i+1];
        vertex(list,[x,y,z],up,color,[x,z],mat);
      }
    }
    function walls(list, rings, low, high, color, mat, masonry=false) {
      for (const ring of rings) {
        for (let i=0;i<ring.length-2;i+=2) {
          const x=ring[i], z=ring[i+1], xx=ring[i+2], zz=ring[i+3];
          const w=Math.hypot(xx-x,zz-z);
          if (w<.04) continue;
          const n=[(zz-z)/w,0,(x-xx)/w];
          const side=tint(color, .9+.1*Math.sin(i*45.1+x*.4));
          const upper = masonry && high-low>6 ? low+3.65 : low;
          if(upper>low) {
            quad(list,[x,low,z],[xx,low,zz],[xx,upper,zz],[x,upper,z],n,tint(side,.84),10,w,upper-low);
          }
          quad(list,[x,upper,z],[xx,upper,zz],[xx,high,zz],[x,high,z],n,side,mat,w,high-upper);
        }
      }
    }
    function ribbon(list,a,b,width,y,color,mat) {
      const dx=b[0]-a[0], dz=b[1]-a[1], l=Math.hypot(dx,dz);
      if(l<.02) return;
      const x=-dz/l*width/2,z=dx/l*width/2;
      quad(list,[a[0]+x,y,a[1]+z],[b[0]+x,y,b[1]+z],[b[0]-x,y,b[1]-z],[a[0]-x,y,a[1]-z],up,color,mat,l,width);
    }
    function block(x,y,z,w,h,d,color,mat=0,yaw=0,list=geometry) {
      const sin=Math.sin(yaw),cos=Math.cos(yaw);
      const line=[[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2],[-w/2,-d/2]];
      const ring=line.flatMap(([a,b])=>[x+cos*a-sin*b,z+sin*a+cos*b]);
      walls(list,[ring],y,y+h,color,mat);
      const top=[...ring.slice(0,6),...ring.slice(0,2),...ring.slice(4,8)];
      flat(list,top,y+h,tint(color,.92),mat);
    }
    function pole(x,z,from,to,r,color,mat=0) {
      const ring=[];
      for(let i=0;i<=8;i++) {
        const a=i/8*Math.PI*2;
        ring.push(x+Math.cos(a)*r,z+Math.sin(a)*r);
      }
      walls(geometry,[ring],from,to,color,mat);
      for(let i=0;i<8;i++) flat(geometry,[x,z,...ring.slice(i*2,i*2+4)],to,color,mat);
    }
    function light(x,y,z,c,size) { glow.push(x,y,z,...c,size); }
    function bollard(x,z) {
      pole(x,z,.20,1.02,.13,[.20,.28,.36]);
      pole(x,z,1.02,1.12,.14,[.79,.93,1],7);
      light(x,1.10,z,[.30,.61,1],3.8);
    }
    function lamp(x,z,kind=0) {
      const c=kind ? [1,.65,.34] : [.62,.83,1];
      pole(x,z,.12,5.5,.11,[.20,.28,.38]);
      block(x+.40,5.31,z,.9,.12,.20,[.22,.30,.38]);
      block(x+.77,5.25,z,.32,.13,.28,c,7);
      light(x+.77,5.3,z,c,11);
      pools.push([x+.77,z,kind ? 12 : 10,kind ? 1 : 0]);
    }
    function ellipsoid(list,center,half,color,mat=0,rows=7,sides=12,basis=null,textureSeed=0) {
      const [right,axis,forward]=basis||[[1,0,0],[0,1,0],[0,0,1]];
      function at(row,side) {
        const a=row*Math.PI/rows,b=side*2*Math.PI/sides;
        const d=[Math.sin(a)*Math.cos(b),Math.cos(a),Math.sin(a)*Math.sin(b)];
        const radius=1+textureSeed*.12*Math.sin(row*7.25+side*13.3);
        const p=center.map((v,i)=>v+radius*(d[0]*half[0]*right[i]+d[1]*half[1]*axis[i]+d[2]*half[2]*forward[i]));
        const n=unit(center.map((_,i)=>d[0]/half[0]*right[i]+d[1]/half[1]*axis[i]+d[2]/half[2]*forward[i]));
        return [p,n,tint(color,1+textureSeed*.18*Math.sin(row*19.4+side*4.7))];
      }
      for(let r=0;r<rows;r++)for(let i=0;i<sides;i++) {
        const a=at(r,i), b=at(r,i+1), c=at(r+1,i+1), d=at(r+1,i);
        for(const [p,n,col] of [a,b,c,a,c,d]) vertex(list,p,n,col,[0,0],mat);
      }
    }
    function tree(x,z,scale) {
      pole(x,z,.14,5.3*scale,.23*scale,[.27,.21,.23]);
