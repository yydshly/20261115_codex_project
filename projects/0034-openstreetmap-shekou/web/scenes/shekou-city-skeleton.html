<section id="shekou-city-map" aria-labelledby="sc-title">
  <h2 id="sc-title">蛇口城区骨架</h2>
  <div class="viz-controls" aria-label="地图视角">
    <button class="btn" type="button" data-view="plan" aria-pressed="true">城区鸟瞰</button>
    <button class="btn" type="button" data-view="blocks" aria-pressed="false">街区体块</button>
    <button class="btn btn-ghost" id="sc-fit" type="button">全区</button>
    <button class="btn btn-ghost" id="sc-closer" type="button" aria-label="放大">＋</button>
    <button class="btn btn-ghost" id="sc-farther" type="button" aria-label="缩小">−</button>
  </div>
  <canvas id="sc-canvas" role="img" aria-label="蛇口的滨水地形、建筑体块，及相互连通的车行与步行路线"></canvas>
  <div class="sc-legend text-small">
    <span><i class="sc-build"></i>建筑</span>
    <span><i class="sc-park"></i>绿地</span>
    <span><i class="sc-water"></i>水面</span>
    <span><i class="sc-slice"></i>海上世界小包范围</span>
  </div>
  <div class="viz-controls" aria-label="路网起点和终点">
    <label class="form-label">起点<select class="form-select" id="sc-from" disabled></select></label>
    <label class="form-label">终点<select class="form-select" id="sc-to" disabled></select></label>
  </div>
  <div class="viz-controls" aria-label="线路类型">
    <button class="btn" type="button" data-mode="drive" aria-pressed="true">驾车</button>
    <button class="btn" type="button" data-mode="walk" aria-pressed="false">步行</button>
    <button class="btn btn-primary" type="button" id="sc-play" disabled>播放路线</button>
    <span class="tabular-nums" id="sc-result" aria-live="polite">正在载入城区数据</span>
  </div>
  <output class="text-small text-muted" id="sc-coverage"></output>
  <p class="text-small text-muted">地图数据 © Overture Maps Foundation · © OpenStreetMap contributors · 建筑轮廓含 Qian Shi 等（CC BY 4.0）</p>
  <span class="sc-color-probe" aria-hidden="true"></span>
</section>
<style>
  #shekou-city-map{display:grid;min-width:0;gap:calc(var(--font-size-base,14px)*.61)}
  #shekou-city-map .viz-controls{max-width:100%;flex-wrap:wrap}
  #sc-canvas{display:block;width:100%;height:clamp(340px,65vw,500px);touch-action:pan-y}
  #sc-canvas.sc-drag{cursor:grabbing}
  #shekou-city-map .sc-legend{display:flex;align-items:center;flex-wrap:wrap;gap:calc(var(--font-size-base,14px)*.7)}
  #shekou-city-map .sc-legend span{display:inline-flex;align-items:center;gap:5px}
  #shekou-city-map .sc-legend i{display:block;width:11px;height:9px;background:var(--sc-color)}
  #shekou-city-map .sc-build{--sc-color:color-mix(in srgb,var(--background) 69%,var(--foreground))}
  #shekou-city-map .sc-park{--sc-color:color-mix(in srgb,var(--background) 64%,var(--green,#418465))}
  #shekou-city-map .sc-water{--sc-color:color-mix(in srgb,var(--background) 72%,var(--blue,#368bd2))}
  #shekou-city-map .sc-legend .sc-slice{background:none;border:1px dashed var(--orange,#a96320)}
  #shekou-city-map .sc-color-probe{position:absolute;visibility:hidden;width:0;height:0;pointer-events:none}
  @media(max-width:460px){#sc-canvas{height:clamp(256px,82vw,340px)}}
</style>

<script>
(async () => {
  'use strict';
  const root = document.getElementById('shekou-city-map');
  const el = id => root.querySelector('#sc-' + id);
  const canvas = el('canvas');
  const ctx = canvas.getContext('2d');
  const background = document.createElement('canvas');
  const base = background.getContext('2d');
  const result = el('result');
  const from = el('from');
  const to = el('to');
  const play = el('play');
  const probe = root.querySelector('.sc-color-probe');
  const metersPerUnit = .5;
  const mainWidths = [2.05, 1.85, 1.50, 1.20, .8, .58, .43, .40, .36];

  try {
    const packed = document.getElementById('sc-packed').textContent.trim();
    const bytes = Uint8Array.from(atob(packed), character => character.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const city = await new Response(stream).json();
    const { edges, nodes, anchors, counts, meta } = city;
    const { signal } = new AbortController();
    const selection = { from: 0, to: 4, mode: 'drive', view: 'plan' };
    const camera = { x: 0, z: 0, zoom: 1 };
    let width = 1, height = 1, dpr = 1, viewSize = 1;
    let request = 0, dirty = true, drag = null, playback = null, route = null, palette;
    const lengthOf = flat => {
      let length = 0;
      for (let i = 2; i < flat.length; i += 2) {
        length += Math.hypot(flat[i] - flat[i - 2], flat[i + 1] - flat[i - 1]);
      }
      return length;
    };
    const roadLengths = edges.map(edge => lengthOf(edge[6]));
    const networks = { drive: Array.from(nodes, () => []), walk: Array.from(nodes, () => []) };
    const roadGroups = mainWidths.map(() => []);
    edges.forEach(([u, v, category, access, name, level, flat], i) => {
      if (level >= 0) roadGroups[category].push(flat);
      if (access & 1) networks.drive[u].push([v, i, 1]);
      if (access & 2) networks.drive[v].push([u, i, -1]);
      if (access & 4) networks.walk[u].push([v, i, 1]);
      if (access & 8) networks.walk[v].push([u, i, -1]);
    });
    const buildings = city.buildings.map(([buildingHeight, evidence, rings]) => {
      const ring = rings[0];
      const bounds = [Infinity, Infinity, -Infinity, -Infinity];
      for (let i = 0; i < ring.length; i += 2) {
        bounds[0] = Math.min(bounds[0], ring[i]);
        bounds[1] = Math.min(bounds[1], ring[i + 1]);
        bounds[2] = Math.max(bounds[2], ring[i]);
        bounds[3] = Math.max(bounds[3], ring[i + 1]);
      }
      return { h: buildingHeight / 5, evidence, rings, bounds };
    });
    const extent = meta.extent.map(v => v / metersPerUnit);
    const boundary = [extent[0], extent[1], extent[2], extent[1], extent[2], extent[3], extent[0], extent[3]];
    const localSlice = meta.validationSlice.map(v => Math.round(v / metersPerUnit));
    const slice = [localSlice[0], localSlice[1], localSlice[2], localSlice[1],
      localSlice[2], localSlice[3], localSlice[0], localSlice[3]];
    const num = new Intl.NumberFormat('zh-CN');
    const formatDistance = m => m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m';

    function queueDraw(needsBackground = true) {
      dirty ||= needsBackground;
      if (!request && root.isConnected) request = requestAnimationFrame(draw);
    }

    function theme() {
      const resolve = value => {
        probe.style.color = value;
        return getComputedStyle(probe).color;
      };
      palette = {
        empty: resolve('var(--background,#fff)'),
        land: resolve('color-mix(in srgb,var(--background,#fff) 87%,var(--muted-foreground,#62716f))'),
        water: resolve('color-mix(in srgb,var(--background,#fff) 72%,var(--blue,#368bd2))'),
        park: resolve('color-mix(in srgb,var(--background,#fff) 64%,var(--green,#418465))'),
        minor: resolve('color-mix(in srgb,var(--background,#fff) 88%,var(--muted-foreground,#62716f))'),
        main: resolve('color-mix(in srgb,var(--background,#fff) 76%,var(--muted-foreground,#62716f))'),
        casing: resolve('color-mix(in srgb,var(--background,#fff) 45%,var(--muted-foreground,#62716f))'),
        building: resolve('color-mix(in srgb,var(--background,#fff) 69%,var(--foreground,#242828))'),
        roof: resolve('color-mix(in srgb,var(--background,#fff) 85%,var(--foreground,#242828))'),
        wall: resolve('color-mix(in srgb,var(--background,#fff) 55%,var(--foreground,#242828))'),
        side: resolve('color-mix(in srgb,var(--background,#fff) 70%,var(--foreground,#242828))'),
        ink: resolve('var(--foreground,#242828)'),
        labelBg: resolve('var(--background,#fff)'),
        route: resolve('var(--blue,#036bbb)'),
        walker: resolve('var(--green,#14724b)'),
        slice: resolve('var(--orange,#a96320)'),
      };
      queueDraw();
    }

    function project(x, z, y = 0) {
      const a = x - camera.x;
      const b = z - camera.z;
      const scale = viewSize * camera.zoom;
      if (selection.view === 'plan') return [width / 2 + a * scale, height / 2 + b * scale];
      return [width / 2 + (.955 * a - .296 * b) * scale,
        height / 2 + ((.296 * a + .955 * b) * .61 - y * .88) * scale];
    }

    function appendPath(context, flat, closed = false, y = 0) {
      for (let i = 0; i < flat.length; i += 2) {
        const [x, z] = project(flat[i], flat[i + 1], y);
        if (i) context.lineTo(x, z);
        else context.moveTo(x, z);
      }
      if (closed) context.closePath();
    }

    function fillRings(context, rings, color, y = 0) {
      context.beginPath();
      for (const ring of rings) appendPath(context, ring, true, y);
      context.fillStyle = color;
      context.fill('evenodd');
    }

    function drawRoads() {
      base.lineJoin = 'round';
      base.lineCap = 'round';
      for (let category = roadGroups.length - 1; category >= 0; --category) {
        if (selection.view === 'plan' && camera.zoom < 1.4 && category >= 6) continue;
        base.beginPath();
        for (const road of roadGroups[category]) appendPath(base, road);
        const lineWidth = mainWidths[category] * Math.min(3.4, Math.sqrt(camera.zoom));
        if (category <= 3) {
          base.strokeStyle = palette.casing;
          base.lineWidth = lineWidth + .7;
          base.stroke();
        }
        base.strokeStyle = category <= 4 ? palette.main : palette.minor;
        base.lineWidth = lineWidth;
        base.stroke();
      }
    }

    function drawBuildings() {
      if (selection.view === 'plan') {
        base.beginPath();
        for (const { rings } of buildings) for (const ring of rings) appendPath(base, ring, true);
        base.fillStyle = palette.building;
        base.fill('nonzero');
        return;
      }
      const visible = buildings.filter(({ bounds: [a, b, c, d], h }) => {
        const [x, z] = project((a + c) / 2, (b + d) / 2);
        const radius = .8 * Math.hypot(c - a, d - b) * viewSize * camera.zoom;
        return x + radius > 0 && x - radius < width && z + radius > 0 && z - radius - h * viewSize * camera.zoom < height;
      });
      visible.sort((a, b) => (.296 * (a.bounds[0] + a.bounds[2] - b.bounds[0] - b.bounds[2])
          + .955 * (a.bounds[1] + a.bounds[3] - b.bounds[1] - b.bounds[3])));
      for (const { rings, h } of visible) {
        for (const ring of rings) {
          for (let i = 2; i < ring.length; i += 2) {
            const [a, b, c, d] = ring.slice(i - 2, i + 2);
            const [ax, az] = project(a, b), [bx, bz] = project(c, d);
            const [, ah] = project(a, b, h), [, bh] = project(c, d, h);
            base.beginPath(); base.moveTo(ax, az); base.lineTo(bx, bz);
            base.lineTo(bx, bh); base.lineTo(ax, ah); base.closePath();
            base.fillStyle = (c - a) + (b - d) < 0 ? palette.wall : palette.side;
            base.fill();
          }
        }
        fillRings(base, rings, palette.roof, h);
      }
    }

    function drawBackground() {
      base.setTransform(dpr, 0, 0, dpr, 0, 0);
      base.fillStyle = palette.empty;
      base.fillRect(0, 0, width, height);
      base.save();
      base.beginPath(); appendPath(base, boundary, true); base.clip();
      fillRings(base, [boundary], palette.water);
      for (const polygon of city.land) fillRings(base, polygon, palette.land);
      for (const polygon of city.green) fillRings(base, polygon, palette.park);
      for (const polygon of city.water) fillRings(base, polygon, palette.water);
      drawRoads();
      drawBuildings();
      base.beginPath(); appendPath(base, slice, true);
      base.strokeStyle = palette.slice; base.setLineDash([4, 4]); base.lineWidth = 1.35; base.stroke();
      base.restore();
    }

    function dot(x, z, radius, color) {
      ctx.beginPath(); ctx.arc(x, z, radius, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
      ctx.strokeStyle = palette.labelBg; ctx.lineWidth = 1.7; ctx.stroke();
    }

    function drawLabels(color) {
      ctx.font = '500 12px system-ui,sans-serif';
      ctx.textBaseline = 'middle';
      const used = [];
      const order = [...new Set([selection.from, selection.to, ...anchors.keys()])];
      for (const i of order) {
        const [name, x, z] = anchors[i];
        const selected = i === selection.from || i === selection.to;
        const [sx, sz] = project(x, z);
        if (sx < 7 || sx > width - 7 || sz < 10 || sz > height - 10) continue;
        dot(sx, sz, selected ? 4.5 : 3.2, selected ? color : palette.ink);
        const tw = ctx.measureText(name).width;
        const opts = [[sx + 8, sz], [sx - tw - 8, sz], [sx - tw / 2, sz - 13], [sx - tw / 2, sz + 13]];
        const chosen = opts.find(([px, pz]) => px >= 3 && px + tw < width - 3 && pz > 8 && pz < height - 8
          && !used.some(([a, b, c]) => Math.abs(pz - b) < 15 && px < a + c + 6 && px + tw + 6 > a));
        if (!chosen) continue;
        const [px, pz] = chosen;
        used.push([px, pz, tw]);
        ctx.strokeStyle = palette.labelBg; ctx.lineWidth = 3.1; ctx.lineJoin = 'round';
        ctx.strokeText(name, px, pz);
        ctx.fillStyle = palette.ink; ctx.fillText(name, px, pz);
      }
    }

    function draw(timestamp) {
      request = 0;
      if (dirty) {
        drawBackground();
        dirty = false;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.drawImage(background, 0, 0, width, height);
      const color = selection.mode === 'walk' ? palette.walker : palette.route;
      if (route) {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); appendPath(ctx, route.flat);
        ctx.strokeStyle = palette.labelBg; ctx.lineWidth = 6; ctx.stroke();
        ctx.strokeStyle = color; ctx.lineWidth = 3.3; ctx.stroke();
        ctx.beginPath();
        appendPath(ctx, [...anchors[selection.from].slice(1, 3), ...route.flat.slice(0, 2)]);
        appendPath(ctx, [...route.flat.slice(-2), ...anchors[selection.to].slice(1, 3)]);
        ctx.setLineDash([2, 3]); ctx.lineWidth = 1.6; ctx.stroke(); ctx.setLineDash([]);
      }
      drawLabels(color);
      const scaleMetres = viewSize * camera.zoom > .22 ? 100 : viewSize * camera.zoom > .1 ? 250 : 500;
      const scalePixels = scaleMetres / metersPerUnit * viewSize * camera.zoom;
      const north = selection.view === 'plan' ? [0, -1] : [.296, -.5826];
      ctx.font = '12px system-ui,sans-serif';
      ctx.fillStyle = palette.ink; ctx.strokeStyle = palette.ink; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(14, height - 16); ctx.lineTo(14 + scalePixels, height - 16);
      ctx.moveTo(14, height - 20); ctx.lineTo(14, height - 12);
      ctx.moveTo(14 + scalePixels, height - 20); ctx.lineTo(14 + scalePixels, height - 12); ctx.stroke();
      ctx.fillText(scaleMetres + ' m', 14, height - 28);
      ctx.beginPath(); ctx.moveTo(width - 28, height - 18);
      ctx.lineTo(width - 28 + north[0] * 21, height - 18 + north[1] * 21); ctx.stroke();
      ctx.fillText('北', width - 34 + north[0] * 23, height - 25 + north[1] * 21);
      if (playback) {
        if (playback.live) {
          if (!playback.last) playback.last = timestamp;
          playback.t += Math.min(70, timestamp - playback.last);
          playback.last = timestamp;
        }
        const fraction = Math.min(1, playback.t / playback.duration);
        const point = sample(route, fraction);
        dot(...project(...point), 7, color);
        if (fraction === 1 && playback.live) {
          playback.live = false;
          play.textContent = '重播路线';
          result.textContent = distanceLabel() + ' · 已到达';
        } else if (playback.live) {
          queueDraw(false);
        }
      }
    }

    function sample(path, fraction) {
      const goal = path.cumulative[path.cumulative.length - 1] * fraction;
      let low = 0, high = path.cumulative.length - 1;
      while (high - low > 1) {
        const mid = (low + high) >> 1;
        if (path.cumulative[mid] < goal) low = mid;
        else high = mid;
      }
      const p = path.cumulative[high] - path.cumulative[low];
      const f = p ? (goal - path.cumulative[low]) / p : 0;
      const [x, z] = path.flat.slice(low * 2, low * 2 + 2);
      return [x + (path.flat[high * 2] - x) * f, z + (path.flat[high * 2 + 1] - z) * f];
    }

    function shortestPath(start, goal) {
      const best = new Float64Array(nodes.length).fill(Infinity);
      const previous = new Array(nodes.length);
      const todo = [[0, start]];
      best[start] = 0;
      while (todo.length) {
        let min = 0;
        for (let i = 1; i < todo.length; ++i) if (todo[i][0] < todo[min][0]) min = i;
        const [distance, current] = todo[min];
        todo[min] = todo[todo.length - 1]; todo.pop();
        if (current === goal) break;
        if (distance !== best[current]) continue;
        for (const [next, edge, direction] of networks[selection.mode][current]) {
          const cost = distance + roadLengths[edge];
          if (cost >= best[next]) continue;
          best[next] = cost;
          previous[next] = [current, edge, direction];
          todo.push([cost, next]);
        }
      }
      if (!Number.isFinite(best[goal]) || start === goal) return null;
      const chain = [];
      for (let node = goal; node !== start;) {
        const record = previous[node];
        chain.push(record);
        node = record[0];
      }
      const flat = [], cumulative = [];
      let distance = 0;
      for (const [, edge, direction] of chain.reverse()) {
        const points = edges[edge][6];
        for (let i = direction > 0 ? 0 : points.length - 2; i >= 0 && i < points.length; i += direction * 2) {
          const x = points[i], z = points[i + 1];
          if (flat.length && x === flat[flat.length - 2] && z === flat[flat.length - 1]) continue;
          if (flat.length) distance += Math.hypot(x - flat[flat.length - 2], z - flat[flat.length - 1]);
          flat.push(x, z); cumulative.push(distance);
        }
      }
      return { flat, cumulative, metres: distance * metersPerUnit, segments: chain.length };
    }

    function distanceLabel() {
      return (selection.mode === 'drive' ? '驾车' : '步行') + ' ' + formatDistance(route.metres);
    }

    function fitAll() {
      camera.x = (extent[0] + extent[2]) / 2;
      camera.z = (extent[1] + extent[3]) / 2;
      camera.zoom = 1;
      queueDraw();
    }

    function fitRoute() {
      if (!route) return fitAll();
      const xs = [anchors[selection.from][1], anchors[selection.to][1]];
      const zs = [anchors[selection.from][2], anchors[selection.to][2]];
      route.flat.forEach((coord, i) => (i % 2 ? zs : xs).push(coord));
      const a = Math.min(...xs), b = Math.min(...zs), c = Math.max(...xs), d = Math.max(...zs);
      camera.x = (a + c) / 2; camera.z = (b + d) / 2;
      const diagonal = Math.hypot(c - a, d - b);
      camera.zoom = Math.max(1, Math.min(6, Math.min(width, height) * .73 / ((diagonal + 380) * viewSize)));
      queueDraw();
    }

    function recalculate({ fit = true } = {}) {
      playback = null;
      play.textContent = '播放路线';
      const modeIndex = selection.mode === 'drive' ? 5 : 6;
      const start = anchors[selection.from][modeIndex], goal = anchors[selection.to][modeIndex];
      route = shortestPath(start, goal);
      play.disabled = !route;
      result.textContent = route ? distanceLabel() : '请选择两个不同的地点';
      if (fit) fitRoute();
      else queueDraw();
    }

    function resize() {
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      if (!width || !height) return;
      dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = background.width = Math.round(width * dpr);
      canvas.height = background.height = Math.round(height * dpr);
      const w = extent[2] - extent[0], h = extent[3] - extent[1];
      viewSize = Math.min((width - 24) / w, (height - 22) / h);
      queueDraw();
    }

    function save() {
      const update = window.openai?.setWidgetState?.({ modelContent: {
        start: anchors[selection.from][0], destination: anchors[selection.to][0], mode: selection.mode,
      }, privateContent: { ...selection } });
      update?.catch(() => {});
    }

    function apply(saved) {
      if (saved && Number.isInteger(saved.from) && Number.isInteger(saved.to)
          && anchors[saved.from] && anchors[saved.to]) {
        selection.from = saved.from;
        selection.to = saved.to;
        selection.mode = saved.mode === 'walk' ? 'walk' : 'drive';
        selection.view = saved.view === 'blocks' ? 'blocks' : 'plan';
      }
      from.value = String(selection.from); to.value = String(selection.to);
      for (const button of root.querySelectorAll('[data-mode],[data-view]')) {
        button.setAttribute('aria-pressed', String(button.dataset.mode === selection.mode || button.dataset.view === selection.view));
      }
    }

    function zoom(factor) {
      camera.zoom = Math.min(18, Math.max(.74, camera.zoom * factor));
      queueDraw();
    }

    for (const select of [from, to]) {
      anchors.forEach(([label], i) => select.add(new Option(label, String(i))));
      select.disabled = false;
      select.addEventListener('change', () => {
        selection.from = Number(from.value); selection.to = Number(to.value);
        recalculate(); save();
      }, { signal });
    }
    for (const button of root.querySelectorAll('[data-view]')) {
      button.addEventListener('click', () => {
        selection.view = button.dataset.view;
        apply();
        if (selection.view === 'blocks') fitRoute(); else fitAll();
        save();
      }, { signal });
    }
    for (const button of root.querySelectorAll('[data-mode]')) {
      button.addEventListener('click', () => {
        selection.mode = button.dataset.mode;
        apply(); recalculate(); save();
      }, { signal });
    }
    el('fit').addEventListener('click', fitAll, { signal });
    el('closer').addEventListener('click', () => zoom(1.42), { signal });
    el('farther').addEventListener('click', () => zoom(1 / 1.42), { signal });
    play.addEventListener('click', () => {
      if (!route) return;
      if (playback?.live) {
        playback.live = false;
        play.textContent = '继续播放';
        result.textContent = distanceLabel() + ' · 已暂停';
        return;
      }
      if (!playback || playback.t >= playback.duration) {
        playback = { t: 0, last: 0, duration: Math.max(2700, Math.min(10500, route.metres * 2.7)), live: true };
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) fitRoute();
      }
      playback.live = true; playback.last = 0;
      play.textContent = '暂停';
      result.textContent = distanceLabel() + ' · 路线播放中';
      queueDraw(false);
    }, { signal });
    canvas.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      drag = [e.pointerId, e.clientX, e.clientY];
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('sc-drag');
    }, { signal });
    canvas.addEventListener('pointermove', e => {
      if (!drag || drag[0] !== e.pointerId) return;
      const scale = viewSize * camera.zoom;
      const x = (e.clientX - drag[1]) / scale;
      const z = (e.clientY - drag[2]) / scale;
      if (selection.view === 'plan') { camera.x -= x; camera.z -= z; }
      else { camera.x -= .955 * x + .296 * z / .61; camera.z -= -.296 * x + .955 * z / .61; }
      drag = [e.pointerId, e.clientX, e.clientY];
      queueDraw();
    }, { signal });
    canvas.addEventListener('lostpointercapture', () => {
      drag = null; canvas.classList.remove('sc-drag');
    }, { signal });
    window.addEventListener('openai:set_globals', e => {
      const saved = e.detail?.globals?.widgetState?.privateContent;
      if (saved) { apply(saved); recalculate(); }
    }, { signal });
    const scheme = matchMedia('(prefers-color-scheme: dark)');
    scheme.addEventListener('change', theme, { signal });
    const observer = new MutationObserver(theme);
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style', 'data-theme'] });
    const size = new ResizeObserver(resize);
    size.observe(canvas);
    el('coverage').textContent = ((extent[2] - extent[0]) * metersPerUnit / 1000).toFixed(1) + ' × '
      + ((extent[3] - extent[1]) * metersPerUnit / 1000).toFixed(1) + ' km · '
      + num.format(counts.building) + ' 个建筑体块 · ' + num.format(counts.edges) + ' 段道路及步道';
    theme(); resize(); fitAll();
    apply(window.openai?.widgetState?.privateContent);
    recalculate({ fit: selection.view === 'blocks' });
  } catch (error) {
    result.setAttribute('role', 'alert');
    result.textContent = '城区数据载入失败';
    console.error(error);
  }
})();

</script>
