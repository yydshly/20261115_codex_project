        if(blocked) {
          step=0;
          car.speed=0;
          car.response='yield';
        } else {
          car.s=next;
          Object.assign(car,pose);
          if(space===0)car.speed=0;
        }
        car.brake=car.braking=blocked||braking;
        car.wheel+=step/.34;
        carLightData.set([car.x,car.z,Math.sin(car.yaw),Math.cos(car.yaw)],index*4);
      }
    }

    function updatePedestrians(dt) {
      const directionX=Math.sin(ride.yaw), directionZ=Math.cos(ride.yaw);
      const lead=clamp(ride.speed*.62,-6,6);
      const ahead={x:ride.x+directionX*lead,z:ride.z+directionZ*lead};
      const distance=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
      for(const person of people) {
        if(hornPulse&&person.lastHorn!==hornPulse.id) {
          person.lastHorn=hornPulse.id;
          if(distance(person,hornPulse)<19) {
            person.alert=1.65;
            person.heard=hornPulse;
          }
        }
        person.alert=Math.max(0,(person.alert||0)-dt);
        person.pause=Math.max(0,person.pause-dt);
        const route=person.road.pose(person.s,person.offset);
        const nearbyWalker=!driving&&distance(pawn,person)<1.32;
        const nearbyDriver=driving&&Math.abs(ride.speed)>.65&&
          (distance(ride,person)<3.45||distance(ahead,person)<2.8);
        person.yieldFor=Math.max(0,(person.yieldFor||0)-dt);
        if(nearbyDriver||nearbyWalker) {
          person.yieldFor=.8;
          person.yieldTo=nearbyDriver?'driver':'walker';
        }
        const alerted=person.alert>0;
        let danger=null;
        if(person.yieldFor>0) {
          if(driving&&person.yieldTo==='driver'&&distance(person,ahead)<5)danger=ahead;
          if(!driving&&person.yieldTo==='walker'&&distance(person,pawn)<3)danger=pawn;
        }
        if(!danger&&alerted&&distance(person,person.heard)<6)danger=person.heard;
        const talking=person.interacting&&!driving;
        const lookingAt=talking?pawn:danger||((alerted&&person.heard)||null);
        person.response=talking?'talk':danger?'avoid':alerted?'alert':'walk';
        const side=person.sideStep||0;
        let goalSide=talking?side:0;
        if(danger&&!talking) {
          const away=(person.x-danger.x)*Math.cos(route.yaw)-(person.z-danger.z)*Math.sin(route.yaw);
          goalSide=(Math.abs(away)<.08?(person.offset<0?-1:1):Math.sign(away))*1.22;
        }
        const nextSide=approach(side,goalSide,(danger?1.62:1.05)*dt);
        const steppingAside=danger&&Math.abs(side-goalSide)>.14;
        const step=person.pause>0||talking||steppingAside?0:person.stride*(danger?.6:alerted?.24:1)*dt;
        const s=clamp(person.s+person.direction*step,1,person.road.length-1);

        function safeAt(spot,lateral) {
          if(lateral&&(!clear(spot.x,spot.z)||
            streetLanes.some(road=>road.location(spot.x,spot.z).nearest<2.0)))return false;
          if(hitsCar(spot.x,spot.z,ride,.44)||
            parkedCars.some(car=>hitsCar(spot.x,spot.z,car,.39))||
            traffic.some(car=>hitsCar(spot.x,spot.z,car,.39)))return false;
          return driving||distance(spot,pawn)>.83||distance(spot,pawn)>distance(person,pawn)+.0005;
        }
        let goal=null, nextDistance=person.s, appliedSide=side;
        if(!talking) {
          const options=[[s,nextSide],[s,side],[person.s,nextSide]];
          for(const [distanceOnRoute,offset] of options) {
            const spot=person.road.pose(distanceOnRoute,person.offset+offset);
            if(!safeAt(spot,Math.abs(offset-side)>.0005))continue;
            goal=spot;nextDistance=distanceOnRoute;appliedSide=offset;
            break;
          }
        }
        let movement=0;
        let facing=route.yaw+(person.direction<0?Math.PI:0);
        if(goal) {
          const actual=distance(person,goal);
          // Route joins can change the offset normal abruptly. Cap lateral displacement.
          const mix=actual>0?Math.min(1,(person.stride+1.8)*dt/actual):1;
          const x=person.x+(goal.x-person.x)*mix, z=person.z+(goal.z-person.z)*mix;

            movement=Math.hypot(x-person.x,z-person.z);
            if(movement>.003&&danger)facing=Math.atan2(x-person.x,z-person.z);
            person.x=x;person.z=z;
            person.sideStep=side+(appliedSide-side)*mix;
            person.s+=(nextDistance-person.s)*mix;
            if(step>0&&(person.s<=1.001||person.s>=person.road.length-1.001)) {

            }

        }
        if(lookingAt&&(!danger||movement<.003||talking)) {
          facing=Math.atan2(lookingAt.x-person.x,lookingAt.z-person.z);
        }
        if(movement>0)person.step+=movement*6.9;
        person.yaw+=angleDelta(person.yaw,facing)*(1-Math.exp(-dt*8));
        person.pace=approach(person.pace,clamp(movement/(person.stride*dt),0,1.22)*.55,dt*3.9);
      }
    }

    function background(dt) {
      updateTraffic(dt);
      updatePedestrians(dt);
    }

    function updateHUD() {

      if(directionsButton.textContent!==directionsLabel)directionsButton.textContent=directionsLabel;
      if(actionHint.textContent!=='F · '+directionsLabel)actionHint.textContent='F · '+directionsLabel;
      notice.hidden=!street||performance.now()>noticeUntil;
      touchBrake.hidden=!driving||Boolean(vehicleTransition);
      board.disabled=Boolean(vehicleTransition)||(driving?Math.abs(ride.speed)>2.7:!nearby());
      const label=vehicleTransition?(vehicleTransition.kind==='enter'?'正在上车':'正在下车'):
        driving?(board.disabled?'停车后下车':'下车'):(board.disabled?'靠近车辆':'上车');
      if(board.textContent!==label) board.textContent=label;
      const personMode=vehicleTransition?label:driving?'驾驶':'步行';
      if(mode.textContent!==personMode)mode.textContent=personMode;
      speedText.hidden=!driving;
      const speed=Math.round(Math.abs(ride.speed)*3.6)+' km/h';

    }
    function showNotice(message,duration=1300) {
      if(notice.textContent!==message)notice.textContent=message;
      noticeUntil=performance.now()+duration;
      notice.hidden=false;
    }
    let vehicleTransition=null;
    const doorRear=-.35,doorFront=.63,doorHinge=.96,doorSwing=1.08;

    function doorSwingPoint(side,angle,fraction) {
      const at=bodyFrame(ride).at, span=(doorFront-doorRear)*fraction;
      return at(side*(doorHinge+Math.sin(angle)*span),0,doorFront-Math.cos(angle)*span);
    }
    function doorCanOpen(side) {
      for(const part of [.42,.73,1])for(const angle of [0,doorSwing*.44,doorSwing*.77,doorSwing]) {
        const [x,,z]=doorSwingPoint(side,angle,part);
        if(!clear(x,z)||!clear(x+.12,z)||!clear(x-.12,z)||!clear(x,z+.12)||!clear(x,z-.12)||
          parkedCars.some(car=>hitsCar(x,z,car,.12))||traffic.some(car=>hitsCar(x,z,car,.12))||
          people.some(person=>Math.hypot(x-person.x,z-person.z)<.33))return false;
      }
      return true;
    }
    function localGround(x,z) {
      const [worldX,,worldZ]=bodyFrame(ride).at(x,0,z);
      return [worldX,worldZ];
    }
    function walkableSegment(from,to) {
      const steps=Math.max(1,Math.ceil(Math.hypot(to[0]-from[0],to[1]-from[1])/.19));
      for(let i=1;i<=steps;i++) {
        const t=i/steps;
        if(!clearFoot(from[0]+(to[0]-from[0])*t,from[1]+(to[1]-from[1])*t))return false;
      }
      return true;
    }
    function entryPath(side,stand) {
      const start=[pawn.x,pawn.z], routes=[[stand]];
      for(const end of [-2.91,2.91]) {
        const near=localGround(side*1.84,end);
        routes.push([near,stand],[localGround(-side*1.84,end),near,stand]);
      }
      let best=null,bestLength=Infinity;
      for(const route of routes) {
        let from=start,length=0;
        for(const to of route) {
          if(!walkableSegment(from,to)){length=Infinity;break;}
          length+=Math.hypot(to[0]-from[0],to[1]-from[1]);
          from=to;
        }

      }
      return best;
    }
    function changeVehicle() {
      if(view!=='street'||vehicleTransition)return;
      if(board.disabled) {
        showNotice(driving?'停车后再下车':'走到车旁再上车');
        requestDraw();
        return;
      }
      for(const side of [-1,1]) {
        const stand=localGround(side*1.94,-.04);
        if(!clearFoot(...stand)||!doorCanOpen(side))continue;
        const path=driving?[]:entryPath(side,stand);
        if(!path)continue;
        vehicleTransition={kind:driving?'exit':'enter',side,stand,path,time:0,blocked:0,
          visible:!driving};
        ride.doorSide=side;
        ride.speed=0;
        dirtyPlay=false;interacted=true;
        updateHUD();requestDraw();
        streetButton.focus({preventScroll:true});
        return;
      }
      showNotice(driving?'旁边没有下车空间':'请绕到有空位的车门旁');
      requestDraw();
    }
    function stepVehicleTransition(dt) {
      const action=vehicleTransition;

      const release=()=>{
        ride.doorAngle=0;pawn.crouch=0;pawn.pace=0;
        vehicleTransition=null;
      };
      const abort=()=>{
        if(entering&&action.time>0) [pawn.x,pawn.z]=action.stand;
        release();dirtyPlay=false;
        showNotice('车门旁有障碍');
        updateHUD();rememberView();
        return true;
      };
      if(action.path.length) {
        const next=action.path[0],dx=next[0]-pawn.x,dz=next[1]-pawn.z;
        const distance=Math.hypot(dx,dz),step=Math.min(distance,dt*4.2);
        const x=distance>.001?pawn.x+dx/distance*step:next[0];
        const z=distance>.001?pawn.z+dz/distance*step:next[1];
        if(!clearFoot(x,z)) {
          pawn.pace=approach(pawn.pace,0,dt*5);
          action.blocked+=dt;
          return action.blocked>.38?abort():true;
        }
        action.blocked=0;
        pawn.x=x;pawn.z=z;
        if(distance>.02)turnToward(dx,dz);
        pawn.step+=step*6.2;pawn.pace=approach(pawn.pace,.8,dt*7);
        if(distance-step<.005)action.path.shift();
        return true;
      }
      if(action.time===0&&(!doorCanOpen(action.side)||!clearFoot(...action.stand)))return abort();
      if(!entering&&action.time>.24&&!clearFoot(...action.stand))return abort();
      action.time+=dt;
      const t=clamp(action.time/.79,0,1);
      const ease=value=>{const x=clamp(value,0,1);return x*x*(3-2*x);};
      ride.doorAngle=doorSwing*ease(t/.27)*(1-ease((t-.72)/.28));
      const shift=ease((t-.25)/.46),seat=entering?shift:1-shift;
      action.visible=entering?t<.72:t>.29;
      const [x,z]=localGround(action.side*(1.94-1.41*seat),-.04+.17*seat);
      pawn.x=x;pawn.z=z;pawn.crouch=seat;
      pawn.pace=approach(pawn.pace,Math.sin(shift*Math.PI)*.65,dt*6);
      pawn.step+=dt*6;
      const face=ride.yaw+(entering?-action.side:action.side)*Math.PI*.5;
      turnToward(Math.sin(face),Math.cos(face));
      if(t<1)return true;
      if(entering) {
        pawn.x=action.stand[0];pawn.z=action.stand[1];
        driving=true;driveOrbit=0;
      } else {
        driving=false;
        streetOrbit=ride.yaw+driveOrbit;
        pawn.yaw=ride.yaw;
      }
      release();
      streetPitch=0;dirtyPlay=false;noticeUntil=0;
      updateHUD();rememberView();
      return true;
    }

    function simulate(dt) {
      if(vehicleTransition)return stepVehicleTransition(dt);
      if(view!=='street')return false;
      const throttle=Number(held('KeyW','ArrowUp'))-Number(held('KeyS','ArrowDown'));
      const steer=Number(held('KeyD','ArrowRight'))-Number(held('KeyA','ArrowLeft'));
      if(driving) {
        const braking=held('Space','Space');
        ride.brake=ride.braking=braking||(throttle<0&&ride.speed>0);
        if(braking) ride.speed=approach(ride.speed,0,19*dt);
        else if(throttle>0) ride.speed=approach(ride.speed,15.5,7.8*dt);
        else if(throttle<0) ride.speed=approach(ride.speed,-4.4,(ride.speed>0?15:5)*dt);
        else ride.speed=approach(ride.speed,0,3.2*dt);
        if(Math.abs(ride.speed)>.025) {
          const yaw=ride.yaw-steer*Math.sign(ride.speed)*Math.min(Math.abs(ride.speed)*.21,1.46)*dt;
          const x=ride.x+Math.sin(yaw)*ride.speed*dt,z=ride.z+Math.cos(yaw)*ride.speed*dt;
          if(clearCar(x,z,yaw)) {
            ride.x=x;ride.z=z;ride.yaw=yaw;
            ride.wheel+=ride.speed*dt/.34;
          } else {
            ride.speed=0;ride.brake=ride.braking=true;
            if(throttle)showNotice('有障碍物，车辆已停');
          }
        }
        return Boolean(throttle||steer||braking||Math.abs(ride.speed)>.025);
      }
      const moving=Boolean(throttle||steer);
      const pace=held('ShiftLeft','ShiftRight')?5.55:2.6;
      let moved=0;
      if(moving) {
        const dx=Math.sin(streetOrbit)*throttle-Math.cos(streetOrbit)*steer;
        const dz=Math.cos(streetOrbit)*throttle+Math.sin(streetOrbit)*steer;
        const d=Math.hypot(dx,dz), oldX=pawn.x,oldZ=pawn.z;
        const x=pawn.x+dx/d*pace*dt,z=pawn.z+dz/d*pace*dt;
        if(clearFoot(x,pawn.z))pawn.x=x;
        if(clearFoot(pawn.x,z))pawn.z=z;
        pawn.yaw+=angleDelta(pawn.yaw,Math.atan2(dx,dz))*(1-Math.exp(-dt*16));
        moved=Math.hypot(pawn.x-oldX,pawn.z-oldZ);
        pawn.step+=moved*(pace>3?5.2:6.2);
        if(moved<.001)showNotice('前方有障碍物');
      }
      pawn.pace=approach(pawn.pace,moved>0?(pace>3?1:.70):0,dt*6.5);
      return moving||pawn.pace>.001;
    }
    function cameraPose(dt) {
      if(view!=='street') {
        const v=presets[view],offset=sub(v.eye,v.look),t=Math.hypot(offset[0],offset[2]);
        const phi=Math.atan2(offset[2],offset[0])+angle;
        return {eye:[v.look[0]+Math.cos(phi)*t,clamp(v.eye[1]+lift,2.7,320),v.look[2]+Math.sin(phi)*t],look:v.look, moving:false};
      }
      const a=driving?ride:pawn;
      const yaw=driving?ride.yaw+driveOrbit:streetOrbit;
      const x=Math.sin(yaw),z=Math.cos(yaw),distance=driving?9.6:6.9;
      const shoulder=driving?.18:.78;
      const look=[a.x+x*(driving?3.55:2.5)+z*shoulder,driving?1.34:1.47,a.z+z*(driving?3.55:2.5)-x*shoulder];
      const pivot=[a.x,driving?1.66:1.72,a.z];
      function cameraClear(candidate) {
        const span=sub(candidate,pivot),steps=Math.ceil(Math.hypot(...span)/.25);
        const radial=[[-.25,0],[.25,0],[0,-.25],[0,.25],[0,0]];
        for(let i=1;i<=steps;i++) {
          const at=pivot.map((v,j)=>v+span[j]*i/steps);
          if(cameraWalls.some(box=>at[1]>box.low-.15&&at[1]<box.high+.14&&
            radial.some(([rx,rz])=>contains(box,at[0]+rx,at[2]+rz)))) {
            return pivot.map((v,j)=>v+span[j]*Math.max(0,i-2)/steps);

      }
      const eye=cameraClear([a.x-x*distance+z*shoulder,(driving?4.27:3.09)+streetPitch,a.z-z*distance-x*shoulder]);
      if(!follow)follow={eye,look};
      const mix=1-Math.exp(-dt*11.5);
      follow.eye=cameraClear(follow.eye.map((v,i)=>v+(eye[i]-v)*mix));
      follow.look=follow.look.map((v,i)=>v+(look[i]-v)*mix);

    }

    function bodyFrame(actor) {

    function pawnModel(list,actor=pawn,appearance=null) {

      }
      function skybox(mirror) {
        gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
        gl.useProgram(sky); gl.bindBuffer(gl.ARRAY_BUFFER,screen);
        attribute(sky,'aCoord',2,2,0);
        gl.uniform2f(uniform(sky,'uHorizon'),horizon,0);
        gl.uniform1f(uniform(sky,'uAspect'),aspect);
        gl.uniform1f(uniform(sky,'uExposure'),exposure);
        gl.uniform1f(uniform(sky,'uMirror'),mirror?1:0);
        gl.drawArrays(gl.TRIANGLES,0,3);
        gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
      }
      function solids(data,count,w,h,mirror) {
        gl.useProgram(mesh); camera(mesh,mirror);
        gl.uniform2f(uniform(mesh,'uSize'),w,h);
        gl.uniform4fv(uniform(mesh,'uPools[0]'),poolData);
        gl.uniform4f(uniform(mesh,'uVehicle'),ride.x,ride.z,Math.sin(ride.yaw),Math.cos(ride.yaw));
        gl.uniform2f(uniform(mesh,'uWalker'),driving?-800:pawn.x,driving?-800:pawn.z);
        gl.uniform4fv(uniform(mesh,'uTraffic[0]'),carLightData);
        gl.uniform1f(uniform(mesh,'uExposure'),exposure);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D,mirror||!hasReflection?safeTexture:reflection);
        gl.uniform1i(uniform(mesh,'uReflection'),0);
        gl.bindBuffer(gl.ARRAY_BUFFER,data);
        attribute(mesh,'aPos',3,12,0); attribute(mesh,'aNorm',3,12,3);
        attribute(mesh,'aColor',3,12,6); attribute(mesh,'aUV',2,12,9); attribute(mesh,'aMat',1,12,11);
        gl.drawArrays(gl.TRIANGLES,0,count/12);
        for(const attr of ['aPos','aNorm','aColor','aUV','aMat']) {
          const index=attributeLocation(mesh,attr);
          if(index>=0)gl.disableVertexAttribArray(index);
        }
      }
      function halos(h,mirror,count) {
        gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
        gl.useProgram(sprites); camera(sprites,mirror);
        gl.uniform1f(uniform(sprites,'uZoom'),h*.53);
        for(const [source,length] of [[stars,glow.length/7],[movingStars,count]]) {
          if(!length)continue;
          gl.bindBuffer(gl.ARRAY_BUFFER,source);
          attribute(sprites,'aP',3,7,0); attribute(sprites,'aC',3,7,3); attribute(sprites,'aGlow',1,7,6);
          gl.drawArrays(gl.POINTS,0,length);
        }
        for(const attr of ['aP','aC','aGlow']) gl.disableVertexAttribArray(attributeLocation(sprites,attr));
        gl.disable(gl.BLEND); gl.depthMask(true);
      }
      function textSigns(mirror) {
        gl.useProgram(signProgram); camera(signProgram,mirror);
        gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
        gl.activeTexture(gl.TEXTURE0); gl.uniform1i(uniform(signProgram,'uSign'),0);
        for(const sign of signArt) {
          gl.bindTexture(gl.TEXTURE_2D,sign.tex); gl.bindBuffer(gl.ARRAY_BUFFER,sign.data);
          attribute(signProgram,'aPos',3,5,0); attribute(signProgram,'aUV',2,5,3);
          gl.drawArrays(gl.TRIANGLES,0,6);
        }
        for(const attr of ['aPos','aUV'])gl.disableVertexAttribArray(attributeLocation(signProgram,attr));
        gl.disable(gl.BLEND);
      }
      const animated=movingGeometry(visible);
      if(hasReflection) {
        gl.bindFramebuffer(gl.FRAMEBUFFER,framebuffer); gl.viewport(0,0,reflectedWidth,reflectedHeight);
        gl.clear(gl.DEPTH_BUFFER_BIT);
        skybox(true);
        solids(solid,geometry.length,reflectedWidth,reflectedHeight,true);
        solids(movingMesh,animated.triangles,reflectedWidth,reflectedHeight,true);
        textSigns(true);
        halos(reflectedHeight,true,animated.lights);
      }
      gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,width,height);
      gl.clear(gl.DEPTH_BUFFER_BIT);
      skybox(false);
      solids(ground,paved.length,width,height,false);
      solids(solid,geometry.length,width,height,false);
      solids(movingMesh,animated.triangles,width,height,false);
      textSigns(false);
      halos(height,false,animated.lights);
      root.dataset.ready='true';
      updateHUD(); drawMap();
      if(dirtyPlay&&!active&&!moving&&!keys.size&&!touchKeys.size) {
        dirtyPlay=false; rememberView();
      }
      if(!document.hidden) {
        if(active||moving) requestDraw();
        else idleFrame=setTimeout(requestDraw,39);
      }
    }
    function requestDraw() {
      clearTimeout(idleFrame);
      if(!queued) { queued=true; requestAnimationFrame(drawScene); }
    }
    const rainCtx=rain.getContext('2d');
    const drops=Array.from({length:104},()=>[random(),random(),.34+random()*.65,random(),random()]);
    let rainFrame=0;
    function wash(time) {
      rainFrame=0;
      rainCtx.clearRect(0,0,rain.width,rain.height);
      if(!weather.checked||root.hasAttribute('data-static')||document.hidden) return;
      const t=reduceMotion.matches?0:time/1000;
      for(const [u,v,s,k,o] of drops) {
        const y=((v+t*s*.86)%1)*rain.height;
        const x=((u+t*s*.105)%1)*rain.width;
        const foreground=o>.9;
        const l=(foreground?.029+.050*s:.009+.027*s)*rain.height;
        rainCtx.lineWidth=Math.max(1,rain.width/780)*(foreground?1.6:.72);
        rainCtx.strokeStyle='rgba(182,205,229,'+((.035+k*.16)*(foreground?1.37:1)).toFixed(3)+')';
        rainCtx.beginPath(); rainCtx.moveTo(x,y); rainCtx.lineTo(x+l*.23,y+l); rainCtx.stroke();
      }
      if(!reduceMotion.matches) rainFrame=requestAnimationFrame(wash);
    }
    function redrawRain() {
      cancelAnimationFrame(rainFrame);
      if(rainCtx) rainFrame=requestAnimationFrame(wash);
    }
    function resize() {
      const width=stage.clientWidth,height=stage.clientHeight;
      if(width===previousWidth&&height===previousHeight)return;
      previousWidth=width; previousHeight=height;
      if(!width||!height)return;
      const dpr=Math.min(devicePixelRatio,1.45);
      canvas.width=rain.width=Math.round(width*dpr);
      canvas.height=rain.height=Math.round(height*dpr);
      target(Math.max(1,Math.round(canvas.width*.61)),Math.max(1,Math.round(canvas.height*.61)));
      requestDraw(); redrawRain();
    }
    const controls=[...root.querySelectorAll('[data-view]')];
    function selectControls() {
      for(const other of controls) {
        const selected=other.dataset.view===view;
        other.setAttribute('aria-pressed',String(selected));
        other.classList.toggle('btn-primary',selected);
      }
      updateHUD();
    }
    function rememberView() {
      if(vehicleTransition)return;
      interacted=true;
      window.openai?.setWidgetState?.({
        modelContent:{version:4,view,rain:weather.checked,sound:soundSwitch.checked,exposure:Number(exposureControl.value),mode:driving?'driving':'walking'},
        privateContent:{angle,lift,streetOrbit,driveOrbit,streetPitch,streetGuidance,
          pawn:[pawn.x,pawn.z,pawn.yaw],ride:[ride.x,ride.z,ride.yaw]}
      })?.catch(()=>{});
    }
    function clearRestoredPoses() {
      for(const vehicle of traffic) {
        const conflicts=pose=>carsOverlap(pose,ride)||
          (!driving&&hitsCar(pawn.x,pawn.z,pose,.34))||
          traffic.some(other=>other!==vehicle&&carsOverlap(pose,other));
        if(!conflicts(vehicle))continue;
        for(let offset=6;offset<vehicle.road.length;offset+=6) {
          const s=(vehicle.s+offset)%vehicle.road.length, pose=vehicle.road.pose(s,0);
          if(conflicts(pose))continue;
          Object.assign(vehicle,pose,{s});
          break;
        }
      }
      for(const person of people) {
        const conflicts=pose=>hitsCar(pose.x,pose.z,ride,.45)||
          (!driving&&Math.hypot(pose.x-pawn.x,pose.z-pawn.z)<.85);
        if(!conflicts(person))continue;
        const lengths=person.road.length-2;
        for(let offset=2;offset<lengths;offset+=2) {
          const s=1+(Math.max(0,person.s-1)+offset)%lengths;
          const pose=person.road.pose(s,person.offset);
          if(conflicts(pose))continue;
          Object.assign(person,pose,{s,yaw:pose.yaw+(person.direction<0?Math.PI:0)});
          break;
        }
      }
    }
    function restoreView(state) {
      if(!state?.modelContent||interacted||hydrated) return;
      const saved=state.modelContent, local=state.privateContent||{};
      hydrated=true;
      if(typeof saved.rain==='boolean') weather.checked=saved.rain;
      if(typeof saved.sound==='boolean') soundSwitch.checked=saved.sound;
      if(Number.isFinite(saved.exposure)) exposureControl.value=clamp(saved.exposure,85,145);
      if(saved.version===4) {
        if(['street','plaza','aerial'].includes(saved.view))view=saved.view;
        const validPose=pose=>Array.isArray(pose)&&pose.length===3&&pose.every(Number.isFinite);
        if(validPose(local.ride)&&clearCar(...local.ride,false)) {
          [ride.x,ride.z,ride.yaw]=local.ride;
          driving=saved.mode==='driving';
        }
        if(validPose(local.pawn)&&clearFoot(local.pawn[0],local.pawn[1],false)) [pawn.x,pawn.z,pawn.yaw]=local.pawn;
        if(Number.isFinite(local.angle))angle=clamp(local.angle,-1.12,1.12);
        if(Number.isFinite(local.lift))lift=clamp(local.lift,-30,85);
        if(Number.isFinite(local.streetOrbit))streetOrbit=local.streetOrbit;
        if(Number.isFinite(local.driveOrbit))driveOrbit=clamp(local.driveOrbit,-2.25,2.25);
        if(Number.isFinite(local.streetPitch))streetPitch=clamp(local.streetPitch,-1.3,5.0);
        if(typeof local.streetGuidance==='boolean')streetGuidance=local.streetGuidance;
        clearRestoredPoses();
      }
      follow=null;
      selectControls(); requestDraw(); redrawRain();
    }
    for(const button of controls) button.addEventListener('click',()=>{
      view=button.dataset.view; angle=lift=0; follow=null; keys.clear(); touchKeys.clear();
      if(view!=='street') {
        ride.speed=0;ride.brake=ride.braking=false;
        pawn.pace=0;
      }
      selectControls();
      requestDraw();
      rememberView();
    });
    let drag=null;
    canvas.addEventListener('pointerdown',e=>{
      if(e.button!==0)return;
      interacted=true;
      if(view==='street')streetButton.focus({preventScroll:true});
      drag={id:e.pointerId,x:e.clientX,y:e.clientY};
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove',e=>{
      if(!drag||drag.id!==e.pointerId)return;
      if(view==='street') {
        if(driving) driveOrbit=clamp(driveOrbit-(e.clientX-drag.x)*.007,-2.25,2.25);
        else streetOrbit-=(e.clientX-drag.x)*.007;
        streetPitch=clamp(streetPitch+(e.clientY-drag.y)*.055,-1.3,5.0);
      } else {
        angle=clamp(angle+(e.clientX-drag.x)*.0055,-1.12,1.12);
        lift=clamp(lift+(e.clientY-drag.y)*.42,-30,85);
      }
      drag={id:e.pointerId,x:e.clientX,y:e.clientY};
      requestDraw();
    });
    for(const event of ['pointerup','pointercancel','lostpointercapture']) canvas.addEventListener(event,()=>{
      if(drag) { drag=null; rememberView(); }
    });
    const movementKeys=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight','ShiftLeft','ShiftRight','Space']);
    window.addEventListener('keydown',event=>{
      if(view!=='street'||event.altKey||event.ctrlKey||event.metaKey) return;
      const inputFocused=event.target instanceof HTMLInputElement;
      if(inputFocused&&(event.code.startsWith('Arrow')||event.code==='Space'))return;
      if(event.code==='Space'&&(!driving||(event.target instanceof HTMLButtonElement&&event.target!==streetButton)))return;
      if(event.code==='KeyH'&&!inputFocused&&driving) {
        event.preventDefault();
        if(!event.repeat)pressHorn();
      } else if(event.code==='KeyF'&&!inputFocused&&canAskDirections()) {
        event.preventDefault();
        if(!event.repeat&&askDirections())rememberView();
      } else if(event.code==='KeyE') {
        event.preventDefault();
        if(!event.repeat) {
          activateAudio();changeVehicle();
        }
      } else if(movementKeys.has(event.code)) {
        event.preventDefault();
        if(inputFocused&&event.code.startsWith('Key'))streetButton.focus({preventScroll:true});
        dirtyPlay=interacted=true;
        if(!event.repeat&&driving)activateAudio();
        keys.add(event.code); requestDraw();
      }
    });
    window.addEventListener('keyup',event=>{if(keys.delete(event.code))requestDraw();});
    function releaseControls() {
      keys.clear();touchKeys.clear();ride.speed=0;
      updateMotorSound();
      if(dirtyPlay){dirtyPlay=false;rememberView();}
    }
    window.addEventListener('blur',()=>{releaseControls();requestDraw();});
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){releaseControls();clearTimeout(idleFrame);}
      else {lastFrame=0;requestDraw();redrawRain();}
    });
    board.addEventListener('click',()=>{activateAudio();changeVehicle();});
    hornButton.addEventListener('click',()=>{
      pressHorn();
      streetButton.focus({preventScroll:true});
    });
    directionsButton.addEventListener('click',()=>{
      if(askDirections())rememberView();
      streetButton.focus({preventScroll:true});
    });
    for(const button of root.querySelectorAll('[data-key]')) {
      const key=button.dataset.key;
      button.addEventListener('pointerdown',e=>{
        if(e.button!==0)return;
        e.preventDefault(); button.setPointerCapture(e.pointerId);
        dirtyPlay=interacted=true;
        if(driving)activateAudio();
        touchKeys.set(e.pointerId,key);requestDraw();
      });
      for(const event of ['pointerup','pointercancel','lostpointercapture']) {
        button.addEventListener(event,e=>{if(touchKeys.delete(e.pointerId))requestDraw();});
      }
    }
    weather.addEventListener('change',()=>{redrawRain(); requestDraw(); rememberView();});
    soundSwitch.addEventListener('change',()=>{activateAudio();updateMotorSound();rememberView();});
    exposureControl.addEventListener('input',requestDraw);
    exposureControl.addEventListener('change',rememberView);
    reduceMotion.addEventListener('change',redrawRain);
    window.addEventListener('openai:set_globals',e=>restoreView(e.detail?.globals?.widgetState));
    new ResizeObserver(resize).observe(stage);
    selectControls();
    resize();
    restoreView(window.openai?.widgetState);
  } catch(e) {
    console.error('Shekou scene:',e);
    usePoster();
  }
});
</script>
