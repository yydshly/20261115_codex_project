<script>
(() => {
  const root=document.getElementById('shekou-street-run');
  const canvas=root.querySelector('.graybox-world'), stage=root.querySelector('.graybox-stage');
  const rainCanvas=root.querySelector('.rain-sample-fx');

  const statusMode=root.querySelector('[data-indicator="mode"]'), statusMotion=root.querySelector('[data-indicator="motion"]');

  const data=JSON.parse(document.getElementById('shekou-street-run-layout').textContent);

function buildSite(data) {
  const vertices=[], overlays=[], spec=data.spec;
  const points={...data.points};
  const routes={
    driveIn:spec.driveIn.coordinates, driveOut:spec.driveOut.coordinates,
    walkNew:spec.walkNew.coordinates, walkMapped:spec.walkMapped.coordinates
  };
  const palette={
    ground:[.57,.63,.59], grid:[.53,.60,.56], lane:[.27,.31,.35],
    bay:[.30,.37,.42], other:[.39,.44,.46], stall:[.87,.88,.80],
    landing:[.61,.56,.45], bike:[.32,.53,.49], walk:[.76,.75,.65],
    ramp:[.76,.70,.55], entry:[.68,.71,.61], curb:[.55,.55,.48],
    building:[.70,.73,.69], wall:[.59,.63,.60], water:[.32,.48,.55],
    driveLine:[.64,.85,.99], footLine:[1,.69,.36], separator:[.88,.88,.77],
    stake:[.74,.53,.32], gate:[.28,.48,.43], grade:[.45,.38,.26]
  };
  const worldBounds={minX:-96,maxX:235,minZ:-235,maxZ:36};
  const bounds={minX:81,maxX:169,minZ:-118,maxZ:-37};
  const zero=0, high=.15;
  const crossStart=spec.bikeCross.coordinates[0];
  const crossEnd=spec.bikeCross.coordinates[1];
  const rampStart=routes.walkNew[3];

  function direction(a,b) {
    const dx=b[0]-a[0],dz=b[1]-a[1],length=Math.hypot(dx,dz)||1;
    return [dx/length,dz/length];
  }
  const uphill=direction(rampStart,routes.walkNew[4]);
  const rampEnd=[rampStart[0]+uphill[0]*3,rampStart[1]+uphill[1]*3];
  const ramp={start:rampStart,end:rampEnd,unit:uphill,length:3,rise:high,slope:high/3};
  points.rampStart=rampStart;
  points.rampEnd=rampEnd;
  points.footSpawn=routes.walkNew[0];
  const rampStation=p=>(p[0]-rampStart[0])*uphill[0]+(p[1]-rampStart[1])*uphill[1];
  const sat=(n)=>Math.max(0,Math.min(1,n));

    for(const [k,glyph] of characters.entries()) {
      const x=k===0?-.247:.039;
      for(const trace of glyph)for(let i=1;i<trace.length;i++) {
        const [xa,ya]=trace[i-1],[xb,yb]=trace[i];
        bladeLine(x+xa*.209,1.31+ya*.285,x+xb*.209,1.31+yb*.285,.018,glow);
      }
    }
    bladeLine(-.120,1.166,.115,1.166,.011,glow);
    bladeLine(.114,1.166,.055,1.213,.011,glow);
    bladeLine(.114,1.166,.055,1.119,.011,glow);
    collisionVolume(blade,-.21,.21,-.40,.40,-.06,1.84);
  }
  light(entry.p(.14,0),2.47,[1,.72,.51],2.61,8.1);
  light(entry.p(-.77,0),2.47,[1,.69,.41],1.52,5.0);

  // Seat pockets flank the approved walking strip, on the existing low plane.
  // Only the outside cells receive paving, so their levels do not cover the slope.
  begin('Flanking plaza paving and inlaid edging',.81,0,2);
  for(const sign of [-1,1]){
    for(let row=0;row<9;row++){
      const u0=-2.92+row*.55,u1=u0+.55;
      for(let col=0;col<4;col++){
        const v0=1.20+col*.60,v1=v0+.60;
        const a=Math.min(sign*v0,sign*v1),b=Math.max(sign*v0,sign*v1);
        const mid=entry.p((u0+u1)/2,(a+b)/2);
        if(![...ring(entry,u0,u1,a,b),mid].every(p=>outside(...p)))continue;
        const brightness=1+(Math.sin(row*8.1+col*1.71+sign)*.036);
        const color=shade(col===3?[.34,.35,.33]:[.40,.39,.36],brightness);
        const points=ring(entry,u0,u1,a,b);
        quad(...points.slice().reverse().map(p=>planar(p,-.052)),color);
      }
    }
  }
  light(entry.p(-1.45,2.48),.37,[1,.77,.55],.67,2.5);
  light(entry.p(.80,-2.48),.47,[.86,.82,.68],.60,2.8);

  const cameraBefore=site.cameraClip;
  site.cameraClip=(eye,target)=>{
    const bounded=cameraBefore?.(eye,target)||eye;
    for(let i=2;i<=19;i++){
      const t=i/19;
      const p=target.map((v,j)=>v+(bounded[j]-v)*t);
      const intersects=obstacles.some(({f,u0,u1,v0,v1,y0,y1})=>{
        if(p[1]<y0-.09||p[1]>y1+.09)return false;
        const origin=f.p(0,0), dx=p[0]-origin[0],dz=p[2]-origin[1];
        const u=dx*f.t[0]+dz*f.t[1],v=dx*f.n[0]+dz*f.n[1];
        return u>u0-.09&&u<u1+.09&&v>v0-.09&&v<v1+.09;
      });
      if(intersects)return target.map((v,j)=>v+(bounded[j]-v)*clamp(t-.09,.15,1));
    }
    return bounded;
  };
  site.rainLights=lights;
  site.surfaceMaterials=surfaceMaterials;
  site.authoredMeshes=batches
    .map(({name,start,material},i)=>{
      const end=batches[i+1]?.start??mesh.length;
      return {name,material,vertices:mesh.slice(start,end),surfaceMaterials:surfaceMaterials.slice(start/18,end/18)};
    })
    .filter(m=>m.vertices.length>0);
  return site;
}


function installScannedProps(site,data,models) {
  const bytes=value=>Uint8Array.from(atob(value),x=>x.charCodeAt(0));
  const unpack=(record)=>{
    const xyz=bytes(record.positions), colors=bytes(record.colors), indices=bytes(record.indices);
    return {positions:new Int16Array(xyz.buffer),colors,indices:new Uint16Array(indices.buffer)};
  };
  const imported=Object.fromEntries(Object.entries(models).map(([name,record])=>[name,unpack(record)]));
  const authored=site.authoredMeshes||(site.authoredMeshes=[]);
  const route=site.routes.walkMapped;
  const east=data.points.entry;
  const sideFrom=(a,b)=>{
    const dx=b[0]-a[0],dz=b[1]-a[1],s=Math.hypot(dx,dz);
    return [dx/s,dz/s];
  };
  const advance=(p,d,m)=>[p[0]+d[0]*m,p[1]+d[1]*m];
  const gateDirection=sideFrom(route[0],east);
  const entranceSide=[-gateDirection[1],gateDirection[0]];
  const aim=site.routes.driveOut;
  const driving=sideFrom(aim[0],aim[4]);
  const oppositeSide=[-driving[1],driving[0]];
  const materialTag=0;

  function instance(name,target,pos,base,direction,localX=0,localY=0,flip=false,squash=1) {
    const model=imported[name];
    const [a,b]=direction;
    const {positions,colors,indices}=model;
    for(const i of indices){
      const u=positions[i*3]/10000*(flip?-1:1)+localX;
      const v=positions[i*3+1]/10000*squash+localY;
      const t=positions[i*3+2]/10000*(flip?-1:1);
      target.push(pos[0]+a*u-b*t,base+v,pos[1]+b*u+a*t,
        colors[i*3]/255,colors[i*3+1]/255,colors[i*3+2]/255);
    }
  }
  function finish(name,vertices,material) {
    if(!vertices.length)return;
    const count=vertices.length/18;
    for(const entry of vertices)site.vertices.push(entry);
    if(site.surfaceMaterials) {
      if(Array.isArray(site.surfaceMaterials))for(let i=0;i<count;i++)site.surfaceMaterials.push(materialTag);
      else {
        const ids=new Uint8Array(site.surfaceMaterials.length+count);
        ids.set(site.surfaceMaterials);site.surfaceMaterials=ids;
      }
    }
    authored.push({name,vertices,material});
  }
  function inspectionCover(name,p,direction) {
    const hit=site.surfaceAt(p[0],p[1]);
    if(!hit.walk&&!hit.drive)return;
    const cover=[];
    for(const component of ['water_manhole_cover_frame','water_manhole_cover']){
      instance(component,cover,p,hit.h,direction,0,-.025,false,.9);
    }
    finish(name,cover,'imported-cast-iron');
  }
  const nearParking=advance(advance(data.points.park,driving,4.7),oppositeSide,-1.62);
  inspectionCover('Road water access cover',nearParking,driving);
  const upWalk=advance(advance(east,gateDirection,-1.16),entranceSide,.14);
  inspectionCover('Plaza walk water access cover',upWalk,gateDirection);

  const shaft=site.routes.walkNew;
  const edge=shaft[Math.max(4,shaft.length-5)],track=sideFrom(shaft[shaft.length-7],shaft[shaft.length-3]);
  const right=[-track[1],track[0]];
  const positions=[advance(advance(edge,right,2.84),track,.44),advance(advance(edge,right,-2.84),track,.68)];
  const footprint=(p,axis,normal)=>{
    for(const x of [-1.05,0,1.05])for(const z of [-.38,0,.38]){
      const q=advance(advance(p,axis,x),normal,z),s=site.surfaceAt(q[0],q[1]);
      if(s.walk||s.drive)return false;
    }
    return true;
  };
  const sitting=positions.find(p=>footprint(p,track,right));
  if(sitting) {
    const furniture=[],y=site.surfaceAt(sitting[0],sitting[1]).h+.007;
    instance('seat_bench',furniture,sitting,y,track,0,.45);
    instance('legs_single',furniture,sitting,y,track,-.84,0,false);
    instance('legs_single',furniture,sitting,y,track,.84,0,true);
    instance('crossbar',furniture,sitting,y,track,0,.165);
    finish('Modular timber bench',furniture,'imported-timber-steel');
  }
  site.polyHaven={cover:true,bench:Boolean(sitting)};
  return site;
}


function installNearFieldFrontage(site,data) {
  const solid = site.vertices;
  const materialIds = site.surfaceMaterials;
  const fixtures = [];
  const metadata = [];
  const trim = [.22,.25,.244];
  const dark = [.13,.165,.159];
  const stone = [.42,.385,.33];
  const bronze = [.55,.37,.23];
  const cream = [.75,.64,.47];
  const scale = (color, n) => color.map(x => x * n);
  const mix = (a,b,t) => a.map((val,i) => val+(b[i]-val)*t);
  const clamp = (val,min,max) => Math.min(max,Math.max(min,val));
  let current;

  function localFrame(a,b) {
    const length = Math.hypot(b[0]-a[0],b[1]-a[1]);
    const t = [(b[0]-a[0])/length,(b[1]-a[1])/length];
    const n = [-t[1],t[0]];
    return {
      origin:a, length, n, t,
      point:(x,y,depth) => [a[0]+t[0]*x+n[0]*depth,y,a[1]+t[1]*x+n[1]*depth]
    };
  }

  function batch(name,roughness,metallic,texture,draw) {
    current = {name,material:{roughness,metallic,texture},vertices:[],surfaceMaterials:[]};
    draw();
    if (!current.vertices.length) return;
    for (const v of current.vertices) solid.push(v);
    for (const tag of current.surfaceMaterials) materialIds.push(tag);
    site.authoredMeshes.push(current);
  }

  function tri(a,b,c,ca,cb=ca,cc=ca) {
    current.vertices.push(...a,...ca,...b,...cb,...c,...cc);
    current.surfaceMaterials.push(current.material.texture);
  }

  function quad(a,b,c,d,color,upper=color) {
    tri(a,b,c,color,color,upper);
    tri(a,c,d,color,upper,upper);
  }

  function facade(f,x0,y0,x1,y1,depth,low,high=low) {
    const a=f.point(x0,y0,depth),b=f.point(x1,y0,depth);
    const c=f.point(x1,y1,depth),d=f.point(x0,y1,depth);
    quad(a,b,c,d,low,high);
  }

  function block(f,x0,y0,d0,x1,y1,d1,color) {
    const a=f.point(x0,y0,d0),b=f.point(x1,y0,d0),c=f.point(x1,y0,d1),d=f.point(x0,y0,d1);
    const e=f.point(x0,y1,d0),g=f.point(x1,y1,d0),h=f.point(x1,y1,d1),i=f.point(x0,y1,d1);
    quad(e,i,h,g,scale(color,1.10));
    quad(a,b,c,d,scale(color,.70));
    quad(d,c,h,i,color);
    quad(b,a,e,g,scale(color,.74));
    quad(a,d,i,e,scale(color,.84));
    quad(c,b,g,h,scale(color,.91));
  }

  const glyphs = {
    A:['01110','11011','10001','11111','10001','10001','10001'],
    B:['11110','10001','10001','11110','10001','10001','11110'],
    E:['11111','10000','10000','11110','10000','10000','11111'],
    H:['10001','10001','10001','11111','10001','10001','10001'],
    O:['01110','10001','10001','10001','10001','10001','01110'],
    Q:['01110','10001','10001','10001','10101','10010','01101'],
    R:['11110','10001','10001','11110','10100','10010','10001'],
    S:['01111','10000','10000','01110','00001','00001','11110'],
    U:['10001','10001','10001','10001','10001','10001','01110'],
    Y:['10001','10001','01010','00100','00100','00100','00100']
  };

  function letters(f,word,mid,y,depth,unit,color) {
    const left=mid-(word.length*6-1)*unit*.5;
    for (const [k,glyph] of [...word].entries()) {
      const rows=glyphs[glyph];
      if (!rows) continue;
      for(const [row,pixels] of rows.entries()) {
        for(const [col,pixel] of [...pixels].entries()) {
          if(pixel!=='1') continue;
          const x=left+(k*6+col)*unit,z=y+(6-row)*unit;
          facade(f,x,z,x+unit*1.01,z+unit*1.01,depth,color);
        }
      }
    }
  }

  function canFit(f,w,depth) {
    // Expand every footprint by 36 cm onto permanently unplayable ground.
    const boundary = .36;
    for (let x=-boundary; x<=w+boundary+.001; x+=.16) {
      for (let d=-depth-boundary; d<=boundary+.001; d+=.16) {
        const [px,_,pz]=f.point(Math.min(x,w+boundary),0,d);
        const result=site.surfaceAt(px,pz);
        if(result.drive||result.walk) return false;
      }
    }
    return true;
  }

  function lightAt(f,x,y,depth,color,strength,radius) {
    const p=f.point(x,y,depth);
    fixtures.push({x:p[0],y,z:p[2],color,strength,radius,glow:false});
  }


  function terraceApron(f,w,depth,independent) {
    batch(independent?'Plaza kiosk · paved rain apron':'Plaza edge · paved rain apron',.76,0,2,()=>{
      for(let row=0;row<4;row++){
        const d0=.04+row*(depth-.04)/4,d1=d0+(depth-.04)/4-.011;
        for(let x=-.23+(row%2)*.160,col=0;x<w+.17;x+=.48,col++){
          const right=Math.min(w+.17,x+.466), y=-.051+row*.001;
          const a=f.point(x,y,d0),b=f.point(right,y,d0);
          const c=f.point(right,y,d1),d=f.point(x,y,d1);
          const probes=[a,b,c,d,f.point((x+right)*.5,y,(d0+d1)*.5)];
          if(probes.some(([px,_,pz])=>{
            const current=site.surfaceAt(px,pz);
            return current.walk||current.drive;
          })) continue;
          const colTone=((row*7+col*13)%17-8)*.019;
          const color=scale(row===3?[.335,.338,.328]:[.346,.344,.308],1+colTone);
          quad(a,d,c,b,color);
        }
      }
    });
  }

  function archSkin(f, n, step, depth, shelf) {
    const width=n*step+.27;
    batch(shelf?'Plaza kiosk · concrete, sill and footing':'Plaza edge · pilasters and stone kick plate',.72,0,3,()=>{
      const lo=-depth, hi=.054;
      block(f,-.04,-.061,lo,width+.04,.21,hi,stone);
      block(f,.02,.21,-.34,width-.02,.48,hi+.015,scale(stone,.78));
      block(f,.02,2.62,lo,width-.02,2.87,hi,scale(stone,.89));
      for (let i=0;i<=n;i++) {
        const x=.135+i*step;
        block(f,x-.126,.48,lo,x+.126,2.62,hi,scale(stone,i%2?1.04:.93));
        for (const y of [.82,1.64,2.43]) block(f,x-.124,y,hi,x+.124,y+.021,hi+.008,scale(stone,.50));
      }
      if(shelf) {
        block(f,.02,.48,lo,width-.02,2.64,-.73,scale(stone,.96));
        block(f,.03,2.86,lo,width-.03,2.96,.07,scale(stone,.88));
        block(f,.02,.48,lo,.20,2.63,.02,scale(stone,.94));
        block(f,width-.20,.48,lo,width-.02,2.63,.02,scale(stone,.94));
      }
    });

    batch(shelf?'Plaza kiosk · window hardware and rain canopy':'Plaza edge · window hardware and rain drip rails',.39,.37,0,()=>{
      const lip=shelf?.53:.27;
      block(f,-.11,2.87,-.13,width+.11,2.93,lip,trim);
      block(f,-.11,2.90,lip-.015,width+.11,2.981,lip+.015,scale(trim,.77));
      block(f,-.075,2.58,.045,width+.075,2.65,.145,scale(trim,.83));
      block(f,-.075,.485,.044,width+.075,.535,.141,scale(cream,.91));
      for(let i=0;i<n;i++){
        const x=.135+i*step+.155, r=x+step-.31;
        block(f,x,.54,-.08,x+.055,2.56,.082,trim);
        block(f,r-.055,.54,-.08,r,2.56,.082,trim);
        block(f,x,2.53,-.07,r,2.59,.105,trim);
        block(f,x,.538,-.07,r,.588,.105,scale(dark,.91));
        block(f,x,2.10,-.07,r,2.135,.096,scale(trim,1.06));
        const m=(x+r)*.5;
        block(f,m-.019,.59,-.05,m+.019,2.54,.07,scale(trim,.89));
        if(shelf&&i===2){
          block(f,x+.27,.57,-.07,x+.299,2.05,.099,scale(trim,.91));
          block(f,x+.29,1.04,.105,x+.55,1.085,.19,bronze);
          block(f,x+.33,.56,.101,r-.05,.79,.133,scale(dark,.92));
        }
        for(const g of [x-.06,r+.06]){
          block(f,g-.013,.19,.084,g+.013,2.64,.121,scale(trim,.90));
          block(f,g-.022,.30,.08,g+.023,.49,.134,scale(trim,.83));
        }
        if(shelf){
          const bracketLeft=x+.10,bracketRight=r-.10;
          for(const x of [bracketLeft,bracketRight]){
            block(f,x-.015,2.69,.06,x+.015,2.88,.14,scale(trim,.70));
            const a=f.point(x-.014,2.70,.12),b=f.point(x-.014,2.87,.49);
            const c=f.point(x+.014,2.87,.49),d=f.point(x+.014,2.70,.12);
            quad(a,b,c,d,scale(trim,.93));
          }
        }
      }
    });
  }

  function arcadeInteriors(f,n,step,independent,word) {
    batch(independent?'Plaza kiosk · window recesses and interior furnishings':'Plaza edge · layered window recesses and signage',.48,0,0,()=>{
      const width=n*step+.27;
      for(let i=0;i<n;i++){
        const x=.135+i*step+.161,r=x+step-.321,m=(x+r)*.5;
        const deep=independent?-.67:-.29;
        const gold=i%3===0?[1.24,.73,.38]:[1.105,.81,.54];
        const yellow=scale(gold,1.04);
        facade(f,x,.563,r,2.55,deep,[.40,.284,.169],yellow);
        facade(f,x,.582,r,.78,deep+.014,[.37,.31,.23],[.54,.402,.26]);
        facade(f,x+.15,1.96,r-.13,2.52,deep+.026,[.42,.29,.155],scale(yellow,.96));
        block(f,x+.035,2.34,deep+.056,r-.035,2.404,-.074,scale(bronze,.91));
        facade(f,x+.035,2.348,r-.035,2.395,-.069,yellow);
        for(let j=0;j<8;j++){
          const p=x+.073+j*(r-x-.12)/8;
          const l=(r-x-.15)/8;
          facade(f,p,.73,p+l-.024,1.895,deep+.048,
            scale([.51,.33,.204],.65+(j%4)*.09),scale([.57,.39,.237],.87+((j+i)%3)*.12));
        }
        if(i%2===0){
          for(const level of [1.13,1.49,1.78]){
            block(f,x+.12,level,deep+.028,r-.20,level+.03,deep+.133,scale(trim,.73));
            for(let j=0;j<7;j++){
              const p=x+.17+j*.15;
              if(p>r-.26) continue;
              const h=.087+(j*7%5)*.010;
              const tint=j%3===1?[.50,.39,.26]:[.55,.48,.36];
              block(f,p,level+.027,deep+.058,p+.035+(j%4)*.007,level+h,deep+.111,tint);
              block(f,p+.006,level+h,deep+.062,p+.036,level+h+.019,deep+.104,scale(tint,1.12));
            }
          }
        } else {
          facade(f,x+.16,.92,r-.17,2.04,deep+.056,[.415,.50,.49],[.52,.62,.55]);
          for(let j=0;j<4;j++){
            const left=x+.23+j*.208;
            if(left>r-.26) continue;
            facade(f,left,1.73,left+.121,1.85,deep+.069,[.64,.68,.58]);
            facade(f,left,1.58,left+.131,1.608,deep+.073,[.74,.65,.48]);
            facade(f,left,1.49,left+.105,1.523,deep+.073,[.71,.67,.59]);
          }
        }
        block(f,x+.06,.78,-.130,r-.06,.86,-.015,scale(trim,.87));

          const c=f.point(left+.299,sill+.667,.085),d=f.point(left+.258,sill+.683,.085);
          quad(a,b,c,d,[.39,.47,.48],[.495,.51,.475]);
        }
        facade(f,x+.025,2.165,m-.075,2.20,.091,scale(cream,.60));
      }
      const mid=width/2;
      block(f,mid-1.09,2.653,.068,mid+1.09,2.849,.135,scale(dark,.92));
      facade(f,mid-1.077,2.672,mid+1.077,2.688,.139,bronze);
      facade(f,mid-1.077,2.818,mid+1.077,2.834,.139,bronze);
      letters(f,word,mid,2.691,.144,.018,[1.18,.85,.52]);
      if(independent){
        const y=2.824, warm=[1.19,.75,.44];
        for(let i=0;i<n;i++){
          const mid=(i+.5)*step+.135;
          const a=f.point(mid-.24,y,.39),b=f.point(mid+.24,y,.39);
          const c=f.point(mid+.24,y,.432),d=f.point(mid-.24,y,.432);
          quad(a,b,c,d,warm);
        }
      }
    });
  }

  const entry=site.points.entry;
  const wall=data.base.building.find(feature=>feature.i===88);
  const ring=wall?.geometry?.coordinates[0];
  if(ring&&ring.length>6){
    // Feature 88 supplies position and direction of this wall only.
    const a=ring[3],b=ring[4];
    const frame=localFrame(a,b);
    const start=frame.point(.67,0,.36),end=frame.point(frame.length-.28,0,.36);
    const arcade=localFrame([start[0],start[2]],[end[0],end[2]]);
    const modules=6,step=(arcade.length-.27)/modules;
    if(canFit(arcade,arcade.length+.29,.32)){
      terraceApron(arcade,arcade.length,1.58,false);
      archSkin(arcade,modules,step,.32,false);
      arcadeInteriors(arcade,modules,step,false,'SHORE');
      const point=arcade.point(5.64,0,0);
      lightAt(arcade,5.64,2.40,.34,[1,.72,.48],1.57,8.4);
      metadata.push({name:'plaza wall front',planFeature:wall.i,modules,footprint:[arcade.origin,arcade.point(arcade.length,0,0).filter((_,i)=>i!==1)],light:[point[0],point[2]]});
    }
  }
  const pavilion=localFrame([entry[0]-6.02,entry[1]-4.10],[entry[0]+3.28,entry[1]-7.77]);
  if(canFit(pavilion,pavilion.length+.58,1.15)){
    const modules=4,step=(pavilion.length-.27)/modules;
    terraceApron(pavilion,pavilion.length,1.46,true);
    archSkin(pavilion,modules,step,1.15,true);
    arcadeInteriors(pavilion,modules,step,true,'QUAY');
    lightAt(pavilion,pavilion.length*.62,2.72,.62,[1,.71,.49],2.10,8.8);
    metadata.push({name:'illustrative plaza kiosk',planFeature:null,modules,footprint:[pavilion.origin,pavilion.point(pavilion.length,0,0).filter((_,i)=>i!==1)]});
  }

  if(fixtures.length){
    // Replace the pocket fill lights nearest the entry with actual facade sources.
    const lighting=site.rainLights.filter(light=>!(light.y<.6&&Math.hypot(light.x-entry[0],light.z-entry[1])<3.8));
    site.rainLights=[...lighting,...fixtures];
  }
  site.frontages=metadata;
  return site;
}



function readNearFieldVehicle(model) {
  const raw=encoded=>Uint8Array.from(atob(encoded),ch=>ch.charCodeAt(0));
  const poses=new Map(), doorProfiles={};
  for(const {name,pivot,p,i,c,n,m} of model.parts){
    const positions=new Int16Array(raw(p).buffer), indices=new Uint16Array(raw(i).buffer);
    const normals=n?new Int8Array(raw(n).buffer):null;
    if(!poses.has(name))poses.set(name,{name,pivot,groups:new Map()});
    const pose=poses.get(name);
    if(pose.pivot.some((value,index)=>Math.abs(value-pivot[index])>0.001))
      throw new Error('Inconsistent sedan pivot: '+name);
    const finish=m||'standard';
    if(!pose.groups.has(finish))pose.groups.set(finish,[]);
    const batch=pose.groups.get(finish);
    for(let j=0;j<indices.length;j+=3){
      const coordinate=Array.from(indices.subarray(j,j+3), index=>{
        const offset=index*3;
        return [positions[offset]/1000,positions[offset+1]/1000,positions[offset+2]/1000];
      });
      const [a,b,d]=coordinate;
      const a1=b.map((component,k)=>component-a[k]),a2=d.map((component,k)=>component-a[k]);
      const face=[a1[1]*a2[2]-a1[2]*a2[1],a1[2]*a2[0]-a1[0]*a2[2],a1[0]*a2[1]-a1[1]*a2[0]];
      const length=Math.hypot(...face)||1;
      const normal=face.map(value=>value/length);
      for(let k=0;k<3;k++){
        const offset=indices[j+k]*3;
        const direction=normals?[normals[offset]/127,normals[offset+1]/127,normals[offset+2]/127]:normal;
        batch.push(...coordinate[k],...c,...direction);
      }
    }
    if(name.startsWith('door_')){
      const side=Math.sign(pivot[0]);
      const profile=doorProfiles[side]??{pivot,tip:0,samples:new Map()};
      for(const vertex of new Set(indices)){
        const x=positions[vertex*3]/1000,z=positions[vertex*3+2]/1000;
        profile.tip=Math.min(profile.tip,z);
        const cell=Math.round(x/.045)+','+Math.round(z/.045);
        const sample=profile.samples.get(cell);
        if(!sample||Math.hypot(x,z)>Math.hypot(...sample))profile.samples.set(cell,[x,z]);
      }
      doorProfiles[side]=profile;
    }
  }
  if(!poses.has('body')||!doorProfiles[-1]||!doorProfiles[1]||poses.size<7)
    throw new Error('Incomplete sedan mesh');
  for(const profile of Object.values(doorProfiles))profile.samples=[...profile.samples.values()];
  return {poses:[...poses.values()],doorProfiles};
}


function loadWalker(asset,image) {

    [.14, [1.40,.795,-.35],-1.09,.24, [1.24,.228,-.225],[1.58,.107,-.523]],

    [.33, [1.15,.705,-.019],-.72,.46, [.739,.531,.194],[1.52,.107,-.468]],

    [.51, [.91,.692,-.171], -.34,.49, [.411,.441,.393],[1.27,.235,-.283]],

    edits[h]=quat(turn([0,0,1],side*tilt*.19),headingQ);
    edits[names.spine]=quat(spineQ,quat(inverse(idleWorld[h].q),idleWorld[names.spine].q));
    const neck=names.neck,head=names.head;
    const twist=global(local,root,edits);
    const tuck=.27*Math.sin(Math.min(1,transfer)*Math.PI)+.24*smooth(transfer);
    edits[neck]=quat(quat(headingQ,pitch(tuck)),quat(inverse(headingQ),twist[neck].q));
    edits[head]=quat(quat(headingQ,pitch(tuck+.04*transfer)),quat(inverse(headingQ),twist[head].q));
    const legIn=side<0?'L':'R',legOut=side<0?'R':'L';
    for(const [which,adjusted] of [[legIn,inside],[legOut,outside]]){
      const foot=mirror(adjusted);
      foot[1]+=height*(1-transfer);
      const forward=rotate(headingQ,[0,0,1]);
      const doorStep=which===legOut;
      const zone=smooth(limit((transfer-.30)/.21,0,1))*(1-smooth(limit((transfer-.74)/.17,0,1)));
      const early=1-Math.min(1,Math.abs(transfer-.437)/.075);
      const bend=norm([forward[0]+(doorStep?side:-side)*.58*zone,.30+transfer*.39-.65*zone-early*.23,forward[2]]);
      const index=names['foot_'+which];

    }
    for(const which of [m,o]){
      const arm=names['upperarm_'+which],forearm=names['forearm_'+which],wrist=names['hand_'+which];
      const sign=which==='L'?1:-1;

      const initial=Number.isFinite(sequence.initialYaw)?yaw(sequence.initialYaw):headingQ;
      const outsideRoot={p:mirror([1.48,height+footCorrection,-.462]),q:initial};
      const stance=global(idle,outsideRoot);

  }
  function skin(pose) {

      const {p,q}=pose[i],o=i*16,d=i*12;

      array[o+4]=mesh.uv[i*2+1]/65535;

  }

  let min=Infinity;
  for(let i=1;i<idleSkin.length;i+=9)min=Math.min(min,idleSkin[i]);
  const footCorrection=-min;
  const walkPose=(distance,speed)=>global(localWalk(distance/1.20,limit(speed/.92,0,1)),{p:[0,footCorrection,0],q:zero.q});
  return {mesh,image,skin,walkPose,boardingPose,names,footCorrection};
}


function createMotion(site,data,{canWalkTo=()=>true}={}) {
  const body={halfLength:2.35,halfWidth:.93};
  const footRadius=.26;
  const path=site.routes.walkNew;
  const stall=data.spec.stall.coordinates[0];
  const state={
    person:{x:0,y:0,z:0,yaw:0,step:0,pace:0},
    car:{x:0,y:0,z:0,yaw:0,speed:0,steer:0,doorSide:-1,doorAngle:0,wheelSpin:0},
    mode:'walk',visiblePerson:true,personInCabin:false,boardingPhase:'',notice:'',
    status:{surface:'landing',elevation:0,onRamp:false,parked:true,nearEntry:false}
  };
  const {person,car}=state;
  const clamp=(value,low,high)=>Math.max(low,Math.min(high,value));
  const mix=(a,b,t)=>a+(b-a)*t;
  const smooth=t=>t*t*(3-2*t);
  const stepToward=(value,target,limit)=>value+clamp(target-value,-limit,limit);
  const bearing=(a,b)=>Math.atan2(b[0]-a[0],b[1]-a[1]);
  const turnTo=(angle,target,fraction)=>{
    const delta=Math.atan2(Math.sin(target-angle),Math.cos(target-angle));
    return angle+delta*fraction;
  };
  const deltaKeys=(a,b)=>Number(Boolean(a))-Number(Boolean(b));
  const walkHomeYaw=bearing(path[0],path[1]);
  const parkYaw=bearing(site.routes.driveIn.at(-5),site.routes.driveOut[5]);
  let transition=null, noticeTime=0;
  function say(message,time=2.5) {
    state.notice=message;
    noticeTime=time;
  }
  function ground(actor) {
    return site.surfaceAt(actor.x,actor.z);
  }
  function place(actor,x,z,yaw) {
    actor.x=x;actor.z=z;actor.y=site.surfaceAt(x,z).h;actor.yaw=yaw;
  }
  function carPoint(across,along,pose=car) {
    const s=Math.sin(pose.yaw),c=Math.cos(pose.yaw);
    return [pose.x+across*c+along*s,pose.z-across*s+along*c];
  }
  function clearingCar(x,z) {
    const s=Math.sin(car.yaw),c=Math.cos(car.yaw),dx=x-car.x,dz=z-car.z;
    const across=Math.max(0,Math.abs(dx*c-dz*s)-body.halfWidth);
    const along=Math.max(0,Math.abs(dx*s+dz*c)-body.halfLength);
    return across*across+along*along>footRadius*footRadius;
  }
  function personClear(x,z) {
    return site.clearFoot(x,z,footRadius)&&clearingCar(x,z)&&canWalkTo(x,z,person.x,person.z);
  }
  function insideStall(x,z) {
    let inside=false;
    for(let i=1;i<stall.length;i++){
      const [ax,az]=stall[i-1],[bx,bz]=stall[i];
      if((az>z)!==(bz>z)&&x<(bx-ax)*(z-az)/(bz-az)+ax)inside=!inside;
    }
    return inside;
  }
  function parked() {
    if(ground(car).kind!=='bay')return false;
    for(const x of [-body.halfWidth,body.halfWidth])
      for(const z of [-body.halfLength,body.halfLength])
        if(!insideStall(...carPoint(x,z)))return false;
    return true;
  }
  function updateStatus() {
    const actor=state.mode==='drive'||state.mode==='exit'?car:person;
    const hit=ground(actor);
    state.status.surface=hit.kind;
    state.status.elevation=actor.y;
    state.status.onRamp=state.mode==='walk'&&hit.kind==='ramp';
    state.status.parked=parked()&&Math.abs(car.speed)<.16;
    state.status.nearEntry=state.mode==='walk'&&Math.hypot(person.x-site.points.entry[0],person.z-site.points.entry[1])<1.1;
  }
  function restart() {
    transition=null;
    person.ride=null;state.personInCabin=false;state.boardingPhase='';
    state.notice='';
    noticeTime=0;
    Object.assign(car,{speed:0,steer:0,doorSide:-1,doorAngle:0,wheelSpin:0});
    Object.assign(person,{step:0,pace:0});
  }
  function startWalk() {
    restart();
    place(car,...site.points.park,parkYaw);
    place(person,...site.points.footSpawn,walkHomeYaw);
    state.mode='walk';state.visiblePerson=true;
    updateStatus();
  }
  function startDrive() {
    restart();
    const line=site.routes.driveIn;
    place(car,...line[3],bearing(line[1],line[7]));
    place(person,...site.points.footSpawn,walkHomeYaw);
    person.ride={side:-1,transfer:1,grip:0,angle:0,blendIn:1,inner:0,ground:0};
    state.mode='drive';state.visiblePerson=true;state.personInCabin=true;state.boardingPhase='seated';
    updateStatus();
  }
  function panelClears(side,profile) {
    const [hingeX,,hingeZ]=profile.pivot;
    const steps=16;
    for(let index=0;index<=steps;index++){
      const angle=-side*1.12*index/steps;
      const sine=Math.sin(angle),cosine=Math.cos(angle);
      for(const [x,z] of profile.samples){
        const point=carPoint(hingeX+x*cosine+z*sine,hingeZ-x*sine+z*cosine);
        if(!site.clearFoot(point[0],point[1],.045))return false;
      }
    }
    return true;
  }
  function landingForDoor(selected) {
    for(const side of selected? [selected] : [-1,1]){
      const profile=site.vehicle.doorProfiles[side];
      const stand=carPoint(1.48*side,-.462);
      if(site.surfaceAt(...stand).kind==='landing'&&personClear(...stand)&&panelClears(side,profile)){
        return {side,stand};
      }
    }
    return null;
  }
  function safeApproach(stand) {
    const dx=stand[0]-person.x,dz=stand[1]-person.z;
    const count=Math.ceil(Math.hypot(dx,dz)/.075);
    for(let i=1;i<=count;i++)
      if(!personClear(person.x+dx*i/count,person.z+dz*i/count))return false;
    return true;
  }
  function toggleVehicle() {
    if(transition)return false;
    const entering=state.mode==='walk';
    if(!entering&&Math.abs(car.speed)>=.16){
      say('先停稳车辆，再下车。');
      return false;
    }
    if(!parked()){
      say('车身完整停进 P 位后再上下车。');
      return false;
    }
    const door=landingForDoor(entering?undefined:car.doorSide);
    if(!door){
      say('车门或落脚空间不足，请调整车身位置。');
      return false;
    }
    const distance=Math.hypot(person.x-door.stand[0],person.z-door.stand[1]);
    if(entering&&(distance>1.8||!safeApproach(door.stand))){
      say('请走到广场一侧的前门旁。');
      return false;
    }
    transition={...door,entering,phase:0,approach:entering?clamp(distance/1.45,.09,1.22):0,
      from:[person.x,person.z],fromYaw:person.yaw,
      stanceYaw:entering&&distance>.08?bearing([person.x,person.z],door.stand):car.yaw-door.side*1.12};
    state.mode=entering?'enter':'exit';
    state.visiblePerson=true;
    car.speed=0;car.steer=0;car.doorSide=door.side;
    person.pace=0;
    say('',0);
    updateStatus();
    return true;
  }
  function applyRide(stage,transfer,angle,grip,blendIn,inner=0){
    const ride=transition, {side,stand}=ride;
    const [seatX,seatZ]=carPoint(side*.353,-.249);
    const x=mix(stand[0],seatX,transfer),z=mix(stand[1],seatZ,transfer);
    const facing=car.yaw-side*1.12;
    place(person,x,z,turnTo(ride.fromYaw,facing,blendIn));
    person.pace=0;
    person.ride={side,transfer,grip,angle,blendIn,inner,ground:site.surfaceAt(...stand).h-car.y,
      initialYaw:ride.stanceYaw-car.yaw};
    car.doorAngle=angle;
    state.boardingPhase=stage;
    state.personInCabin=transfer>.56;
    state.visiblePerson=true;
  }
  function tickTransition(dt) {
    const t=transition;
    t.phase+=dt;
    if(t.entering&&t.phase<t.approach){
      const progress=t.phase/t.approach;
      const eased=smooth(progress);
      const x=mix(t.from[0],t.stand[0],eased),z=mix(t.from[1],t.stand[1],eased);
      const travel=Math.hypot(x-person.x,z-person.z);
      const head=bearing(t.from,t.stand);
      place(person,x,z,turnTo(t.fromYaw,head,smooth(Math.min(1,progress*3))));
      person.step+=travel*5.6;
      person.pace=travel/dt;
      state.boardingPhase='approach';
      return;
    }
    const f=t.phase-t.approach;
    if(t.entering){
      if(f<.29) {
        const s=smooth(f/.29);
        applyRide('reach',0,0,s,s);
      } else if(f<.90) {
        const s=smooth((f-.29)/.61);
        applyRide('open',0,1.12*s,1-smooth(clamp((s-.08)/.19,0,1)),1);
      } else if(f<2.82) {
        applyRide('board',clamp((f-.90)/1.92,0,1),1.12,0,1);
      } else if(f<3.43) {
        const s=smooth((f-2.82)/.61);
        applyRide('settle',1,1.12*(1-s),0,1,smooth(clamp((s-.62)/.38,0,1)));
      } else {
        applyRide('seated',1,0,0,1);
        state.mode='drive';
        transition=null;
      }
    } else if(f<.61) {
      const s=smooth(f/.61);
      applyRide('open',1,1.12*s,0,1,1-smooth(clamp((s-.08)/.44,0,1)));
    } else if(f<2.53) {
      applyRide('alight',1-clamp((f-.61)/1.92,0,1),1.12,0,1);
    } else if(f<3.16) {
      const s=smooth((f-2.53)/.63);
      applyRide('close',0,1.12*(1-s),smooth(clamp((s-.74)/.20,0,1)),1);
    } else if(f<3.42) {
      const s=smooth((f-3.16)/.26);
      applyRide('release',0,0,1-s,1-s);
    } else {
      const exitYaw=car.yaw-t.side*1.12;
      applyRide('walk',0,0,0,1);
      place(person,...t.stand,exitYaw);
      person.ride=null;
      state.boardingPhase='';
      state.mode='walk';
      transition=null;
      say('沿落脚带走到 B，再穿越骑行道。');
    }
  }

  function walk(dt,inputs) {
    const zKey=deltaKeys(inputs.forward,inputs.back),xKey=deltaKeys(inputs.right,inputs.left);
    const magnitude=Math.hypot(xKey,zKey);
    if(magnitude===0){person.pace=0;return;}
    const heading=Number.isFinite(inputs.walkYaw)?inputs.walkYaw:person.yaw;
    const s=Math.sin(heading),c=Math.cos(heading),pace=inputs.sprint?4.0:2.15;
    const vx=(zKey*s-xKey*c)/magnitude, vz=(zKey*c+xKey*s)/magnitude;
    const length=pace*dt,count=Math.max(1,Math.ceil(length/.07));
    const dx=vx*length/count,dz=vz*length/count;
    const fromX=person.x,fromZ=person.z;
    for(let i=0;i<count;i++){
      const x=person.x+dx,z=person.z+dz;
      if(personClear(x,z)){person.x=x;person.z=z;}
      else if(Math.abs(dx)>Math.abs(dz)){
        if(personClear(x,person.z))person.x=x;
        else if(personClear(person.x,z))person.z=z;
      }else if(personClear(person.x,z))person.z=z;
      else if(personClear(x,person.z))person.x=x;
    }
    const moved=Math.hypot(person.x-fromX,person.z-fromZ);
    if(moved>1e-4){
      person.yaw=turnTo(person.yaw,Math.atan2(person.x-fromX,person.z-fromZ),1-Math.exp(-14*dt));
      person.y=ground(person).h;
      person.step+=moved*5.6;
    }
    person.pace=moved/dt;
  }
  function drive(dt,inputs) {
    const throttle=deltaKeys(inputs.forward,inputs.back);
    const steering=deltaKeys(inputs.right,inputs.left);
    car.steer=stepToward(car.steer,steering,(steering?4.4:6.7)*dt);
    const speed=car.speed,target=throttle>0?8.4:throttle<0?-3.35:0;
    const opposing=throttle!==0&&throttle*speed<0;
    const acceleration=inputs.brake?9:opposing?6.3:throttle?3.5:2.55;
    const nextSpeed=stepToward(speed,inputs.brake||opposing?0:target,acceleration*dt);
    const movement=(speed+nextSpeed)*.5*dt;
    const yawDelta=-Math.tan(car.steer*.36)*movement/2.82;
    const count=Math.max(1,Math.ceil((Math.abs(movement)+2.6*Math.abs(yawDelta))/.075));
    let accepted=0;
    for(let i=0;i<count;i++){
      const mid=car.yaw+yawDelta/(2*count),yaw=car.yaw+yawDelta/count;
      const x=car.x+Math.sin(mid)*movement/count,z=car.z+Math.cos(mid)*movement/count;
      if(!site.clearVehicle(x,z,yaw,body))break;
      car.x=x;car.z=z;car.yaw=yaw;
      accepted++;
    }
    car.y=ground(car).h;
    car.wheelSpin+=movement*accepted/count/.32;
    car.speed=accepted===count?nextSpeed:0;
    if(accepted!==count&&Math.abs(movement)>.001)say('到达车行面边缘，转向或倒车后再试。',1.35);
  }
  function tick(dt,inputs={}) {
    if(!Number.isFinite(dt)||dt<=0)return;
    const duration=Math.min(dt,.09);
    if(noticeTime>0){
      noticeTime-=duration;
      if(noticeTime<=0)state.notice='';
    }
    const oldEntry=state.status.nearEntry,oldPark=state.status.parked;
    if(transition)tickTransition(duration);
    else if(state.mode==='drive')drive(duration,inputs);
    else walk(duration,inputs);
    updateStatus();
    if(state.status.nearEntry&&!oldEntry)say('到达 E 入口平台。',3.2);
    if(state.mode==='drive'&&state.status.parked&&!oldPark)say('已停进 P 位，可以在广场侧下车。');
  }
  startWalk();
  return {state,tick,toggleVehicle,startWalk,startDrive,reset:startWalk};
}

function createCyclist(site,data) {
  const cycle=data.base.segment.find(segment=>segment.id==='9f73d3b7-3d41-4298-bf15-8cf87f5120df');
  if(!cycle||cycle.geometry.type!=='LineString')throw new Error('B 点骑行中心线缺失');
  const points=cycle.geometry.coordinates;
  const segments=[];
  let length=0;
  for(let i=1;i<points.length;i++){
    const a=points[i-1],b=points[i],dx=b[0]-a[0],dz=b[1]-a[1];
    const size=Math.hypot(dx,dz);
    if(size<.001)continue;
    segments.push({x:a[0],z:a[1],dx:dx/size,dz:dz/size,start:length,end:length+size});
    length+=size;
  }
  const clamp=(x,min,max)=>Math.max(min,Math.min(max,x));

  function nearest(x,z) {
    let closest={distance:Infinity,station:0};
    for(const part of segments){
      const dx=x-part.x,dz=z-part.z;
      const u=clamp(part.dx*dx+part.dz*dz,0,part.end-part.start);
      const lateral=Math.hypot(dx-part.dx*u,dz-part.dz*u);
      if(lateral<closest.distance)closest={distance:lateral,station:part.start+u};
    }
    return closest;
  }
  function pointAt(station) {
    const part=segments.find(element=>station<element.end)||segments.at(-1);
    const u=clamp(station-part.start,0,part.end-part.start);
    return {x:part.x+part.dx*u,z:part.z+part.dz*u,yaw:Math.atan2(part.dx,part.dz)};
  }

  const crossing=nearest(...data.points.cycleCross).station;
  const end=Math.min(length,crossing+40);
  const halfAxle=.68;
  const combinedRadius=.57;
  const followingGap=1.72;
  const normalBrake=3.20;
  let delay=0, cruise=4.30;
  const state={
    x:0,y:0,z:0,yaw:0,speed:0,wheelSpin:0,station:0,
    crossingStation:crossing,distanceToB:0,braking:false,yielding:false,visible:true,finished:false,phase:'approaching'
  };

  function assign(station) {
    const p=pointAt(station);
    state.station=station;
    state.distanceToB=crossing-station;
    state.x=p.x;state.y=site.surfaceAt(p.x,p.z).h;state.z=p.z;state.yaw=p.yaw;
  }
  function reset(options={}) {
    const distance=Number.isFinite(options.distance)?Math.max(.2,options.distance):21;
    delay=Number.isFinite(options.delay)?Math.max(0,options.delay):0;
    cruise=Number.isFinite(options.speed)?clamp(options.speed,1.5,5.5):4.30;
    assign(Math.max(0,crossing-distance));
    Object.assign(state,{speed:delay?0:cruise,wheelSpin:0,braking:false,yielding:false,visible:true,finished:false,phase:'approaching'});
  }

  function distanceFromBike(x,z,pose) {
    const fx=Math.sin(pose.yaw),fz=Math.cos(pose.yaw);
    const dx=x-pose.x,dz=z-pose.z,u=clamp(dx*fx+dz*fz,-halfAxle,halfAxle);
    return Math.hypot(dx-u*fx,dz-u*fz);
  }
  function gapTo(x,z) {
    return distanceFromBike(x,z,state)-combinedRadius;
  }
  function canWalkTo(x,z,fromX,fromZ) {
    if(!state.visible)return true;
    const endGap=gapTo(x,z);
    if(!Number.isFinite(fromX)||!Number.isFinite(fromZ))return endGap>=0;
    const startGap=gapTo(fromX,fromZ);
    if(startGap<0)return endGap>startGap+1e-6;
    const dx=x-fromX,dz=z-fromZ;
    const steps=Math.max(1,Math.ceil(Math.hypot(dx,dz)/.055));
    for(let i=1;i<=steps;i++)
      if(gapTo(fromX+dx*i/steps,fromZ+dz*i/steps)<0)return false;
    return true;
  }
  function phase() {
    if(state.yielding)return 'yielding';
    if(state.distanceToB>2.4)return 'approaching';
    if(state.distanceToB>=-2.4)return 'passing';
    return 'cleared';
  }
  function tick(dt,person=null,predicted=null) {
    if(state.finished||!Number.isFinite(dt)||dt<=0)return;
    dt=Math.min(dt,.09);
    if(delay>0) {
      delay=Math.max(0,delay-dt);
      return;
    }

    const hasPerson=Boolean(person&&Number.isFinite(person.x)&&Number.isFinite(person.z)&&
      (!Number.isFinite(person.y)||Math.abs(person.y-state.y)<.75));
    let crossingPerson=hasPerson?nearest(person.x,person.z):null;
    if(crossingPerson&&predicted&&crossingPerson.distance>=.89){
      const intent=nearest(predicted.x,predicted.z);
      if(intent.distance<.69&&crossingPerson.distance-intent.distance>.18&&Math.abs(intent.station-crossing)<2.15)
        crossingPerson=intent;
    }
    const ahead=crossingPerson?crossingPerson.station-state.station:Infinity;
    const relevant=Boolean(crossingPerson&&crossingPerson.distance<(state.yielding?1.04:.89)&&ahead>-.42&&ahead<15);
    const room=relevant?Math.max(0,ahead-followingGap):Infinity;
    const requested=Math.min(cruise,Math.sqrt(2*normalBrake*room));
    const previous=state.speed;
    const brake=requested<previous-.01;
    const rate=brake?normalBrake:2.20;
    const speed=previous+clamp(requested-previous,-rate*dt,rate*dt);
    const advance=Math.min(end-state.station,room,(previous+speed)*.5*dt);

    const steps=Math.max(1,Math.ceil(advance/.065));
    let used=0;
    for(let i=1;i<=steps;i++){
      const station=state.station+advance*i/steps;
      if(hasPerson&&distanceFromBike(person.x,person.z,pointAt(station))<combinedRadius)break;
      used=i;
    }
    const step=advance*used/steps;
    const emergency=used<steps||room<.002;
    assign(state.station+step);
    state.wheelSpin+=step/.33;
    state.finished=state.station>=end-1e-3;
    state.speed=emergency||state.finished?0:speed;
    state.braking=brake||emergency;
    state.yielding=relevant&&(requested<cruise-.05||emergency);
    state.phase=phase();
  }

  reset();
  return {state,tick,reset,canWalkTo,gapTo};
}

function createStreetRun(site,rider) {
  const [crossX,crossZ]=site.points.cycleCross;
  const path=[...site.routes.walkNew,...site.routes.walkMapped.slice(1)];
  const crossingIndex=path.findIndex(([x,z])=>Math.hypot(x-crossX,z-crossZ)<.02);
  const exit=path[crossingIndex+1], intoX=exit[0]-crossX,intoZ=exit[1]-crossZ;
  const distanceB=person=>Math.hypot(person.x-crossX,person.z-crossZ);
  let stage,waypoint,entered,cleared,complete,practice,stopped,resumed,riding,cooldown,previous,lap;
  function reset(isPractice=false,startIndex=0){
    practice=isPractice;
    stage=practice?'cross':'park';
    waypoint=Math.min(path.length-1,startIndex);
    entered=waypoint>crossingIndex;
    cleared=waypoint>crossingIndex+1;
    complete=stopped=resumed=riding=false;
    cooldown=0;
    previous=null;
    lap=0;
    rider.state.visible=false;
    rider.state.yielding=false;
  }
  function advanceTraffic(dt,state){
    const person=state.mode==='walk'?state.person:null;
    const nearby=person&&distanceB(person)<7.2;
    if(!riding&&nearby){
      cooldown=Math.max(0,cooldown-dt);
      if(cooldown===0){
        const distances=[12.2,17.5,15.0],speeds=[3.65,3.48,3.9];
        const slot=lap%distances.length;
        rider.reset({distance:distances[slot],speed:speeds[slot]});
        lap++;
        riding=true;
      }
    }
    if(riding){
      let predicted=null;
      if(nearby&&previous&&person.pace>.28){
        const dx=(person.x-previous.x)/dt,dz=(person.z-previous.z)/dt;
        const speed=Math.hypot(dx,dz);
        if(speed>.20&&speed<4.25)predicted={x:person.x+dx*.55,z:person.z+dz*.55};
      }
      rider.tick(dt,person,predicted);
      if(rider.state.yielding&&rider.state.speed<.30&&rider.state.distanceToB>-1)stopped=true;
      if(stopped&&!rider.state.yielding&&rider.state.speed>1.45)resumed=true;
      if(rider.state.finished){
        rider.state.visible=false;
        riding=false;
        cooldown=4.8;
      }
    }
    previous=person?{x:person.x,z:person.z}:null;
  }
  function update(state){
    if(complete)return;
    if(state.mode==='drive'){
      stage=state.status.parked?'exit':'park';
      return;
    }
    if(state.mode==='exit'){stage='exit';return;}
    if(state.mode!=='walk')return;
    const person=state.person,kind=site.surfaceAt(person.x,person.z).kind;
    if(kind==='cycle'&&distanceB(person)<1.5)entered=true;
    if(entered&&(kind==='walk'||kind==='ramp'||kind==='entry')&&
       (person.x-crossX)*intoX+(person.z-crossZ)*intoZ>0)cleared=true;
    complete=cleared&&state.status.nearEntry;
    stage=complete?'done':cleared?'entry':'cross';
  }
  function guide(person){
    while(waypoint<path.length-1&&Math.hypot(path[waypoint][0]-person.x,path[waypoint][1]-person.z)<.29)
      waypoint++;
    const point=path[waypoint];
    if(Math.hypot(point[0]-person.x,point[1]-person.z)<.15)return person.yaw;
    return Math.atan2(point[0]-person.x,point[1]-person.z);
  }
  function awake(state){
    return riding||Boolean(state.mode==='walk'&&distanceB(state.person)<7.2);
  }
  function status(){
    return {stage,cleared,complete,stopped,resumed,practice,riding,lap};
  }
  reset();
  return {reset,advanceTraffic,update,guide,awake,status};
}


function createRenderer(canvas, site, data) {
  const gl=canvas.getContext('webgl',{alpha:false,antialias:true,depth:true,powerPreference:'high-performance'});
  if(!gl) throw new Error('WebGL unavailable');
  const highPrecision=gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER,gl.HIGH_FLOAT)?.precision>0;
  const fragmentPrecision=highPrecision?'highp':'mediump';
  const lightCount=Math.max(2,Math.min(8,Math.floor((gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS)-11)/2)));
  const vertexSource=`
    attribute vec3 aPosition,aColor,aNormal;
    uniform ${fragmentPrecision} vec3 uEye;
    uniform vec3 uForward,uRight,uUp;
    uniform vec2 uScale;
    uniform float uGlowSize;
    uniform mat3 uObjectRotation;
    uniform vec3 uObjectOrigin;
    varying ${fragmentPrecision} vec3 vWorld,vPaint,vNormal;
    varying ${fragmentPrecision} float vDepth;
    void main(){
      vec3 worldPosition=uObjectRotation*aPosition+uObjectOrigin;
      vec3 d=worldPosition-uEye;
      float z=dot(d,uForward);
      gl_Position=vec4(dot(d,uRight)*uScale.x,dot(d,uUp)*uScale.y,1.000516*z-0.160041,z);
      gl_PointSize=clamp(uGlowSize/(max(z,0.5)+4.0),5.0,54.0);
      vPaint=aColor;
      vWorld=worldPosition;
      vNormal=uObjectRotation*aNormal;
      vDepth=z;
    }`;
  const fragmentSource=`
    precision ${fragmentPrecision} float;
    #define LAMPS ${lightCount}
    uniform float uOpacity,uLayer,uExposure,uWet,uClearCoat,uWalker,uSectionSide;
    uniform sampler2D uWalkerColor;
    uniform vec3 uEye;
    uniform vec4 uLamp[LAMPS],uTint[LAMPS];
    uniform vec4 uCar;
    uniform sampler2D uAlbedoMap,uNormalMap;
    uniform vec4 uMaterial;
    uniform vec3 uTextureMean;
    uniform vec2 uEast,uMaterialOrigin;
    varying vec3 vWorld,vPaint,vNormal;
    varying float vDepth;

    float hash21(vec2 p){
      vec3 q=fract(vec3(p.xyx)*vec3(0.1031,0.11369,0.13787));
      q+=dot(q,q.yzx+19.19);
      return fract((q.x+q.y)*q.z);
    }
    float noise21(vec2 p){
      vec2 cell=floor(p),blend=fract(p);
      blend*=blend*(3.0-2.0*blend);
      return mix(mix(hash21(cell),hash21(cell+vec2(1.0,0.0)),blend.x),
        mix(hash21(cell+vec2(0.0,1.0)),hash21(cell+vec2(1.0)),blend.x),blend.y);
    }
    vec3 tone(vec3 linear){
      return pow(max(vec3(0.0),1.0-exp(-max(linear,vec3(0.0))*uExposure)),vec3(0.48));
    }
    float ggx(vec3 normal,vec3 view,vec3 light,float roughness,float f0){
      float nv=max(dot(normal,view),0.03),nl=max(dot(normal,light),0.0);
      if(nl<=0.0)return 0.0;
      vec3 halfVector=normalize(view+light);
      float nh=clamp(dot(normal,halfVector),0.0,1.0);
      float vh=clamp(dot(view,halfVector),0.0,1.0);
      float r2=roughness*roughness,a2=max(r2*r2,0.001);
      float phi=nh*nh*(a2-1.0)+1.0;
      float distribution=a2/max(0.00010,3.141593*phi*phi);
      float smith=roughness+1.0;
      float k=smith*smith*.125;
      float geometry=nv/(nv*(1.0-k)+k)*nl/(nl*(1.0-k)+k);
      float s=1.0-vh;
      float fresnel=f0+(1.0-f0)*s*s*s*s*s;
      return min(1.15,distribution*geometry*fresnel/(4.0*nv));
    }
    void main(){
      if(uLayer>3.5){
        vec2 centered=gl_PointCoord*2.0-1.0;
        float radius=dot(centered,centered);
        float glow=(exp(-4.7*radius)-0.01)*(1.0-smoothstep(0.54,1.0,radius));
        gl_FragColor=vec4(vPaint,glow*uOpacity);
        return;
      }
      if(uLayer>2.5){
        gl_FragColor=vec4(0.025,0.034,0.045,uOpacity);
        return;
      }
      if(uLayer>0.5&&uLayer<1.5){
        gl_FragColor=vec4(tone(vPaint*0.36),uOpacity);
        return;
      }
      if(abs(uSectionSide)>0.5){
        vec2 d=vWorld.xz-uCar.xy;
        float lateral=dot(d,vec2(uCar.w,-uCar.z))*uSectionSide;
        float lengthwise=dot(d,uCar.zw);
        if(lateral>-.10&&vWorld.y>.46&&lengthwise>-.49&&lengthwise<.86)discard;
      }
      float emissive=step(1.045,vPaint.r)*(1.0-uWalker);
      vec3 n=normalize(vNormal);
      float floorFace=smoothstep(0.80,0.988,n.y);
      float pavedHeight=smoothstep(-0.055,-0.025,vWorld.y);
      float street=uLayer<0.5?floorFace*pavedHeight*(1.0-smoothstep(0.18,0.39,vWorld.y)):0.0;
      vec2 ground=vWorld.xz;
      vec2 tile=mod(ground,127.0);
      float field=0.0,wet=0.0,textureShade=1.0,roughness=uMaterial.y;
      vec3 paint=min(vPaint,vec3(1.0));
      if(uWalker>0.5){
        vec3 skinColor=texture2D(uWalkerColor,vPaint.xy).rgb;
        paint=pow(max(skinColor,vec3(.003)),vec3(1.8))*1.22;
      }
      bool mapped=uMaterial.x>0.0&&emissive<0.5;
      if(street>0.02){
        float low=noise21(tile*1.04+12.4);
        float high=noise21(tile*3.65);

      ctx.lineWidth=.58+d*d*.73;
      ctx.strokeStyle='rgba(187,212,235,'+((.115+.25*d*d)*(.8+.2*p.variety)).toFixed(3)+')';
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+lean,y+len);ctx.stroke();

  function animate(now) {

  }

    if(!enabled){paint(0);return;}

}

function createStreetAudio() {
  let graph=null, listening=false, asleepTimer=0, waking=null;
  let lastStep=NaN,lastFoot=-Infinity,lastDoor=0,lastMode='walk',lastLatch=-Infinity;
  const previousValues=new WeakMap();
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function noiseGenerator(seed) {
    return () => {
      seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;
      return (seed>>>0)/2147483648-1;
    };
  }
  function rainBuffer(ctx) {
    const n=Math.round(ctx.sampleRate*5.6), loop=ctx.createBuffer(2,n,ctx.sampleRate);
    const edge=Math.round(ctx.sampleRate*.032);
    for(let channel=0;channel<2;channel++) {
      const random=noiseGenerator(0x74dca8f1+channel*1013),out=loop.getChannelData(channel);
      let soft=0,dark=0,drop=0;
      for(let i=0;i<n;i++) {
        const grain=random();
        soft+=.19*(grain-soft);
        dark+=.016*(grain-dark);
        if(random()>.9978)drop+=.10+.25*Math.abs(random());
        drop*=.982;
        const breeze=.9+.08*Math.sin(4*Math.PI*i/n+channel*.63);
        const seam=Math.min(1,i/edge,(n-1-i)/edge);
        out[i]=(.30*grain+.65*soft+.27*dark+drop*(grain-soft))*breeze*(.76+.24*seam);
      }

  }

    const length=Math.round(ctx.sampleRate*(kind==='step'?.17:.15));
    const out=ctx.createBuffer(1,length,ctx.sampleRate);
    const samples=out.getChannelData(0),random=noiseGenerator(kind==='step'?0xd23d52b1:0x612ceaf1);
    let low=0;
    for(let i=0;i<length;i++) {
      const t=i/ctx.sampleRate,grain=random();
      low+=.16*(grain-low);
      if(kind==='step') {
        const splash=(grain-low)*Math.exp(-29*t);
        const impact=(Math.sin(2*Math.PI*(88-121*t)*t)*.52+low*.38)*Math.exp(-37*t);
        samples[i]=(splash*.56+impact)*Math.min(1,t/.003)*Math.min(1,(length-1-i)/(ctx.sampleRate*.015));
      } else {
        const click=(grain-low)*Math.exp(-103*t)*.38;
        const tail=(.62*Math.sin(2*Math.PI*83*t)+low*.73)*Math.exp(-t*41);
        samples[i]=(click+tail)*Math.min(1,t/.002)*Math.min(1,(length-1-i)/(ctx.sampleRate*.015));

  }
  function makeGraph(ctx) {
    const master=ctx.createGain(),rainGain=ctx.createGain(),motorGain=ctx.createGain();
    master.gain.value=rainGain.gain.value=motorGain.gain.value=0;
    master.connect(ctx.destination);
    rainGain.connect(master);

    harmonic.type='sine';harmonic.frequency.value=86;trim.gain.value=.25;
    motorFilter.type='lowpass';motorFilter.frequency.value=170;motorFilter.Q.value=.55;
    motor.connect(motorFilter);

  }

    if(!graph||graph.ctx.state==='closed')return Promise.resolve(false);
    if(graph.ctx.state==='running')return Promise.resolve(true);
    if(!waking)waking=graph.ctx.resume().then(()=>true,()=>false).finally(()=>{waking=null;});
    return waking;
  }

    } catch(error) {
      return Promise.resolve(false);
    }
  }
  function silence() {
    if(!graph||!listening)return;
    listening=false;
    lastStep=NaN;lastDoor=0;lastMode='walk';
    try {target(graph.master.gain,0,.0001,.034);} catch(error) {return;}
    clearTimeout(asleepTimer);
    asleepTimer=setTimeout(()=>{
      if(listening||!graph||graph.ctx.state!=='running')return;

    const {ctx,master}=graph,voice=ctx.createBufferSource(),gain=ctx.createGain();

  }
  function update(state,{rain=true,muted=true,active=true}={}) {
    if(!graph||!state)return;
    if(muted||!active||(typeof document!=='undefined'&&document.hidden)){silence();return;}
    try {
      if(!listening) {
        listening=true;
        clearTimeout(asleepTimer);

      lastMode=state.mode;

  }

}

    board.addEventListener('click',()=>{unlockSound();toggleVehicle();});
    routes.addEventListener('change',()=>{manualLook=false;yawOffset=0;redraw();save();});
    textured.addEventListener('change',()=>{redraw();save();});
    weather.addEventListener('change',()=>{rainLayer.refresh(weather.checked);unlockSound();redraw();save();});
    sound.addEventListener('change',()=>{unlockSound();updateSound();save();});
    exposure.addEventListener('input',redraw);
    exposure.addEventListener('change',save);
    window.addEventListener('keydown',event=>{
      if(event.ctrlKey||event.metaKey||event.altKey||event.target instanceof HTMLInputElement)return;
      if(event.code==='KeyE') {
        event.preventDefault();
        if(!event.repeat){unlockSound();toggleVehicle();}
        return;
      }
      if(!Object.hasOwn(keyFor,event.code))return;
      if(event.code==='Space'&&(state.mode!=='drive'||(event.target instanceof HTMLButtonElement&&event.target!==activeViewButton())))return;
      event.preventDefault();
      started=true;
      takeOver();
      if(!event.repeat)unlockSound();
      if(view==='entry'||view==='curb'||view==='door'||view==='cabin')setView('follow');
      pressed.add(event.code);
      requestDraw();
    });
    window.addEventListener('keyup',event=>{if(pressed.delete(event.code))redraw();});
    canvas.addEventListener('pointerdown',event=>{
      if(event.button!==0)return;
      unlockSound();
      drag={id:event.pointerId,x:event.clientX,y:event.clientY};
      canvas.setPointerCapture(event.pointerId);
      activeViewButton()?.focus({preventScroll:true});
      started=true;
    });
    canvas.addEventListener('pointermove',event=>{
      if(!drag||drag.id!==event.pointerId)return;
      if(Math.abs(event.clientX-drag.x)+Math.abs(event.clientY-drag.y)>.5)manualLook=true;
      yawOffset=clamp(yawOffset-(event.clientX-drag.x)*.007,-Math.PI,Math.PI);
      pitch=clamp(pitch+(event.clientY-drag.y)*.004,-.36,.50);
      drag={id:event.pointerId,x:event.clientX,y:event.clientY};
      redraw();
    });
    for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>{
      if(!drag)return;
      drag=null;save();redraw();
    });
    for(const button of root.querySelectorAll('[data-hold]')) {
      button.addEventListener('pointerdown',event=>{
        if(event.button!==0)return;
        event.preventDefault();
        takeOver();
        unlockSound();
        if(view==='entry'||view==='curb'||view==='door'||view==='cabin')setView('follow');
        button.setPointerCapture(event.pointerId);
        started=true;
        heldPointers.set(event.pointerId,button.dataset.hold);
        requestDraw();
      });
      for(const name of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(name,event=>{
        if(heldPointers.delete(event.pointerId))redraw();
      });
    }
    function clearInput() {
      pressed.clear();heldPointers.clear();drag=null;
    }
    window.addEventListener('blur',()=>{clearInput();redraw();});
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden) {
        rainLayer.freeze();
        audio.silence();
        clearInput();
        if(frame)cancelAnimationFrame(frame);
        frame=lastTime=spill=0;
      } else {rainLayer.refresh(weather.checked);redraw();}
    });
    window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
    canvas.addEventListener('webglcontextlost',()=>{rainLayer.freeze();audio.silence();showPoster();},{once:true});
    new ResizeObserver(()=>{rainLayer.refresh(weather.checked);redraw();}).observe(stage);
    restore(window.openai?.widgetState);
    rainLayer.refresh(weather.checked);
    redraw();
  }
  function decodeMap(src){
    const picture=new Image();
    picture.src=src;
    return picture.decode().then(()=>picture);
  }
  async function start(){
    const data=JSON.parse(document.getElementById('shekou-asset-maps').textContent);
    async function readPacked(id){
      const bin=Uint8Array.from(atob(document.getElementById(id).textContent),ch=>ch.charCodeAt(0));
      const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
      return JSON.parse(await new Response(stream).text());
    }
    const [albedo,normal,texture,scans,sedan,rig]=await Promise.all([
      decodeMap(data.albedo),decodeMap(data.normal),decodeMap(data.walker),
      readPacked('shekou-placed-scans'),readPacked('shekou-nearfield-sedan'),readPacked('shekou-walker')
    ]);
    initialize({albedo,normal},scans,sedan,loadWalker(rig,texture));
  }
  start().catch(error=>{console.error('Shekou assets',error);showPoster();});
})();
</script>
