<header><h1>原图高斯保留外观 · 实体提供结构</h1><div id="status">载入原始高斯分组…</div><div><button data-view="source">运河原机位</button><button data-view="left">左移</button><button data-view="right">右移</button><button data-view="approach">门外近看</button><button data-view="inside">进入室内</button><button data-view="reverse">回望街道</button></div>

<div><button id="closed">关门</button><button id="open">开门</button><label>门动作 <input id="frame" type="range" min="1" max="97" value="1"></label><label><input id="wire" type="checkbox">叠加结构线框</label><label><input id="appearance" type="checkbox" checked>保留原高斯外观</label><label><input id="context" type="checkbox" checked>显示未见区域补建</label></div></header>
<div id="viewport"><div id="caption"></div></div><div id="note">大部分街景直接保留原始高斯。咖啡店局部用原高斯原机位的实际画面重新采样表面外观，未用 Blender 渲染图替换高斯。门和墙保留背面遮挡。照片里可见的室内外观附着到设计结构，属于投影绑定，不代表恢复了真实内部。对岸、水面等补建只在原相机未覆盖的空间显示；原高斯在连续镜头中保持开启。光照仍为原图烘焙外观。</div>
