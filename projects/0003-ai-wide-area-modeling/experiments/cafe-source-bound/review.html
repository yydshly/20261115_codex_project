<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原图高斯混合 · 本轮实测</title><link rel="icon" href="data:,"><style>body{margin:0;background:#111a23;color:#e8eff4;font:16px system-ui}main{max-width:1120px;margin:20px auto;padding:0 16px}h1{font-size:23px}p{color:#b8cad4;line-height:1.8}video{display:block;width:100%;background:#0a1016}a{color:#a9ded9}button{padding:8px 12px;border:1px solid #617b85;background:#29414e;color:#e8eff4;border-radius:5px;margin:6px 4px 0 0;cursor:pointer}#status{font-size:14px}</style><main><h1>原图高斯 + 实体结构：本轮真实实测</h1><p>28 秒同一混合场景，原高斯外观全程开启。室内仍有贴面拉伸，外观验收未通过。</p><video controls playsinline poster="/result/preview/source-bound.png"></video><div id="status">载入影片…</div><div><button data-t="0">全景</button><button data-t="9">靠近</button><button data-t="13">开门</button><button data-t="19">进入</button><button data-t="22">柜台问题</button><button data-t="26">回望</button></div><p><a href="/">打开原高斯／结构交互对照</a></p><p>影片为 Spark 实际捕获的 336 帧，12fps。高斯外观来自原始 SHARP 文件与其原机位实渲染的局部表面采样，未用 Blender 渲染图替换。未知空间为设计补建；这轮没有实现新视角自动生成或高斯物理重打光。</p></main><script>const v=document.querySelector('video');fetch('/result/source-hybrid-tour.mp4').then(r=>{if(!r.ok)throw Error(r.status);return r.blob()}).then(b=>{v.src=URL.createObjectURL(b);document.querySelector('#status').textContent='影片已载入，可拖动检查问题片段。'}).catch(e=>document.querySelector('#status').textContent='未能载入影片，请检查本机服务。');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{v.currentTime=+b.dataset.t;v.play();});</script></html>
