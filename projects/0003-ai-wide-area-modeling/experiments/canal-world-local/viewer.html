<header><h1>运河街区 · 同一份三维场景</h1><a style="color:#a8dbd8" href="/result/review.html">查看完整实渲染连续镜头</a><div id="status">载入实体和多视角高斯…</div>

import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{SparkRenderer,SplatMesh}from'@sparkjsdev/spark';
const cfg=await(await fetch('/result/world.json')).json();const r=new T.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});r.setSize(1280,720);r.setPixelRatio(1);r.setClearColor(0x34485b);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.1;document.querySelector('#viewport').prepend(r.domElement);const scene=new T.Scene(),camera=new T.PerspectiveCamera(50,16/9,.04,300);const controls=new OrbitControls(camera,r.domElement);controls.enableDamping=false;

const ambient=new T.HemisphereLight(0xb8cde2,0x4e3826,1.4);scene.add(ambient);const sun=new T.DirectionalLight(0xffdab5,2.1);sun.position.set(-4,12,5);scene.add(sun);const fill=new T.PointLight(0xffbb76,85,12,2);fill.position.set(-7,3.5,-2.6);scene.add(fill);const meshNames=[];const leaf=[];const tables=[];
gltf.scene.traverse(o=>{if(o.name.startsWith('Cafe_Table_'))tables.push(o);if(o.isMesh){meshNames.push(o.name);for(const m of(Array.isArray(o.material)?o.material:[o.material])){if(m.name==='glass'){m.transparent=true;m.opacity=.10;m.transmission=0;m.depthWrite=false;}m.side=T.DoubleSide;}}});
const sky=await new T.TextureLoader().loadAsync('/result/sky.png');sky.colorSpace=T.SRGBColorSpace;sky.mapping=T.EquirectangularReflectionMapping;scene.background=sky;scene.environment=sky;
async function loadLight(name){if(!cache[name]){const bg=new SplatMesh({url:`/result/world-${name}${cacheSuffix}.ply`,lod:useLod?'quality':false,extSplats:true}),door=new SplatMesh({url:`/result/door-${name}${cacheSuffix}.ply`,lod:false,extSplats:true});bg.matrixAutoUpdate=door.matrixAutoUpdate=false;bg.matrix.copy(S);await Promise.all([bg.initialized,door.initialized]);scene.add(bg,door);cache[name]={bg,door};}for(const [k,v]of Object.entries(cache))v.bg.visible=v.door.visible=k===name;state.light=name;splats=cache[name];setFrame(state.frame);layers();}
function setFrame(value){state.frame=Math.max(1,Math.min(49,Math.round(value)));const M=matrix(cfg.door.frames[state.frame-1].matrix);hinge.matrix.copy(S).multiply(M).multiply(Si);const delta=S.clone().multiply(M).multiply(restInv);if(splats)splats.door.matrix.copy(delta);document.querySelector('#angle').value=state.frame;scene.updateMatrixWorld(true);}
function layers(){r.toneMapping=(state.mode==='mesh'||state.mode==='wire')?T.ACESFilmicToneMapping:T.NoToneMapping;gltf.scene.visible=true;for(const[k,v]of Object.entries(cache))v.bg.visible=v.door.visible=k===state.light&&state.mode!=='mesh'&&state.mode!=='wire';gltf.scene.traverse(o=>{if(o.isMesh){const ms=Array.isArray(o.material)?o.material:[o.material];o.visible=state.mode!=='gaussian'||ms.some(m=>m.name==='glass');for(const m of ms)m.wireframe=state.mode==='wire';}});}

const labels={hero:'运河全景','street-left':'左侧街道','street-right':'反向街道',bridge:'桥上看街区','cafe-front':'咖啡店正面',entry:'门口','interior-left':'室内左侧','interior-right':'室内右侧','interior-back':'室内回看街道',opposite:'对岸',aerial:'整体结构','door-side':'门轴侧面'};for(const v of cfg.views){const b=document.createElement('button');b.textContent=labels[v.name];b.onclick=()=>setView(v.name);document.querySelector('#views').append(b);}
const orig=cfg.views[0],O=matrix(orig.matrix_world);const p0=new T.Vector3().setFromMatrixPosition(O),f0=new T.Vector3(0,0,-1).transformDirection(O);const t0=p0.clone().addScaledVector(f0,12);
const path=await(await fetch('/result/tour.json')).json();
const keys=path.map(k=>{const p=new T.Vector3(...k.p).applyMatrix4(S),target=new T.Vector3(...k.look).applyMatrix4(S);return {...k,p,q:new T.Quaternion().setFromRotationMatrix(new T.Matrix4().lookAt(p,target,new T.Vector3(0,1,0)))}});
function setTime(t){state.time=t;state.walk=false;controls.enabled=false;let i=keys.findIndex(k=>k.t>=t);if(i<0)i=keys.length-1;const b=keys[i],a=keys[Math.max(0,i-1)],u=a===b?0:T.MathUtils.smoothstep(t,a.t,b.t);camera.position.copy(a.p).lerp(b.p,u);camera.quaternion.copy(a.q).slerp(b.q,u);const lens=T.MathUtils.lerp(a.lens,b.lens,u);camera.fov=T.MathUtils.radToDeg(2*Math.atan(36*720/(2*lens*1280)));camera.updateProjectionMatrix();setFrame(1+48*T.MathUtils.clamp((t-13)/3,0,1));document.querySelector('#progress').value=t;document.querySelector('#caption').textContent=`${t.toFixed(1)} / 36 秒 · 同一场景 ${state.mode==='gaussian'?'高斯':'实体'} · ${state.light==='warm'?'暖灯':'日光'}`;}
let start=0,last=0;document.querySelector('#tour').onclick=()=>{state.tour=!state.tour;if(state.tour){if(state.time>=36)state.time=0;start=performance.now()-state.time*1000;}document.querySelector('#tour').textContent=state.tour?'暂停漫游':'播放连续漫游';};document.querySelector('#progress').oninput=e=>{state.tour=false;setTime(+e.target.value)};
document.querySelector('#mode').onchange=e=>{state.mode=e.target.value;layers()};document.querySelector('#light').onchange=async e=>{document.querySelector('#status').textContent='载入另一份灯光缓存…';await loadLight(e.target.value);document.querySelector('#status').textContent='灯光缓存已更新；几何和门轴保持一致';};document.querySelector('#angle').oninput=e=>{state.tour=false;setFrame(+e.target.value)};document.querySelector('#door').onclick=()=>{state.tour=false;setFrame(state.frame>25?1:49)};

const obstacles=[];const collisionNames=/^(Solid_party_wall|Rear_masonry_wall|Ground_floor_masonry_pier|Shop_outer_pilaster|Storefront_mullion|Cafe_paneled_service_counter|Cabinet_rear_panel|Shop_interior_timber_wainscoting|Window_display_ledge|Cafe_chair_back|Cafe_chair_curved_back_frame|Cafe_chair_back_spindle)/;scene.updateMatrixWorld(true);gltf.scene.traverse(o=>{if(o.isMesh&&collisionNames.test(o.name.replace(/^Opposite_building_\d+_/,'')))obstacles.push(new T.Box3().setFromObject(o));});
function blocked(p){if(p.x< -23||p.x>34)return true;const y=-p.z;if(y< -2.63&&y> -11.37&&!(p.x>10.02&&p.x<11.98))return true;if(y>6.2||y< -15.2)return true;if(y>.74&&y<1.30&&p.x>-9.9&&p.x<7.9&&!(p.x> -7.51&&p.x< -6.49))return true;const dynamic=[...tables.map(o=>new T.Box3().setFromObject(o)),new T.Box3().setFromObject(hinge)];for(const b of [...obstacles,...dynamic])if(p.x>b.min.x-.16&&p.x<b.max.x+.16&&p.z>b.min.z-.16&&p.z<b.max.z+.16&&p.y>b.min.y&&p.y<b.max.y+.9)return true;return false;}
const pressed=new Set();let drag=false,lx=0,ly=0;const euler=new T.Euler(0,0,0,'YXZ');document.querySelector('#walk').onclick=()=>{setView('cafe-front');state.walk=true;controls.enabled=false;camera.position.set(-7.05,2.5,-.55);camera.lookAt(-7.05,2.5,-3);};r.domElement.onpointerdown=e=>{if(state.walk){drag=true;lx=e.clientX;ly=e.clientY;r.domElement.setPointerCapture(e.pointerId);}};r.domElement.onpointerup=()=>drag=false;r.domElement.onpointermove=e=>{if(state.walk&&drag){euler.setFromQuaternion(camera.quaternion);euler.y-=(e.clientX-lx)*.003;euler.x=T.MathUtils.clamp(euler.x-(e.clientY-ly)*.003,-1.3,1.3);camera.quaternion.setFromEuler(euler);lx=e.clientX;ly=e.clientY;}};onkeydown=e=>{pressed.add(e.code);if(e.code==='KeyE')setFrame(state.frame>25?1:49);if(e.code==='Escape'){state.walk=false;controls.enabled=true;}};onkeyup=e=>pressed.delete(e.code);
function move(dt){if(!state.walk)return;const f=new T.Vector3(0,0,-1).applyQuaternion(camera.quaternion);f.y=0;f.normalize();const right=new T.Vector3().crossVectors(f,new T.Vector3(0,1,0));const d=new T.Vector3();if(pressed.has('KeyW'))d.add(f);if(pressed.has('KeyS'))d.sub(f);if(pressed.has('KeyD'))d.add(right);if(pressed.has('KeyA'))d.sub(right);d.normalize().multiplyScalar(dt*1.55);for(const axis of['x','z']){const n=camera.position.clone();n[axis]+=d[axis];if(!blocked(n))camera.position[axis]=n[axis];}const y=-camera.position.z;camera.position.y=2.5;if(camera.position.x>10&&camera.position.x<12&&y< -3&&y> -11)camera.position.y=2.5+1.45*Math.sin((y+11)/8*Math.PI);}
