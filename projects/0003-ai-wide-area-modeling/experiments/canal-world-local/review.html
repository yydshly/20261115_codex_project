<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>运河新工程 · 连续镜头</title><link rel="icon" href="data:,"><style>body{margin:0;background:#111821;color:#e8edf2;font:16px system-ui}main{max-width:1100px;margin:24px auto;padding:0 18px}h1{font-size:24px}p{line-height:1.8;color:#b6c4ce}video{display:block;width:100%;background:#0a1016}a{color:#a8dbd8}button{padding:8px 12px;border:1px solid #678087;background:#273f49;color:#e8edf2;border-radius:5px;cursor:pointer;margin:6px 5px 0 0}#status{font-size:14px}</style><main><h1>运河 → 咖啡店 → 室内回望街道</h1><p>36 秒连续三维实渲染，同一工程、同一条相机路线。未知空间为设计补建。</p><video controls playsinline preload="auto" poster="/result/dataset/warm/hero/rgb.png"></video><div id="status">正在载入影片…</div><div><button data-time="0">全景移动</button><button data-time="13">开门</button><button data-time="17">绕椅进门</button><button data-time="21">室内</button><button data-time="28">转身回望</button><button data-time="33">走回门外</button></div><p><a href="/">打开高斯／实体交互预览</a></p><p>本片由 Blender Cycles 实际渲染 432 帧、12fps。高斯交互预览是独立的多视角融合结果，清晰度和透明材质仍有差距。影片没有用镜头切换掩盖空间缺失。</p></main><script>const v=document.querySelector('video');fetch('/result/canal-world-continuous.mp4').then(r=>{if(!r.ok)throw Error(r.status);return r.blob()}).then(b=>{v.src=URL.createObjectURL(b);document.querySelector('#status').textContent='影片已载入，可拖动或选择片段。'}).catch(e=>document.querySelector('#status').textContent='影片仍在输出，请稍后刷新。');document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{v.currentTime=+b.dataset.time;v.play();});</script></html>
