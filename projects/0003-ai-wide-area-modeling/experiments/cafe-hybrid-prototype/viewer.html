<style>body{margin:0;background:#111923;color:#e8eff7;font:15px system-ui}header{padding:14px 20px}h1{font-size:22px;margin:0 0 9px}button,select{background:#25384d;color:#eff5ff;border:1px solid #6a8195;border-radius:5px;padding:8px 12px;margin:4px 4px 4px 0;cursor:pointer}input{vertical-align:middle}#canvas{width:min(100%,1100px);aspect-ratio:1000/650;margin:0 20px}canvas{display:block;width:100%;height:auto}#note{max-width:1050px;padding:15px 20px;line-height:1.7;color:#b7c7d7}#status{color:#9fdab9}.row{margin:5px 0}</style>
<header><h1>小咖啡店：Blender 实体控制高斯外观</h1><div id="status">加载新工程与高斯分组…</div>
<div class="row"><button data-view="overview">运河全景：当前混合场景</button><button data-view="door">咖啡店近景：高斯混合</button><button data-view="interior">室内看柜台：实体</button><button data-view="reverse">室内看门外：实体</button><button data-view="exterior">外侧看房间：实体</button></div>
<div class="row"><button id="tourPlay">播放连续镜头</button><button id="tourRestart">从头播放</button><label>镜头进度 <input id="tourTime" type="range" min="0" max="28" step="0.02" value="0"></label><span id="tourStage">全景移动 → 靠近 → 开门进入 → 转身</span></div>
<div class="row"><button id="closed">关门</button><button id="open">开门</button><button id="play">播放开门 / 复位</button><label>门动作 <input id="frame" type="range" min="1" max="97" value="1"></label><span id="angle"></span></div>
<div class="row"><button data-light="warm">暖色室内灯</button><button data-light="day">窗侧日光</button><label><input id="wire" type="checkbox">门实体线框</label><label><input id="gauss" type="checkbox" checked>高斯外观层</label></div></header>
<div id="canvas"></div><div id="note">门的动作来自新 Blender 工程导出的逐帧矩阵。门口展示高斯外观与实体混合，室内默认展示新建 PBR 实体，可切换光源。房间、家具、门背面为设计补建；高斯本身仍保留原图光照。本页没有承诺高斯重打光或大范围自由漫游。</div>
<script type="importmap">{"imports":{"three":"/modules/three/build/three.module.js","three/addons/":"/modules/three/examples/jsm/","@sparkjsdev/spark":"/modules/@sparkjsdev/spark/dist/spark.module.js"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import{SparkRenderer,SplatMesh}from'@sparkjsdev/spark';
const layout=await(await fetch('/result/layout.json')).json(),binding=await(await fetch('/result/binding.json')).json();
const tourPath=await(await fetch('/result/tour-path.json')).json();
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(1000,650);renderer.setClearColor(0x142332,1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#canvas').appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(50,1000/650,.05,1000),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=false;controls.enabled=false;
const spark=new SparkRenderer({renderer,enableLod:false,sortRadial:false});scene.add(spark);
function matrix(rows){return new THREE.Matrix4().set(...rows.flat());}
const S=matrix(binding.blender_to_three),Si=S.clone().invert(),base=matrix(layout.cv_to_three_matrix),restInv=matrix(binding.rest_matrix).invert();
const bg=new SplatMesh({url:'/result/background.ply',lod:false,extSplats:true}),skin=new SplatMesh({url:'/result/door-skin.ply',lod:false,extSplats:true});bg.matrixAutoUpdate=false;bg.matrix.copy(base);skin.matrixAutoUpdate=false;scene.add(bg,skin);
const gltf=await new GLTFLoader().loadAsync('/result/cafe-structure.glb');scene.add(gltf.scene);const hinge=gltf.scene.getObjectByName('Door_Hinge');if(!hinge)throw Error('Blender hinge absent from GLB');hinge.matrixAutoUpdate=false;
const wood=[],fronts=[],lines=[];gltf.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;const facade=/^(Front.lintel|Left.front.pier|Middle.front.pier|Right.front.pier|Window.solid.base)/.test(o.name);if(o.name.startsWith('LeafWood')||facade){o.material=Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone();if(facade)fronts.push(o);else{wood.push(o);const line=new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry),new THREE.LineBasicMaterial({color:0x43ffbb,depthTest:false}));line.visible=false;line.renderOrder=20;o.add(line);lines.push(line);}}for(const m of(Array.isArray(o.material)?o.material:[o.material])){if(m.transmission>0||m.name.includes('glass')){m.transmission=0;m.transparent=true;m.opacity=.12;m.depthWrite=false;}if(m.name.includes('emitter'))m.emissiveIntensity=1;}}});
const ambient=new THREE.HemisphereLight(0xbdd2ec,0x3c2b19,.12);scene.add(ambient);let lights=[];
function lighting(mode){for(const l of lights){scene.remove(l);if(l.shadow)l.shadow.map?.dispose();}lights=[];ambient.intensity=mode==='warm'?.45:.7;binding.light_presets[mode].forEach((p,i)=>{const l=new THREE.PointLight(new THREE.Color(...p.color),p.energy*.12,25,2);l.position.set(p.position[0],p.position[2],-p.position[1]);l.castShadow=i===0;l.shadow.mapSize.set(1024,1024);l.shadow.radius=4;l.shadow.bias=-.001;l.shadow.normalBias=.025;scene.add(l);lights.push(l);});gltf.scene.traverse(o=>{if(o.isMesh){for(const m of(Array.isArray(o.material)?o.material:[o.material]))if(m.name.includes('emitter'))m.emissiveIntensity=mode==='warm'?1:0;}});state.light=mode;}
const state={frame:1,view:'overview',light:'warm',hybrid:true,wire:false,playing:false};
const tour={time:0,playing:false,start:0,capture:false};
const tourKeys=tourPath.keyframes.map(k=>{const position=new THREE.Vector3(...k.position).applyMatrix4(S),target=new THREE.Vector3(...k.target).applyMatrix4(S);return {...k,position,quaternion:new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().lookAt(position,target,new THREE.Vector3(0,1,0)))};});
function pauseTour(){tour.playing=false;document.querySelector('#tourPlay').textContent='播放连续镜头';}
function applyFrame(f){f=Math.max(1,Math.min(97,Math.round(f)));state.frame=f;const pose=binding.frames[f-1];const delta=S.clone().multiply(matrix(pose.matrix)).multiply(restInv).multiply(Si);hinge.matrix.copy(delta);skin.matrix.copy(delta.clone().multiply(base));scene.updateMatrixWorld(true);document.querySelector('#frame').value=f;document.querySelector('#angle').textContent=(pose.angle*180/Math.PI).toFixed(1)+'°';}
function layers(){bg.visible=skin.visible=state.hybrid;for(const o of [...wood,...fronts])for(const m of(Array.isArray(o.material)?o.material:[o.material]))m.visible=!state.hybrid;for(const l of lines)l.visible=state.wire;document.querySelector('#gauss').checked=state.hybrid;}
function pose(name){pauseTour();state.view=name;state.playing=false;camera.clearViewOffset();const height=name==='overview'?563:650;renderer.setSize(1000,height);document.querySelector('#canvas').style.aspectRatio=`1000/${height}`;let key={'overview':'Original image camera','door':'Original image camera',interior:'Interior toward counter',reverse:'Interior toward entrance',exterior:'Exterior mesh demonstration'}[name];const p=binding.cameras[key],q=p.rotation_quaternion;const M=new THREE.Matrix4().compose(new THREE.Vector3(...p.position),new THREE.Quaternion(q[1],q[2],q[3],q[0]),new THREE.Vector3(1,1,1));M.premultiply(S);camera.matrixAutoUpdate=true;camera.position.setFromMatrixPosition(M);camera.quaternion.setFromRotationMatrix(M);
 if(name==='door'||name==='overview'){camera.aspect=layout.original_size[0]/layout.original_size[1];camera.fov=THREE.MathUtils.radToDeg(2*Math.atan(layout.original_size[1]/(2*layout.focal_px)));camera.updateProjectionMatrix();if(name==='door')camera.setViewOffset(...layout.original_size,170,280,620,403);state.hybrid=true;controls.enabled=false;}
 else{camera.aspect=1000/650;camera.fov=THREE.MathUtils.radToDeg(2*Math.atan(36*650/(2*p.lens*1000)));camera.updateProjectionMatrix();state.hybrid=false;controls.enabled=true;const f=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);controls.target.copy(camera.position).addScaledVector(f,2.5);}
 camera.updateMatrixWorld(true);layers();}
function setTourTime(seconds){
 const t=THREE.MathUtils.clamp(seconds,0,tourPath.duration);tour.time=t;
 if(state.view!=='tour'){renderer.setSize(...tourPath.render_size);document.querySelector('#canvas').style.aspectRatio=tourPath.render_size.join('/');camera.clearViewOffset();}
 state.view='tour';state.playing=false;state.hybrid=true;state.wire=false;controls.enabled=false;layers();if(state.light!=='warm')lighting('warm');
 let index=tourKeys.findIndex(k=>k.time>=t);if(index<0)index=tourKeys.length-1;
 const b=tourKeys[index],a=tourKeys[Math.max(0,index-1)],u=a===b?0:THREE.MathUtils.smoothstep(t,a.time,b.time);
 camera.position.copy(a.position).lerp(b.position,u);camera.quaternion.copy(a.quaternion).slerp(b.quaternion,u);camera.aspect=tourPath.render_size[0]/tourPath.render_size[1];camera.fov=THREE.MathUtils.lerp(a.fov,b.fov,u);camera.updateProjectionMatrix();camera.updateMatrixWorld(true);
 const d=tourPath.door_motion,f=THREE.MathUtils.lerp(d.from_frame,d.to_frame,THREE.MathUtils.clamp((t-d.start)/(d.end-d.start),0,1));applyFrame(f);
 document.querySelector('#tourTime').value=t;document.querySelector('#tourStage').textContent=`${t.toFixed(1)} / ${tourPath.duration} 秒 · ${b.label}`;
}
function startTour(restart=false){if(restart||state.view!=='tour'||tour.time>=tourPath.duration-.01)tour.time=0;setTourTime(tour.time);tour.start=performance.now()-tour.time*1000;tour.playing=true;document.querySelector('#tourPlay').textContent='暂停连续镜头';}
document.querySelector('#tourPlay').onclick=()=>tour.playing?pauseTour():startTour();document.querySelector('#tourRestart').onclick=()=>startTour(true);document.querySelector('#tourTime').oninput=e=>{pauseTour();setTourTime(Number(e.target.value));};
window.tourSnapshot=()=>({time:tour.time,camera:camera.matrixWorld.toArray(),position:camera.position.toArray(),quaternion:camera.quaternion.toArray(),fov:camera.fov,doorFrame:state.frame,doorAngle:binding.frames[state.frame-1].angle,background:bg.matrix.toArray(),skin:skin.matrix.toArray(),hybrid:state.hybrid,backgroundVisible:bg.visible,skinVisible:skin.visible,light:state.light,hiddenProxyMaterialCount:[...wood,...fronts].flatMap(o=>Array.isArray(o.material)?o.material:[o.material]).filter(m=>!m.visible).length});
window.renderCafeTour=async(seconds)=>{pauseTour();tour.capture=true;renderer.setAnimationLoop(null);spark.autoUpdate=false;while(spark.sorting)await new Promise(r=>setTimeout(r,5));setTourTime(seconds);scene.updateMatrixWorld(true);for(let i=0;i<2;i++){await spark.update({scene,camera});while(spark.sorting)await new Promise(r=>setTimeout(r,5));}renderer.render(scene,camera);return renderer.domElement.toDataURL('image/png');};
window.cafeTourPath=tourPath;
window.renderCafe=async(options={})=>{state.playing=false;if(options.view)pose(options.view);if(options.light)lighting(options.light);if(options.hybrid!==undefined){state.hybrid=options.hybrid;layers();}if(options.wire!==undefined){state.wire=options.wire;layers();}if(options.frame)applyFrame(options.frame);for(let i=0;i<3;i++){await spark.update({scene,camera});renderer.render(scene,camera);await new Promise(requestAnimationFrame);}await new Promise(r=>setTimeout(r,state.hybrid?350:40));renderer.render(scene,camera);return renderer.domElement.toDataURL('image/png');};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>pose(b.dataset.view));document.querySelectorAll('[data-light]').forEach(b=>b.onclick=()=>lighting(b.dataset.light));document.querySelector('#closed').onclick=()=>{state.playing=false;applyFrame(1)};document.querySelector('#open').onclick=()=>{state.playing=false;applyFrame(49)};document.querySelector('#frame').oninput=e=>{state.playing=false;applyFrame(e.target.value)};document.querySelector('#play').onclick=()=>{state.playing=!state.playing;start=undefined};document.querySelector('#wire').onchange=e=>{state.wire=e.target.checked;layers()};document.querySelector('#gauss').onchange=e=>{state.hybrid=e.target.checked;layers()};
await Promise.all([bg.initialized,skin.initialized]);applyFrame(1);lighting('warm');pose('overview');let start;
renderer.setAnimationLoop(t=>{if(tour.playing){setTourTime((t-tour.start)/1000);if(tour.time>=tourPath.duration)pauseTour();}if(state.playing){if(start===undefined)start=t;applyFrame(1+((t-start)/1000*24)%96);}if(controls.enabled)controls.update();renderer.render(scene,camera);});
window.cafeInfo={gaussians:{background:bg.numSplats,door:skin.numSplats},meshObjects:0,doorMotionSource:'Blender binding.json evaluated matrices',lightScope:'Dynamic PBR mesh lighting only; Gaussian color is baked'};gltf.scene.traverse(o=>{if(o.isMesh)window.cafeInfo.meshObjects++});
window.bindingCheck=()=>({frame:state.frame,hinge:hinge.matrix.toArray(),hingeWorld:hinge.matrixWorld.toArray(),skin:skin.matrix.toArray(),skinWorld:skin.matrixWorld.toArray(),background:bg.matrix.toArray(),state:{...state}});
window.cafeReady=true;document.querySelector('#status').textContent=`实体已载入 · ${skin.numSplats.toLocaleString()} 个门高斯跟随 Blender 动作`;
if(new URLSearchParams(location.search).has('tour'))startTour(true);
</script></html>
