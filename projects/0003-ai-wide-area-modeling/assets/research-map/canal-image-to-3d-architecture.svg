<svg id="architecture-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1040" role="group" aria-labelledby="graph-title graph-description"><style>.graph-legend { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 16px; }
.graph-legend span { display: flex; align-items: center; gap: 7px; }
.graph-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.graph-legend .tested { background: rgb(48, 104, 73); }
.graph-legend .gap { background: rgb(162, 80, 53); }
.graph-legend .read { background: rgb(125, 137, 128); }
.graph-viewport { height: 650px; max-height: 76vh; min-height: 330px; }
.graph-node { cursor: pointer; outline: none; }
.graph-node rect { fill: rgb(255, 254, 249); stroke: rgb(172, 188, 171); stroke-width: 1.5; }
.graph-node.tested .state-dot { fill: rgb(48, 104, 73); }
.graph-node.gap rect { fill: rgb(244, 233, 223); stroke: rgb(182, 132, 98); }
.graph-node.gap .state-dot { fill: rgb(162, 80, 53); }
.graph-node.read .state-dot { fill: rgb(125, 137, 128); }
.graph-node.selected rect, .graph-node:focus-visible rect { stroke: rgb(22, 62, 56); stroke-width: 4; }
.graph-node.dimmed, .graph-edge.dimmed { opacity: 0.18; }
.graph-node text { font-family: system-ui, "Microsoft YaHei", sans-serif; fill: rgb(32, 58, 53); }
.graph-node .node-title { font-size: 20px; font-weight: 600; }
.graph-node .node-sub { font-size: 17px; fill: rgb(87, 108, 94); }
.graph-node .node-state { font-size: 15px; fill: rgb(114, 86, 62); }
.graph-edge path { fill: none; stroke: rgb(129, 147, 126); stroke-width: 2; marker-end: url("#graph-arrow"); }
.graph-edge.pending path { stroke-dasharray: 7, 6; }
.graph-edge.quick path { stroke: rgb(53, 111, 84); stroke-width: 2.5; }
.graph-edge text { font: 15px system-ui, "Microsoft YaHei", sans-serif; fill: rgb(86, 107, 90); paint-order: stroke; stroke: rgb(237, 240, 231); stroke-width: 6px; stroke-linejoin: round; }
.graph-label { font: 19px system-ui, "Microsoft YaHei", sans-serif; fill: rgb(108, 126, 108); }
.graph-gap-label { font: 16px system-ui, "Microsoft YaHei", sans-serif; fill: rgb(154, 83, 56); }</style><title id="graph-title">单图到完整可编辑三维场景的研究架构</title><desc id="graph-description">目标路线先建立空间约束并验收，产生高斯外观与网格结构，再绑定与处理材质灯光。独立的快速路线由 SHARP 直接预测单图高斯，不需要先运行 VGGT。节点可点击查看证据。</desc><defs><marker id="graph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#81937e"/></marker></defs><rect width="1120" height="1040" fill="#edf0e7"/><text x="25" y="35" class="graph-label">目标路线：先共同空间，再让高斯与实体协作</text><text x="25" y="550" class="graph-label">已实测支线（不经 VGGT）</text><text x="565" y="274" class="graph-gap-label">未通过 → 返回补全；本批图没有训练高斯</text><path d="M 918 225 C 918 247 687 247 687 225" fill="none" stroke="#a86c48" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#graph-arrow)"/><g class="graph-edge pending" data-from="input" data-to="geometry" data-edge-route="target"><path d="M 250 157 C 275 157 275 157 300 157"/><text x="275" y="141" text-anchor="middle">原图 / 多图</text></g><g class="graph-edge pending" data-from="geometry" data-to="completion" data-edge-route="target"><path d="M 525 157 C 550 157 550 157 575 157"/><text x="550" y="141" text-anchor="middle">几何线索</text></g><g class="graph-edge pending" data-from="completion" data-to="validate" data-edge-route="target"><path d="M 800 157 C 825 157 825 157 850 157"/><text x="825" y="141" text-anchor="middle">受约束候选</text></g><g class="graph-edge pending" data-from="geometry" data-to="validate" data-edge-route="photo"><path d="M 410 90 C 410 48 960 48 960 90"/><text x="650" y="52" text-anchor="middle">重叠实拍</text></g><g class="graph-edge pending" data-from="validate" data-to="gaussian" data-edge-route="target"><path d="M 962 225 C 962 287.5 687 287.5 687 350"/><text x="852.5" y="293.5" text-anchor="middle">通过后</text></g><g class="graph-edge pending" data-from="validate" data-to="mesh" data-edge-route="target"><path d="M 962 225 C 962 287.5 962 287.5 962 350"/><text x="990" y="293.5" text-anchor="middle">通过后</text></g><g class="graph-edge pending" data-from="gaussian" data-to="binding" data-edge-route="target"><path d="M 687 485 C 687 537.5 687 537.5 687 590"/><text x="715" y="543.5" text-anchor="middle">外观</text></g><g class="graph-edge pending" data-from="mesh" data-to="binding" data-edge-route="target"><path d="M 962 485 C 962 537.5 687 537.5 687 590"/><text x="852.5" y="543.5" text-anchor="middle">结构</text></g><g class="graph-edge pending" data-from="binding" data-to="lighting" data-edge-route="target"><path d="M 800 657 C 825 657 825 657 850 657"/><text x="825" y="641" text-anchor="middle">物体关系</text></g><g class="graph-edge pending" data-from="lighting" data-to="delivery" data-edge-route="target"><path d="M 962 725 C 962 787.5 962 787.5 962 850"/><text x="990" y="793.5" text-anchor="middle">分别验收</text></g><g class="graph-edge quick" data-from="input" data-to="sharp" data-edge-route="quick"><path d="M 137 225 C 137 407.5 137 407.5 137 590"/><text x="165" y="413.5" text-anchor="middle">原图</text></g><g class="graph-edge quick" data-from="sharp" data-to="quickgs" data-edge-route="quick"><path d="M 137 725 C 137 787.5 137 787.5 137 850"/><text x="165" y="793.5" text-anchor="middle">预测 PLY</text></g><g class="graph-edge quick" data-from="quickgs" data-to="viewer" data-edge-route="quick"><path d="M 250 917 C 275 917 275 917 300 917"/><text x="275" y="901" text-anchor="middle">真实渲染</text></g><g class="graph-node tested" transform="translate(25 90)" data-node="input" role="button" tabindex="0" aria-label="01 / 图像入口，已有输入，点击查看输入输出和实验证据" aria-pressed="false"><title>固定来源，区分原图信息与后续设计。实拍路线则需要不同位置、足够重叠的多张照片。</title><rect width="225" height="135" rx="10"/><circle cx="18" cy="22" r="5" class="state-dot"/><text x="30" y="28" class="node-state">已有输入</text><text x="16" y="68" class="node-title">01 / 图像入口</text><text x="16" y="104" class="node-sub">唯一 AI 运河概念图</text></g><g class="graph-node tested" transform="translate(300 90)" data-node="geometry" role="button" tabindex="0" aria-label="02 / 相机与可见几何，VGGT 已实测，点击查看输入输出和实验证据" aria-pressed="false"><title>估计可见空间关系，为对齐、投影、诊断和后续重建提供几何线索。VGGT 本身是训练过的 AI 模型。</title><rect width="225" height="135" rx="10"/><circle cx="18" cy="22" r="5" class="state-dot"/><text x="30" y="28" class="node-state">VGGT 已实测</text><text x="16" y="68" class="node-title">02 / 相机与可见几何</text><text x="16" y="104" class="node-sub">VGGT · COLMAP（调研）</text></g><g class="graph-node gap" transform="translate(575 90)" data-node="completion" role="button" tabindex="0" aria-label="03 / 未知空间补全，主要瓶颈 · 未通过，点击查看输入输出和实验证据" aria-pressed="false"><title>补充背面、侧面、门口、室内等未见区域。也可先明确设计布局，再约束外观生成，代价是人工制作。</title><rect width="225" height="135" rx="10"/><circle cx="18" cy="22" r="5" class="state-dot"/><text x="30" y="28" class="node-state">主要瓶颈 · 未通过</text><text x="16" y="68" class="node-title">03 / 未知空间补全</text><text x="16" y="104" class="node-sub">共享空间与相机约束</text></g><g class="graph-node tested" transform="translate(850 90)" data-node="validate" role="button" tabindex="0" aria-label="04 / 共同空间检查，诊断已跑 · 场景未过，点击查看输入输出和实验证据" aria-pressed="true"><title>识别“相似图片”与“能被同一空间解释”之间的差距。冻结场景后，还要留出视角、检查回环和连续遮挡。</title><rect width="225" height="135" rx="10"/><circle cx="18" cy="22" r="5" class="state-dot"/><text x="30" y="28" class="node-state">诊断已跑 · 场景未过</text><text x="16" y="68" class="node-title">04 / 共同空间检查</text><text x="16" y="104" class="node-sub">独立对应 · 固定投影</text></g><g class="graph-node read" transform="translate(575 350)" data-node="gaussian" role="button" tabindex="0" aria-label="05A / 高斯外观，多图训练待验证，点击查看输入输出和实验证据" aria-pressed="false"><title>在有观测支持的角度保留细节与照片观感。高斯不是天然只能看一个方向。</title><rect width="225" height="135" rx="10"/><circle cx="18" cy="22" r="5" class="state-dot"/><text x="30" y="28" class="node-state">多图训练待验证</text><text x="16" y="68" class="node-title">05A / 高斯外观</text><text x="16" y="104" class="node-sub">空间位置 + 颜色 / 透明度</text></g><g class="graph-node tested" transform="translate(850 350)" data-node="mesh" role="button" tabindex="0" aria-label="05B / 实体结构，设计结构已实测，点击查看输入输出和实验证据" aria-pressed="false"><title>提供选择、修改、碰撞／遮挡和动作的结构基础。已设计小咖啡店和完整场景对照。</title><rect width="225" height="135" rx="10"/><circle cx="18" cy="22" r="5" class="state-dot"/><text x="30" y="28" class="node-state">设计结构已实测</text><text x="16" y="68" class="node-title">05B / 实体结构</text><text x="16" y="104" class="node-sub">网格 · 分件 · 门轴 / 内部</text></g><g class="graph-node tested" transform="translate(575 590)" data-node="binding" role="button" tabindex="0" aria-label="06 / 对齐与物体绑定，局部门轴已验证，点击查看输入输出和实验证据" aria-pressed="false"><title>已验证 Blender 门矩阵驱动门高斯。局部表面绑定更接近原机位外观，可复用动作传递。</title><rect width="225" height="135" rx="10"/><circle cx="18" cy="22" r="5" class="state-dot"/><text x="30" y="28" class="node-state">局部门轴已验证</text><text x="16" y="68" class="node-title">06 / 对齐与物体绑定</text><text x="16" y="104" class="node-sub">同坐标 · 表面对应 · 身份</text></g><g class="graph-node gap" transform="translate(850 590)" data-node="lighting" role="button" tabindex="0" aria-label="07 / 材质、动作与换光，物理换光未通过，点击查看输入输出和实验证据" aria-pressed="false"><title>实体结构的开门和暖／日光演示已运行；普通高斯的原有灯光不会因此自动改变。</title><rect width="225" height="135" rx="10"/><circle cx="18" cy="22" r="5" class="state-dot"/><text x="30" y="28" class="node-state">物理换光未通过</text><text x="16" y="68" class="node-title">07 / 材质、动作与换光</text><text x="16" y="104" class="node-sub">同一几何下独立验收</text></g><g class="graph-node read" transform="translate(850 850)" data-node="delivery" role="button" tabindex="0" aria-label="08 / 可复用三维成品，最终目标 · 尚未达到，点击查看输入输出和实验证据" aria-pressed="false"><title>可在同一空间反复摆机位、制作影片、检查对象和复用资产。现有网页可查看实验产物。</title><rect width="225" height="135" rx="10"/><circle cx="18" cy="22" r="5" class="state-dot"/><text x="30" y="28" class="node-state">最终目标 · 尚未达到</text><text x="16" y="68" class="node-title">08 / 可复用三维成品</text><text x="16" y="104" class="node-sub">自由查看 · 编辑 · 重开复核</text></g><g class="graph-node tested" transform="translate(25 590)" data-node="sharp" role="button" tabindex="0" aria-label="A / 单图直接预测，独立路线已跑通，点击查看输入输出和实验证据" aria-pressed="false"><title>直接从图像预测局部三维高斯，保留原机位的纹理、颜色与光影，存在小范围视差。</title><rect width="225" height="135" rx="10"/><circle cx="18" cy="22" r="5" class="state-dot"/><text x="30" y="28" class="node-state">独立路线已跑通</text><text x="16" y="68" class="node-title">A / 单图直接预测</text><text x="16" y="104" class="node-sub">Apple SHARP</text></g><g class="graph-node tested" transform="translate(25 850)" data-node="quickgs" role="button" tabindex="0" aria-label="B / 单图高斯结果，原机位附近较可靠，点击查看输入输出和实验证据" aria-pressed="false"><title>实际保留照片感，并能改变观察位置；可以作为局部外观和诊断的起点。</title><rect width="225" height="135" rx="10"/><circle cx="18" cy="22" r="5" class="state-dot"/><text x="30" y="28" class="node-state">原机位附近较可靠</text><text x="16" y="68" class="node-title">B / 单图高斯结果</text><text x="16" y="104" class="node-sub">独立的 PLY 三维数据</text></g><g class="graph-node tested" transform="translate(300 850)" data-node="viewer" role="button" tabindex="0" aria-label="C / 渲染与小范围查看，5 机位 / 60 帧，点击查看输入输出和实验证据" aria-pressed="false"><title>让使用者直接拖动并观察视差与缺陷，保留同一份场景数据。</title><rect width="225" height="135" rx="10"/><circle cx="18" cy="22" r="5" class="state-dot"/><text x="30" y="28" class="node-state">5 机位 / 60 帧</text><text x="16" y="68" class="node-title">C / 渲染与小范围查看</text><text x="16" y="104" class="node-sub">Spark + Three.js</text></g></svg>