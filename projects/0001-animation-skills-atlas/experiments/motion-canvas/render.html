<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Motion Canvas 案例导出</title><style>body{font:16px system-ui;background:#f3f2eb;color:#203a35;padding:40px}button{padding:14px 24px}canvas{display:block;width:min(100%,960px);margin-top:24px;border:1px solid #d7dfd0}</style><h1>真实 Motion Canvas Renderer</h1><p>1280 × 720 / 24 FPS / 图片序列 → FFmpeg 编码</p><button id="render">渲染当前案例</button><p id="status">准备就绪</p><pre id="errors"></pre><script type="module">
import project from '/src/study-project.ts?project';
import {Renderer,Vector2} from '@motion-canvas/core';
import {DURATION,REVISION} from '/src/scenes/study.tsx';
const renderer=new Renderer(project);document.body.append(renderer.stage.finalBuffer);
project.logger.onLogged.subscribe(e=>{if(e.level==='error')document.querySelector('#errors').textContent+=e.message+'\n'});
renderer.onFrameChanged.subscribe(f=>document.querySelector('#status').textContent='正在渲染：'+f+' / '+DURATION*24);
document.querySelector('#render').onclick=async()=>{document.querySelector('#render').disabled=true;const start=performance.now();let result;renderer.onFinished.subscribe(r=>result=r);await renderer.render({...project.meta.getFullRenderingSettings(),name:'canvas-v'+REVISION,size:new Vector2(1280,720),resolutionScale:1,fps:24,range:[0,DURATION-1/24],exporter:{name:'@motion-canvas/core/image-sequence',options:{fileType:'image/png',quality:100,groupByScene:false}}});const data={engine:'motion-canvas',revision:REVISION,wallSeconds:Math.round((performance.now()-start))/1000,result};document.querySelector('#status').textContent='完成 '+JSON.stringify(data);await fetch('/record-render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});document.querySelector('#render').disabled=false;};
</script></html>
